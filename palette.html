<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Artist Palette</title>
<script src="mixbox.js" onerror="document.getElementById('load-error').style.display='block'"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100dvh;
  overflow: hidden;
  touch-action: none;
  background: #2a2520;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  user-select: none;
  -webkit-user-select: none;
}

#app {
  display: grid;
  grid-template-columns: 260px 1fr;
  height: 100dvh;
  gap: 0;
}

/* ── Palette Panel ── */
#palette-panel {
  background: #3a342e;
  display: flex;
  flex-direction: column;
  padding: 10px;
  gap: 8px;
  overflow: hidden;
}

#color-squares {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 2px;
  flex-shrink: 0;
  max-width: 200px;
}
.color-swatch {
  aspect-ratio: 1;
  border-radius: 50%;
  border: 1px solid transparent;
  max-width: 30px;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.1s;
  position: relative;
  overflow: hidden;
}
.color-swatch canvas {
  width: 100%; height: 100%;
  border-radius: 50%;
  display: block;
}
.color-swatch.selected {
  border-color: #fff;
  box-shadow: 0 0 0 2px #555, 0 0 12px rgba(255,255,255,0.3);
  transform: scale(1.08);
  z-index: 1;
}
.color-swatch:active { transform: scale(0.95); }

#brush-preview-container {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  flex-shrink: 0;
}
#brush-preview {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 2px solid #666;
  background: #222;
  flex-shrink: 0;
  transition: background-color 0.15s;
}
#brush-label {
  color: #aaa;
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#wells-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  flex: 1;
  min-height: 0;
}
.well-container {
  position: relative;
  border-radius: 10px;
  background: #c8bba8;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.4), inset 0 -1px 2px rgba(255,255,255,0.15);
  overflow: hidden;
}
.well-canvas {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 10px;
  cursor: crosshair;
}
.well-clear {
  position: absolute;
  top: 3px; right: 3px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: rgba(0,0,0,0.4);
  color: #ccc;
  border: none;
  font-size: 11px;
  line-height: 18px;
  text-align: center;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 2;
}
.well-container:hover .well-clear,
.well-container:active .well-clear { opacity: 1; }

#water-jar {
  flex-shrink: 0;
  height: 52px;
  border-radius: 8px;
  border: 2px solid #665e54;
  background: linear-gradient(to bottom, rgba(180,210,240,0.15) 0%, rgba(140,190,230,0.5) 100%);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #aaa;
  font-size: 12px;
  position: relative;
  overflow: hidden;
  transition: background 0.3s;
}
#water-jar-fill {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 70%;
  background: rgba(160,200,235,0.35);
  transition: background 0.5s;
  pointer-events: none;
}
#water-jar-label { position: relative; z-index: 1; pointer-events: none; }
#water-jar:active { background: rgba(180,210,240,0.4); }

#palette-controls {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.ctrl-btn {
  flex: 1;
  padding: 8px 4px;
  border-radius: 6px;
  border: 1px solid #555;
  background: #4a433b;
  color: #ccc;
  font-size: 11px;
  cursor: pointer;
  white-space: nowrap;
}
.ctrl-btn:active { background: #5a534b; }

#brush-size-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-shrink: 0;
  padding: 4px 0;
}
.size-dot {
  border-radius: 50%;
  background: #999;
  cursor: pointer;
  transition: background 0.15s, box-shadow 0.15s;
  flex-shrink: 0;
}
.size-dot:active { background: #ccc; }
.size-dot.selected {
  background: #fff;
  box-shadow: 0 0 0 2px #666, 0 0 8px rgba(255,255,255,0.3);
}

/* ── Canvas Panel ── */
#canvas-panel {
  display: flex;
  flex-direction: column;
  background: #555;
  position: relative;
}
#drawing-canvas {
  flex: 1;
  display: block;
  cursor: crosshair;
  background: #f5f3ee;
}

/* Portrait / phone layout */
@media (max-width: 600px) {
  #app {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
  }
  #palette-panel {
    flex-direction: column;
    padding: 6px;
    gap: 4px;
    max-height: none;
    overflow: visible;
  }
  #color-squares {
    grid-template-columns: repeat(6, 1fr);
    gap: 2px;
  }
  .color-swatch {
    border-width: 2px;
  }
  #brush-preview-container { padding: 2px 0; }
  #brush-preview { width: 28px; height: 28px; }
  #wells-grid {
    grid-template-columns: repeat(3, 1fr);
    min-height: 70px;
    max-height: 90px;
  }
  #water-jar { height: 36px; font-size: 11px; }
  #brush-size-container { gap: 5px; }
  #palette-controls { gap: 4px; }
  .ctrl-btn { padding: 6px 4px; font-size: 10px; }
}

/* Very small phones (iPhone SE etc.) */
@media (max-width: 380px) {
  #color-squares {
    grid-template-columns: repeat(4, 1fr);
  }
  #wells-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* Landscape phone */
@media (max-height: 500px) and (min-aspect-ratio: 1/1) {
  #app { grid-template-columns: 200px 1fr; }
  #palette-panel { padding: 6px; gap: 4px; }
  #color-squares { gap: 3px; }
  .color-swatch { border-width: 2px; }
  #brush-preview { width: 24px; height: 24px; }
  #water-jar { height: 32px; font-size: 10px; }
  .ctrl-btn { padding: 5px 3px; font-size: 10px; }
}
</style>
</head>
<body>
<div id="debug-log" style="position:fixed;bottom:30px;right:6px;max-width:50%;max-height:200px;overflow-y:auto;background:rgba(0,0,0,0.85);color:#0f0;font-family:monospace;font-size:10px;padding:6px;border-radius:4px;z-index:99999;pointer-events:none;word-break:break-all"></div>
<script>
const _dbg=document.getElementById('debug-log');
function dbg(msg){_dbg.textContent+=msg+'\n';_dbg.scrollTop=_dbg.scrollHeight;console.log('[DBG]',msg);}
window.onerror=function(m,s,l){dbg('ERR:'+m+' L'+l);};
</script>
<div id="load-error" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#2a2520;color:#f88;font-family:monospace;padding:20px;z-index:99999;font-size:14px">
  <p>ERROR: mixbox.js failed to load</p>
  <p style="color:#aaa;margin-top:10px">page:palette v4</p>
  <p style="color:#666;margin-top:5px" id="error-url"></p>
  <script>document.getElementById('error-url').textContent='URL: '+location.href</script>
</div>
<div id="app">
  <div id="palette-panel">
    <div id="color-squares"></div>
    <div id="brush-preview-container">
      <div id="brush-preview"></div>
      <span id="brush-label">Tap a color to start</span>
    </div>
    <div id="wells-grid"></div>
    <div id="water-jar">
      <div id="water-jar-fill"></div>
      <span id="water-jar-label">Water Jar &middot; tap: dilute &middot; hold: clean</span>
    </div>
    <div id="brush-size-container"></div>
    <div id="palette-controls">
      <button class="ctrl-btn" id="clean-palette">Clean Wells</button>
      <button class="ctrl-btn" id="clear-canvas-btn">Clear Canvas</button>
    </div>
  </div>
  <div id="canvas-panel">
    <canvas id="drawing-canvas"></canvas>
  </div>
</div>

<script>
(function() {
'use strict';

const LATENT_SIZE = typeof mixbox !== 'undefined' ? mixbox.LATENT_SIZE : 7;
const PALETTE_COLORS = [
  { name: 'Cadmium Yellow',    rgb: [254, 212, 48]  },
  { name: 'Yellow Ochre',      rgb: [198, 155, 52]  },
  { name: 'Cadmium Red',       rgb: [210, 42, 30]   },
  { name: 'Alizarin Crimson',  rgb: [171, 30, 54]   },
  { name: 'Ultramarine Blue',  rgb: [36, 42, 142]   },
  { name: 'Cerulean Blue',     rgb: [18, 116, 172]  },
  { name: 'Viridian',          rgb: [32, 108, 84]   },
  { name: 'Sap Green',         rgb: [74, 118, 40]   },
  { name: 'Burnt Sienna',      rgb: [148, 74, 34]   },
  { name: 'Raw Umber',         rgb: [115, 85, 48]   },
  { name: 'Chinese White',     rgb: [245, 243, 238] },
  { name: 'Lamp Black',        rgb: [38, 36, 34]    },
];

const WHITE_LATENT = mixbox.rgbToLatent([245, 243, 238]);
const DPR = Math.min(window.devicePixelRatio || 1, 2);

// ── State ──
const state = {
  brushColor: null,
  brushLatent: null,
  brushBaseSize: 14,
  isDrawing: false,
  activeTarget: null,
  lastPoint: null,
  waterJarTint: [180, 210, 240],
  waterJarDirty: 0,
  wellStrokeDabs: 0, // count dabs in current well stroke
};

// ── Wells ──
const wells = [];
const NUM_WELLS = 6;

// ── Drawing canvas (WebGL) ──
let drawCanvas;
let gl, fluidSim;

// ════════════════════════════════════════════
//  COLOR PALETTE
// ════════════════════════════════════════════

function createColorSquares() {
  const container = document.getElementById('color-squares');
  PALETTE_COLORS.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'color-swatch';
    // Create a small canvas for dry paint texture
    const cv = document.createElement('canvas');
    const sz = 64;
    cv.width = sz; cv.height = sz;
    const ctx = cv.getContext('2d');
    renderDryPaintTexture(ctx, sz, c.rgb);
    el.appendChild(cv);
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      selectColor(c.rgb, i);
    });
    container.appendChild(el);
  });
}

function renderDryPaintTexture(ctx, sz, rgb) {
  const imgData = ctx.createImageData(sz, sz);
  const px = imgData.data;
  const cx = sz / 2, cy = sz / 2, maxR = sz / 2;
  for (let y = 0; y < sz; y++) {
    for (let x = 0; x < sz; x++) {
      const dx = x - cx, dy = y - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > maxR) continue;
      const nd = dist / maxR;
      // Dry paint: thicker in center, granular texture, edge buildup
      const grain = 0.7 + Math.random() * 0.3;
      const edge = nd > 0.75 ? 1 + (nd - 0.75) * 2 : 1;
      const center = 1 - nd * 0.3;
      const intensity = grain * center * edge;
      // Darken slightly for depth, lighten for dry crust spots
      const crust = Math.random() > 0.92 ? 1.15 : 1;
      const pi = (y * sz + x) * 4;
      px[pi]     = Math.min(255, Math.round(rgb[0] * intensity * crust));
      px[pi + 1] = Math.min(255, Math.round(rgb[1] * intensity * crust));
      px[pi + 2] = Math.min(255, Math.round(rgb[2] * intensity * crust));
      px[pi + 3] = Math.round(255 * Math.min(1, (1 - nd) * 4) * (0.85 + Math.random() * 0.15));
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function selectColor(rgb, idx) {
  state.brushColor = [...rgb];
  state.brushLatent = mixbox.rgbToLatent(rgb);
  const prev = document.getElementById('brush-preview');
  prev.style.background = `rgb(${rgb.join(',')})`;
  document.getElementById('brush-label').textContent =
    idx !== undefined ? PALETTE_COLORS[idx].name : `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
  document.querySelectorAll('.color-swatch').forEach((el, i) =>
    el.classList.toggle('selected', i === idx));
}

function updateBrushFromRgb(rgb) {
  state.brushColor = [...rgb];
  state.brushLatent = mixbox.rgbToLatent(rgb);
  document.getElementById('brush-preview').style.background = `rgb(${rgb.join(',')})`;
  document.getElementById('brush-label').textContent = 'Mixed';
  document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('selected'));
}

// ════════════════════════════════════════════
//  MIXING WELLS
// ════════════════════════════════════════════

function createWells() {
  const grid = document.getElementById('wells-grid');
  for (let i = 0; i < NUM_WELLS; i++) {
    const container = document.createElement('div');
    container.className = 'well-container';

    const canvas = document.createElement('canvas');
    canvas.className = 'well-canvas';
    container.appendChild(canvas);

    const clearBtn = document.createElement('button');
    clearBtn.className = 'well-clear';
    clearBtn.textContent = '\u00d7';
    clearBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      clearWell(i);
    });
    container.appendChild(clearBtn);
    grid.appendChild(container);

    const well = { canvas, ctx: null, latentBuffer: null, alphaBuffer: null, w: 0, h: 0 };
    wells.push(well);
    setupPointer(canvas, 'well', i);
  }
  requestAnimationFrame(() => wells.forEach(w => initWell(w)));
  new ResizeObserver(() => wells.forEach(w => initWell(w))).observe(grid);
}

function initWell(well) {
  const rect = well.canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const w = Math.floor(rect.width * DPR);
  const h = Math.floor(rect.height * DPR);
  if (well.w === w && well.h === h) return;
  well.canvas.width = w;
  well.canvas.height = h;
  well.w = w; well.h = h;
  well.ctx = well.canvas.getContext('2d', { willReadFrequently: true });
  well.ctx.scale(DPR, DPR);
  well.latentBuffer = new Float64Array(w * h * LATENT_SIZE);
  well.alphaBuffer = new Float32Array(w * h);
  const wl = mixbox.rgbToLatent([255, 255, 255]);
  for (let i = 0; i < w * h; i++) {
    for (let j = 0; j < LATENT_SIZE; j++)
      well.latentBuffer[i * LATENT_SIZE + j] = wl[j];
    well.alphaBuffer[i] = 1;
  }
  // Paint well white (not transparent)
  well.ctx.fillStyle = '#fff';
  well.ctx.fillRect(0, 0, rect.width, rect.height);
}

function clearWell(i) {
  const w = wells[i];
  if (!w.ctx) return;
  const rect = w.canvas.getBoundingClientRect();
  w.ctx.clearRect(0, 0, rect.width, rect.height);
  const wl = mixbox.rgbToLatent([255, 255, 255]);
  for (let i = 0; i < w.w * w.h; i++)
    for (let j = 0; j < LATENT_SIZE; j++)
      w.latentBuffer[i * LATENT_SIZE + j] = wl[j];
  w.alphaBuffer.fill(1);
  // Repaint white
  const rect2 = w.canvas.getBoundingClientRect();
  w.ctx.fillStyle = '#fff';
  w.ctx.fillRect(0, 0, rect2.width, rect2.height);
}

// ════════════════════════════════════════════
//  WEBGL FLUID WATERCOLOR ENGINE
// ════════════════════════════════════════════

// Shader sources
const VERT_SRC = `attribute vec2 a_pos;varying vec2 vUv;void main(){vUv=a_pos*0.5+0.5;gl_Position=vec4(a_pos,0,1);}`;

// ── Splat dye: samples paper height for dry-brush effect ──
const SPLAT_FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uTarget;
uniform sampler2D uPaper;
uniform sampler2D uWetness;
uniform vec2 uPoint;
uniform float uRadius;
uniform vec3 uColor;
uniform float uAspect;
uniform float uWaterContent;  // 0=dry brush, 1=fully wet
void main(){
  vec2 p=vUv-uPoint;
  p.x*=uAspect;
  float d=dot(p,p);
  float r2=uRadius*uRadius;
  float s=exp(-d/r2);

  // Paper height for dry-brush: skip valleys when brush is dry
  float paperH=texture2D(uPaper,vUv).r;
  // Dry-brush threshold: low water = only paint on peaks
  float dryThresh=mix(0.97, 0.0, uWaterContent);
  float paperMask=smoothstep(dryThresh-0.03, dryThresh+0.03, paperH);
  s*=paperMask;

  // Wet-on-wet: existing wetness causes more spread/blending
  float existingWet=texture2D(uWetness,vUv).r;
  float wetBlend=1.0+existingWet*0.6; // paint spreads more on wet surface
  s*=wetBlend;

  vec3 base=texture2D(uTarget,vUv).rgb;
  // On wet surface, mix with existing color instead of pure additive
  float mixFactor=existingWet*0.4;
  vec3 blended=mix(base+uColor*s, mix(base,uColor,s*0.5), mixFactor);
  gl_FragColor=vec4(blended,1.0);
}`;

// ── Simple additive splat (for wetness) ──
const SPLAT_SIMPLE_FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uTarget;
uniform vec2 uPoint;
uniform float uRadius;
uniform vec3 uColor;
uniform float uAspect;
void main(){
  vec2 p=vUv-uPoint;
  p.x*=uAspect;
  float d=dot(p,p);
  float r2=uRadius*uRadius;
  float s=exp(-d/r2);
  vec3 base=texture2D(uTarget,vUv).rgb;
  gl_FragColor=vec4(base+uColor*s,1.0);
}`;

const SPLAT_VEL_FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uTarget;
uniform sampler2D uWetness;
uniform vec2 uPoint;
uniform float uRadius;
uniform vec2 uVel;
uniform float uAspect;
void main(){
  vec2 p=vUv-uPoint;
  p.x*=uAspect;
  float d=dot(p,p);
  float r2=uRadius*uRadius;
  float s=exp(-d/r2);
  // More velocity on wet surface (paint slides on wet)
  float existingWet=texture2D(uWetness,vUv).r;
  s*=1.0+existingWet*1.5;
  vec2 base=texture2D(uTarget,vUv).xy;
  gl_FragColor=vec4(base+uVel*s,0,1);
}`;

const ADVECT_FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uVelocity;
uniform sampler2D uSource;
uniform vec2 uTexelSize;
uniform float uDt;
uniform float uDissipation;
void main(){
  vec2 vel=texture2D(uVelocity,vUv).xy;
  vec2 coord=vUv-vel*uDt*uTexelSize;
  gl_FragColor=texture2D(uSource,coord)*uDissipation;
}`;

const DIVERGENCE_FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uVelocity;
uniform vec2 uTexelSize;
void main(){
  float L=texture2D(uVelocity,vUv-vec2(uTexelSize.x,0)).x;
  float R=texture2D(uVelocity,vUv+vec2(uTexelSize.x,0)).x;
  float B=texture2D(uVelocity,vUv-vec2(0,uTexelSize.y)).y;
  float T=texture2D(uVelocity,vUv+vec2(0,uTexelSize.y)).y;
  gl_FragColor=vec4(0.5*(R-L+T-B),0,0,1);
}`;

const PRESSURE_FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uPressure;
uniform sampler2D uDivergence;
uniform vec2 uTexelSize;
void main(){
  float L=texture2D(uPressure,vUv-vec2(uTexelSize.x,0)).x;
  float R=texture2D(uPressure,vUv+vec2(uTexelSize.x,0)).x;
  float B=texture2D(uPressure,vUv-vec2(0,uTexelSize.y)).x;
  float T=texture2D(uPressure,vUv+vec2(0,uTexelSize.y)).x;
  float div=texture2D(uDivergence,vUv).x;
  gl_FragColor=vec4((L+R+B+T-div)*0.25,0,0,1);
}`;

const GRADIENT_SUB_FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uPressure;
uniform sampler2D uVelocity;
uniform vec2 uTexelSize;
void main(){
  float L=texture2D(uPressure,vUv-vec2(uTexelSize.x,0)).x;
  float R=texture2D(uPressure,vUv+vec2(uTexelSize.x,0)).x;
  float B=texture2D(uPressure,vUv-vec2(0,uTexelSize.y)).x;
  float T=texture2D(uPressure,vUv+vec2(0,uTexelSize.y)).x;
  vec2 vel=texture2D(uVelocity,vUv).xy;
  vel-=vec2(R-L,T-B)*0.5;
  gl_FragColor=vec4(vel,0,1);
}`;

// ── Capillary flow: pigment migrates toward drying edges ──
// This creates the iconic watercolor edge darkening effect
const CAPILLARY_FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uDye;
uniform sampler2D uWetness;
uniform sampler2D uPaper;
uniform vec2 uTexelSize;
uniform float uDt;
void main(){
  float wet=texture2D(uWetness,vUv).r;
  vec3 dye=texture2D(uDye,vUv).rgb;

  // Only active in the drying zone (wetness 0.05-0.35)
  float dryingZone=smoothstep(0.01,0.08,wet)*smoothstep(0.45,0.15,wet);
  if(dryingZone<0.001){
    gl_FragColor=vec4(dye,1.0);
    return;
  }

  // Sample wetness gradient (pigment flows toward drier areas = edges)
  float wL=texture2D(uWetness,vUv-vec2(uTexelSize.x,0.0)).r;
  float wR=texture2D(uWetness,vUv+vec2(uTexelSize.x,0.0)).r;
  float wB=texture2D(uWetness,vUv-vec2(0.0,uTexelSize.y)).r;
  float wT=texture2D(uWetness,vUv+vec2(0.0,uTexelSize.y)).r;

  // Gradient of wetness: pigment migrates TOWARD lower wetness (edges)
  vec2 wetGrad=vec2(wR-wL, wT-wB)*0.5;
  // Flow direction: toward drier areas (negative gradient)
  vec2 capFlow=-wetGrad;

  // Paper texture modulates capillary action (rougher = more wicking)
  float paperH=texture2D(uPaper,vUv).r;
  float paperRoughness=1.0-paperH; // valleys wick more
  float capStrength=dryingZone*0.35*(1.0+paperRoughness*0.8);

  // Advect pigment along capillary flow
  vec2 samplePos=vUv-capFlow*capStrength*uDt*uTexelSize*8.0;
  vec3 advectedDye=texture2D(uDye,samplePos).rgb;

  // Blend: partial transport
  vec3 result=mix(dye, advectedDye, capStrength*uDt*2.0);
  gl_FragColor=vec4(result,1.0);
}`;

// ── Granulation: pigment settles into paper valleys ──
const GRANULATION_FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uDye;
uniform sampler2D uWetness;
uniform sampler2D uPaper;
uniform vec2 uTexelSize;
uniform float uDt;
void main(){
  float wet=texture2D(uWetness,vUv).r;
  vec3 dye=texture2D(uDye,vUv).rgb;

  // Granulation only in drying paint
  float dryingPhase=smoothstep(0.0,0.1,wet)*smoothstep(0.5,0.2,wet);
  if(dryingPhase<0.001){
    gl_FragColor=vec4(dye,1.0);
    return;
  }

  float paperH=texture2D(uPaper,vUv).r;
  // Paper valleys (low height) accumulate pigment; peaks lose pigment
  float valleyFactor=(1.0-paperH); // 0=peak, 1=deep valley
  float peakFactor=paperH;

  // Sample neighbors to redistribute pigment
  vec3 dL=texture2D(uDye,vUv-vec2(uTexelSize.x,0.0)).rgb;
  vec3 dR=texture2D(uDye,vUv+vec2(uTexelSize.x,0.0)).rgb;
  vec3 dB=texture2D(uDye,vUv-vec2(0.0,uTexelSize.y)).rgb;
  vec3 dT=texture2D(uDye,vUv+vec2(0.0,uTexelSize.y)).rgb;
  vec3 avg=(dL+dR+dB+dT)*0.25;

  // Valleys pull pigment in; peaks push pigment out
  float granRate=dryingPhase*0.08*uDt;
  vec3 result=mix(dye, avg, granRate*(peakFactor-0.5)*2.0);
  // Valleys get slightly more concentrated
  result+=dye*valleyFactor*granRate*0.5;

  gl_FragColor=vec4(result,1.0);
}`;

// ── Wetness: advects, dries from edges inward, capillary spread ──
const ADVECT_WET_FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uVelocity;
uniform sampler2D uWetness;
uniform sampler2D uPaper;
uniform vec2 uTexelSize;
uniform float uDt;
uniform float uDryRate;
uniform vec2 uGravity;  // device tilt
void main(){
  vec2 vel=texture2D(uVelocity,vUv).xy;
  // Add gravity/tilt to velocity for wet areas
  float wet=texture2D(uWetness,vUv).r;
  vel+=uGravity*wet*0.5;

  vec2 coord=vUv-vel*uDt*uTexelSize;
  float w=texture2D(uWetness,coord).r;

  // Edge-aware drying: drier at boundary between wet and dry
  float wL=texture2D(uWetness,vUv-vec2(uTexelSize.x,0.0)).r;
  float wR=texture2D(uWetness,vUv+vec2(uTexelSize.x,0.0)).r;
  float wB=texture2D(uWetness,vUv-vec2(0.0,uTexelSize.y)).r;
  float wT=texture2D(uWetness,vUv+vec2(0.0,uTexelSize.y)).r;
  float avgWet=(wL+wR+wB+wT)*0.25;
  // Edge factor: high when this pixel is wetter than neighbors (boundary)
  float edgeFactor=max(0.0, w-avgWet)*4.0;
  // Paper absorbency: rough paper absorbs faster
  float paperH=texture2D(uPaper,vUv).r;
  float absorbRate=1.0+(1.0-paperH)*0.5;
  float dryAmount=uDryRate*uDt*absorbRate*(1.0+edgeFactor*3.0);

  // Capillary spread: water wicks into adjacent dry paper
  float capillarySpread=0.0;
  if(w<0.02){
    // This pixel is dry, but neighbors might be wet -> wick
    float maxNeighbor=max(max(wL,wR),max(wB,wT));
    capillarySpread=maxNeighbor*0.03*(1.0-paperH)*uDt; // valleys wick more
  }

  w=max(0.0, w-dryAmount)+capillarySpread;
  gl_FragColor=vec4(w,0,0,1);
}`;

// ── Display: proper compositing with paper, granulation, wet sheen, edge darkening ──
const DISPLAY_FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uDye;
uniform sampler2D uPaper;
uniform sampler2D uWetness;
void main(){
  vec3 dye=texture2D(uDye,vUv).rgb;
  float paper=texture2D(uPaper,vUv).r;
  float wet=texture2D(uWetness,vUv).r;

  // Dye stores pigment absorption (0=no paint, higher=more pigment)
  // Convert to visible color: paper white minus absorbed light
  vec3 paintColor=max(vec3(1.0)-dye, vec3(0.0));

  // Paper texture as base white
  vec3 paperColor=vec3(paper);

  // Pigment density
  float pigment=clamp(length(dye)*1.2, 0.0, 1.0);

  // Granulation: paper roughness shows through paint
  // In valleys (low paper), more pigment collects -> darker
  // On peaks (high paper), less pigment -> lighter, showing paper grain
  float grainEffect=(1.0-paper)*pigment;
  float grain=1.0-0.18*grainEffect;

  // Blend paper and paint with granulation
  vec3 color=mix(paperColor, paintColor*grain, pigment);

  // Edge darkening: now mostly handled by capillary flow in sim,
  // but add subtle residual for thin paint edges
  float edgeDark=1.0-0.04*pigment*(1.0-pigment)*4.0;
  color*=edgeDark;

  // Wet paint appearance
  if(wet>0.01){
    // Wet sheen: glossy reflection
    float sheen=wet*0.08;
    color+=vec3(sheen);
    // Wet paint appears slightly darker and more saturated
    float wetDarken=1.0-wet*0.06;
    color*=wetDarken;
    // Slight color shift on very wet areas (watercolor bloom look)
    float bloom=smoothstep(0.3,0.8,wet)*0.03;
    color=mix(color, paintColor*0.9, bloom);
  }

  gl_FragColor=vec4(color,1.0);
}`;

class FluidSim {
  constructor(canvas) {
    this.canvas = canvas;
    dbg('Init WebGL...');
    const g = canvas.getContext('webgl', { alpha: false, premultipliedAlpha: false });
    if (!g) throw new Error('WebGL not available');
    this.gl = g;
    gl = g;
    dbg('WebGL OK');

    // Enable float textures (try float first, then half-float)
    const floatExt = g.getExtension('OES_texture_float');
    const halfFloatExt = g.getExtension('OES_texture_half_float');
    this.hasFloat = !!floatExt;
    this.halfFloatType = halfFloatExt ? halfFloatExt.HALF_FLOAT_OES : null;
    g.getExtension('OES_texture_float_linear');
    g.getExtension('OES_texture_half_float_linear');
    dbg('Float:'+this.hasFloat+' Half:'+ !!this.halfFloatType);

    this.resize();
    dbg('Size:'+this.w+'x'+this.h);
    this._initShaders();
    dbg('Shaders OK');
    this._initBuffers();
    this._initTextures();
    dbg('FBOs OK');
    this._generatePaper();
    dbg('Paper OK');

    this.lastTime = 0;
    this._tick = this._tick.bind(this);
    requestAnimationFrame(this._tick);
  }

  resize() {
    const g = this.gl;
    const rect = this.canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    // Use lower resolution for fluid sim (performance)
    const simScale = 0.5;
    this.w = Math.floor(rect.width * dpr * simScale);
    this.h = Math.floor(rect.height * dpr * simScale);
    this.canvas.width = Math.floor(rect.width * dpr);
    this.canvas.height = Math.floor(rect.height * dpr);
    this.aspect = this.w / this.h;
    this.texelSize = [1.0 / this.w, 1.0 / this.h];
  }

  _compileShader(src, type) {
    const g = this.gl;
    const s = g.createShader(type);
    g.shaderSource(s, src);
    g.compileShader(s);
    if (!g.getShaderParameter(s, g.COMPILE_STATUS)) {
      const err = g.getShaderInfoLog(s);
      dbg('SHADER ERR:'+err);
    }
    return s;
  }

  _createProgram(fragSrc) {
    const g = this.gl;
    const p = g.createProgram();
    g.attachShader(p, this._compileShader(VERT_SRC, g.VERTEX_SHADER));
    g.attachShader(p, this._compileShader(fragSrc, g.FRAGMENT_SHADER));
    g.linkProgram(p);
    if (!g.getShaderParameter) return p;
    // Cache uniform locations
    const uniforms = {};
    const n = g.getProgramParameter(p, g.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const info = g.getActiveUniform(p, i);
      uniforms[info.name] = g.getUniformLocation(p, info.name);
    }
    return { program: p, uniforms };
  }

  _initShaders() {
    this.splatProg = this._createProgram(SPLAT_FRAG);
    this.splatSimpleProg = this._createProgram(SPLAT_SIMPLE_FRAG);
    this.splatVelProg = this._createProgram(SPLAT_VEL_FRAG);
    this.advectProg = this._createProgram(ADVECT_FRAG);
    this.divergenceProg = this._createProgram(DIVERGENCE_FRAG);
    this.pressureProg = this._createProgram(PRESSURE_FRAG);
    this.gradSubProg = this._createProgram(GRADIENT_SUB_FRAG);
    this.capillaryProg = this._createProgram(CAPILLARY_FRAG);
    this.granulationProg = this._createProgram(GRANULATION_FRAG);
    this.advectWetProg = this._createProgram(ADVECT_WET_FRAG);
    this.displayProg = this._createProgram(DISPLAY_FRAG);
  }

  _initBuffers() {
    const g = this.gl;
    const buf = g.createBuffer();
    g.bindBuffer(g.ARRAY_BUFFER, buf);
    g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), g.STATIC_DRAW);
    this.quadBuf = buf;
  }

  _createFBO(w, h) {
    const g = this.gl;
    const type = this.hasFloat ? g.FLOAT : (this.halfFloatType || g.UNSIGNED_BYTE);
    const tex = g.createTexture();
    g.bindTexture(g.TEXTURE_2D, tex);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MIN_FILTER, g.LINEAR);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MAG_FILTER, g.LINEAR);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_S, g.CLAMP_TO_EDGE);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_T, g.CLAMP_TO_EDGE);
    g.texImage2D(g.TEXTURE_2D, 0, g.RGBA, w, h, 0, g.RGBA, type, null);
    const fbo = g.createFramebuffer();
    g.bindFramebuffer(g.FRAMEBUFFER, fbo);
    g.framebufferTexture2D(g.FRAMEBUFFER, g.COLOR_ATTACHMENT0, g.TEXTURE_2D, tex, 0);
    const status = g.checkFramebufferStatus(g.FRAMEBUFFER);
    if (status !== g.FRAMEBUFFER_COMPLETE) {
      dbg('FBO incomplete:'+status+' type:'+(type===g.FLOAT?'F':'HF/U8'));
      // Retry with half-float or unsigned byte
      if (type === g.FLOAT && this.halfFloatType) {
        g.bindFramebuffer(g.FRAMEBUFFER, null);
        g.deleteTexture(tex);
        g.deleteFramebuffer(fbo);
        this.hasFloat = false;
        return this._createFBO(w, h);
      }
      if (type !== g.UNSIGNED_BYTE) {
        g.bindFramebuffer(g.FRAMEBUFFER, null);
        g.deleteTexture(tex);
        g.deleteFramebuffer(fbo);
        this.hasFloat = false;
        this.halfFloatType = null;
        return this._createFBO(w, h);
      }
    }
    g.clearColor(0, 0, 0, 0);
    g.clear(g.COLOR_BUFFER_BIT);
    g.bindFramebuffer(g.FRAMEBUFFER, null);
    return { tex, fbo, w, h };
  }

  _createDoubleFBO(w, h) {
    return {
      read: this._createFBO(w, h),
      write: this._createFBO(w, h),
      swap() { const t = this.read; this.read = this.write; this.write = t; }
    };
  }

  _initTextures() {
    const w = this.w, h = this.h;
    this.velocity = this._createDoubleFBO(w, h);
    this.dye = this._createDoubleFBO(w, h);
    this.pressure = this._createDoubleFBO(w, h);
    this.divergenceFBO = this._createFBO(w, h);
    this.wetness = this._createDoubleFBO(w, h);
  }

  _generatePaper() {
    const g = this.gl;
    const w = this.w, h = this.h;
    // Use Uint8 for paper texture (static, doesn't need float precision)
    const data = new Uint8Array(w * h * 4);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        let v = 0, amp = 1, freq = 1;
        for (let oct = 0; oct < 4; oct++) {
          v += amp * (Math.sin(x * freq * 0.1 + Math.sin(y * freq * 0.13)) *
                      Math.cos(y * freq * 0.12 + Math.cos(x * freq * 0.11)) * 0.5 + 0.5);
          amp *= 0.5; freq *= 2.1;
        }
        v = v / 1.875;
        const grain = Math.round((0.92 + v * 0.08) * 255);
        data[i] = grain; data[i+1] = grain; data[i+2] = grain; data[i+3] = 255;
      }
    }
    const tex = g.createTexture();
    g.bindTexture(g.TEXTURE_2D, tex);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MIN_FILTER, g.LINEAR);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MAG_FILTER, g.LINEAR);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_S, g.CLAMP_TO_EDGE);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_T, g.CLAMP_TO_EDGE);
    g.texImage2D(g.TEXTURE_2D, 0, g.RGBA, w, h, 0, g.RGBA, g.UNSIGNED_BYTE, data);
    this.paperTex = tex;
  }

  _draw(prog, target) {
    const g = this.gl;
    g.useProgram(prog.program);
    if (target) {
      g.viewport(0, 0, target.w, target.h);
      g.bindFramebuffer(g.FRAMEBUFFER, target.fbo);
    } else {
      g.viewport(0, 0, this.canvas.width, this.canvas.height);
      g.bindFramebuffer(g.FRAMEBUFFER, null);
    }
    g.bindBuffer(g.ARRAY_BUFFER, this.quadBuf);
    const loc = g.getAttribLocation(prog.program, 'a_pos');
    g.enableVertexAttribArray(loc);
    g.vertexAttribPointer(loc, 2, g.FLOAT, false, 0, 0);
    g.drawArrays(g.TRIANGLE_STRIP, 0, 4);
  }

  _bindTex(prog, name, tex, unit) {
    const g = this.gl;
    g.activeTexture(g.TEXTURE0 + unit);
    g.bindTexture(g.TEXTURE_2D, tex);
    g.uniform1i(prog.uniforms[name], unit);
  }

  splat(x, y, dx, dy, color, radius, waterContent) {
    const g = this.gl;
    waterContent = waterContent !== undefined ? waterContent : 0.7;

    // Splat velocity (wet-on-wet aware)
    const vp = this.splatVelProg;
    g.useProgram(vp.program);
    this._bindTex(vp, 'uTarget', this.velocity.read.tex, 0);
    this._bindTex(vp, 'uWetness', this.wetness.read.tex, 1);
    g.uniform2f(vp.uniforms.uPoint, x, y);
    g.uniform2f(vp.uniforms.uVel, dx * 8.0, dy * 8.0);
    g.uniform1f(vp.uniforms.uRadius, radius);
    g.uniform1f(vp.uniforms.uAspect, this.aspect);
    this._draw(vp, this.velocity.write);
    this.velocity.swap();

    // Splat dye (with dry-brush + wet-on-wet via paper & wetness)
    const sp = this.splatProg;
    g.useProgram(sp.program);
    this._bindTex(sp, 'uTarget', this.dye.read.tex, 0);
    this._bindTex(sp, 'uPaper', this.paperTex, 1);
    this._bindTex(sp, 'uWetness', this.wetness.read.tex, 2);
    g.uniform2f(sp.uniforms.uPoint, x, y);
    // Convert RGB to absorption (1-rgb, normalized)
    g.uniform3f(sp.uniforms.uColor,
      (1 - color[0]/255) * 0.8,
      (1 - color[1]/255) * 0.8,
      (1 - color[2]/255) * 0.8);
    g.uniform1f(sp.uniforms.uRadius, radius);
    g.uniform1f(sp.uniforms.uAspect, this.aspect);
    g.uniform1f(sp.uniforms.uWaterContent, waterContent);
    this._draw(sp, this.dye.write);
    this.dye.swap();

    // Splat wetness (scaled by water content, simple additive)
    const wsp = this.splatSimpleProg;
    g.useProgram(wsp.program);
    this._bindTex(wsp, 'uTarget', this.wetness.read.tex, 0);
    g.uniform2f(wsp.uniforms.uPoint, x, y);
    g.uniform3f(wsp.uniforms.uColor, waterContent * 0.6, 0.0, 0.0);
    g.uniform1f(wsp.uniforms.uRadius, radius);
    g.uniform1f(wsp.uniforms.uAspect, this.aspect);
    this._draw(wsp, this.wetness.write);
    this.wetness.swap();
  }

  step(dt) {
    const g = this.gl;
    dt = Math.min(dt, 0.033);

    // 1. Advect velocity
    const ap = this.advectProg;
    g.useProgram(ap.program);
    this._bindTex(ap, 'uVelocity', this.velocity.read.tex, 0);
    this._bindTex(ap, 'uSource', this.velocity.read.tex, 1);
    g.uniform2f(ap.uniforms.uTexelSize, this.texelSize[0], this.texelSize[1]);
    g.uniform1f(ap.uniforms.uDt, dt);
    g.uniform1f(ap.uniforms.uDissipation, 0.98);
    this._draw(ap, this.velocity.write);
    this.velocity.swap();

    // 2. Compute divergence
    const dp = this.divergenceProg;
    g.useProgram(dp.program);
    this._bindTex(dp, 'uVelocity', this.velocity.read.tex, 0);
    g.uniform2f(dp.uniforms.uTexelSize, this.texelSize[0], this.texelSize[1]);
    this._draw(dp, this.divergenceFBO);

    // 3. Pressure solve (Jacobi iterations)
    const pp = this.pressureProg;
    g.useProgram(pp.program);
    g.uniform2f(pp.uniforms.uTexelSize, this.texelSize[0], this.texelSize[1]);
    for (let i = 0; i < 20; i++) {
      this._bindTex(pp, 'uPressure', this.pressure.read.tex, 0);
      this._bindTex(pp, 'uDivergence', this.divergenceFBO.tex, 1);
      this._draw(pp, this.pressure.write);
      this.pressure.swap();
    }

    // 4. Gradient subtraction
    const gp = this.gradSubProg;
    g.useProgram(gp.program);
    this._bindTex(gp, 'uPressure', this.pressure.read.tex, 0);
    this._bindTex(gp, 'uVelocity', this.velocity.read.tex, 1);
    g.uniform2f(gp.uniforms.uTexelSize, this.texelSize[0], this.texelSize[1]);
    this._draw(gp, this.velocity.write);
    this.velocity.swap();

    // 5. Advect dye
    g.useProgram(ap.program);
    this._bindTex(ap, 'uVelocity', this.velocity.read.tex, 0);
    this._bindTex(ap, 'uSource', this.dye.read.tex, 1);
    g.uniform2f(ap.uniforms.uTexelSize, this.texelSize[0], this.texelSize[1]);
    g.uniform1f(ap.uniforms.uDt, dt);
    g.uniform1f(ap.uniforms.uDissipation, 0.999); // dye barely dissipates
    this._draw(ap, this.dye.write);
    this.dye.swap();

    // 6. Advect + dry wetness (edge-aware drying, capillary spread)
    const wp = this.advectWetProg;
    g.useProgram(wp.program);
    this._bindTex(wp, 'uVelocity', this.velocity.read.tex, 0);
    this._bindTex(wp, 'uWetness', this.wetness.read.tex, 1);
    this._bindTex(wp, 'uPaper', this.paperTex, 2);
    g.uniform2f(wp.uniforms.uTexelSize, this.texelSize[0], this.texelSize[1]);
    g.uniform1f(wp.uniforms.uDt, dt);
    g.uniform1f(wp.uniforms.uDryRate, 0.12);
    g.uniform2f(wp.uniforms.uGravity, 0.0, 0.0); // no tilt for now
    this._draw(wp, this.wetness.write);
    this.wetness.swap();

    // 7. Capillary flow: pigment migrates to drying edges
    const cp = this.capillaryProg;
    g.useProgram(cp.program);
    this._bindTex(cp, 'uDye', this.dye.read.tex, 0);
    this._bindTex(cp, 'uWetness', this.wetness.read.tex, 1);
    this._bindTex(cp, 'uPaper', this.paperTex, 2);
    g.uniform2f(cp.uniforms.uTexelSize, this.texelSize[0], this.texelSize[1]);
    g.uniform1f(cp.uniforms.uDt, dt);
    this._draw(cp, this.dye.write);
    this.dye.swap();

    // 8. Granulation: pigment settles into paper valleys
    const grp = this.granulationProg;
    g.useProgram(grp.program);
    this._bindTex(grp, 'uDye', this.dye.read.tex, 0);
    this._bindTex(grp, 'uWetness', this.wetness.read.tex, 1);
    this._bindTex(grp, 'uPaper', this.paperTex, 2);
    g.uniform2f(grp.uniforms.uTexelSize, this.texelSize[0], this.texelSize[1]);
    g.uniform1f(grp.uniforms.uDt, dt);
    this._draw(grp, this.dye.write);
    this.dye.swap();
  }

  render() {
    const g = this.gl;
    const rp = this.displayProg;
    g.useProgram(rp.program);
    this._bindTex(rp, 'uDye', this.dye.read.tex, 0);
    this._bindTex(rp, 'uPaper', this.paperTex, 1);
    this._bindTex(rp, 'uWetness', this.wetness.read.tex, 2);
    this._draw(rp, null);
  }

  clear() {
    const g = this.gl;
    const clearFBO = (dfbo) => {
      g.bindFramebuffer(g.FRAMEBUFFER, dfbo.read.fbo);
      g.clearColor(0,0,0,0);
      g.clear(g.COLOR_BUFFER_BIT);
      g.bindFramebuffer(g.FRAMEBUFFER, dfbo.write.fbo);
      g.clear(g.COLOR_BUFFER_BIT);
    };
    clearFBO(this.velocity);
    clearFBO(this.dye);
    clearFBO(this.pressure);
    clearFBO(this.wetness);
    g.bindFramebuffer(g.FRAMEBUFFER, this.divergenceFBO.fbo);
    g.clear(g.COLOR_BUFFER_BIT);
    g.bindFramebuffer(g.FRAMEBUFFER, null);
  }

  _tick(now) {
    requestAnimationFrame(this._tick);
    const dt = this.lastTime ? (now - this.lastTime) / 1000 : 0.016;
    this.lastTime = now;
    this.step(dt);
    this.render();
  }
}

function setupDrawingCanvas() {
  drawCanvas = document.getElementById('drawing-canvas');

  function initDraw() {
    if (fluidSim) return;
    const rect = drawCanvas.getBoundingClientRect();
    if (!rect.width || !rect.height) {
      requestAnimationFrame(initDraw); // retry until laid out
      return;
    }
    try {
      fluidSim = new FluidSim(drawCanvas);
    } catch (e) {
      dbg('INIT FAIL:'+e.message);
      drawCanvas.style.background = '#fff';
      const el = document.createElement('div');
      el.style.cssText = 'position:absolute;top:10px;left:10px;color:red;font-size:14px;z-index:99';
      el.textContent = 'WebGL error: ' + e.message;
      drawCanvas.parentElement.appendChild(el);
    }
  }

  // Canvas pointer handling
  for (const evt of ['touchstart', 'touchmove', 'touchend']) {
    drawCanvas.addEventListener(evt, e => e.preventDefault(), { passive: false });
  }

  let lastSplatPos = null;

  drawCanvas.addEventListener('pointerdown', (e) => {
    if (!state.brushColor) return;
    e.preventDefault();
    drawCanvas.setPointerCapture(e.pointerId);
    state.isDrawing = true;
    state.activeTarget = { type: 'canvas', index: 0 };
    canvasStrokeDabs = 0; // reset water content for new stroke
    const pos = getCanvasPos(e);
    lastSplatPos = pos;
    doSplat(pos, null);
  });

  drawCanvas.addEventListener('pointermove', (e) => {
    if (!state.isDrawing || !state.activeTarget || state.activeTarget.type !== 'canvas') return;
    e.preventDefault();
    const pos = getCanvasPos(e);
    if (lastSplatPos) {
      // Interpolate splats along the stroke for continuous paint
      const dx = pos.x - lastSplatPos.x;
      const dy = pos.y - lastSplatPos.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const step = Math.max(0.002, (state.brushBaseSize / 800) * 0.3);
      const steps = Math.max(1, Math.ceil(dist / step));
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        const p = {
          x: lastSplatPos.x + dx * t,
          y: lastSplatPos.y + dy * t,
          pressure: lastSplatPos.pressure + (pos.pressure - lastSplatPos.pressure) * t
        };
        doSplat(p, lastSplatPos);
      }
    }
    lastSplatPos = pos;
  });

  const endCanvas = () => {
    if (state.activeTarget && state.activeTarget.type === 'canvas') {
      state.isDrawing = false;
      state.activeTarget = null;
      lastSplatPos = null;
    }
  };
  drawCanvas.addEventListener('pointerup', endCanvas);
  drawCanvas.addEventListener('pointercancel', endCanvas);

  function getCanvasPos(e) {
    const rect = drawCanvas.getBoundingClientRect();
    let pressure = 0.5;
    if (e.pressure > 0 && e.pressure < 1) pressure = e.pressure;
    return {
      x: (e.clientX - rect.left) / rect.width,
      y: 1.0 - (e.clientY - rect.top) / rect.height, // flip Y for GL
      pressure
    };
  }

  let splatCount = 0;
  let canvasStrokeDabs = 0;
  function doSplat(pos, prev) {
    if (!fluidSim || !state.brushColor) return;
    if (splatCount++ < 3) dbg('Splat:'+pos.x.toFixed(2)+','+pos.y.toFixed(2)+' c:'+state.brushColor);
    canvasStrokeDabs++;
    const p = pos.pressure;
    const radius = (state.brushBaseSize / 800) * (0.4 + p * 1.1);
    let dx = 0, dy = 0;
    if (prev) {
      dx = pos.x - prev.x;
      dy = pos.y - prev.y;
    }
    // Water content: starts high, decreases as brush runs out of paint
    // Pressure also affects water deposit (light touch = drier)
    const strokeFade = Math.max(0.15, 1.0 - canvasStrokeDabs / 80);
    const waterContent = Math.min(1.0, strokeFade * (0.3 + p * 0.7));
    fluidSim.splat(pos.x, pos.y, dx, dy, state.brushColor, radius, waterContent);
  }

  requestAnimationFrame(initDraw);
}

// ════════════════════════════════════════════
//  POINTER / STROKE HANDLING
// ════════════════════════════════════════════

function setupPointer(canvas, type, index) {
  // Block Safari gestures
  for (const evt of ['touchstart', 'touchmove', 'touchend']) {
    canvas.addEventListener(evt, e => e.preventDefault(), { passive: false });
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (!state.brushColor) return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    state.isDrawing = true;
    state.activeTarget = { type, index };
    state.wellStrokeDabs = 0;
    const pos = getPos(e, canvas);
    state.lastPoint = pos;
    dab(type, index, pos);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!state.isDrawing || !state.activeTarget) return;
    if (state.activeTarget.type !== type || state.activeTarget.index !== index) return;
    e.preventDefault();
    const pos = getPos(e, canvas);
    strokeTo(type, index, state.lastPoint, pos);
    state.lastPoint = pos;
  });

  const end = () => {
    if (state.activeTarget && state.activeTarget.type === type && state.activeTarget.index === index) {
      state.isDrawing = false;
      state.activeTarget = null;
      state.lastPoint = null;
    }
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
}

function getPos(e, canvas) {
  const rect = canvas.getBoundingClientRect();
  // pressure: Apple Pencil provides 0-1, finger defaults to 0.5
  let pressure = 0.5;
  if (e.pressure > 0 && e.pressure < 1) pressure = e.pressure;
  return { x: e.clientX - rect.left, y: e.clientY - rect.top, pressure };
}

function strokeTo(type, index, p1, p2) {
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const step = Math.max(1, state.brushBaseSize * 0.25);
  const steps = Math.ceil(dist / step);
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    dab(type, index, {
      x: p1.x + dx * t,
      y: p1.y + dy * t,
      pressure: p1.pressure + (p2.pressure - p1.pressure) * t
    });
  }
}

function dab(type, index, pos) {
  if (type !== 'well') return; // Canvas handled by WebGL pointer events
  state.wellStrokeDabs++;
  const p = pos.pressure;
  const sizeMul = 0.4 + p * 1.1;
  const radius = state.brushBaseSize * sizeMul * 0.5;
  const opacity = 0.3 + p * 0.7;
  dabOnWell(index, pos.x, pos.y, radius, opacity);
}

// ════════════════════════════════════════════
//  DAB ON WELL  — latent mixing + live pickup
// ════════════════════════════════════════════

function dabOnWell(wi, cx, cy, radius, opacity) {
  const well = wells[wi];
  if (!well.ctx || !well.latentBuffer) return;
  const bl = state.brushLatent;
  const r = radius;
  const x0 = Math.max(0, Math.floor((cx - r) * DPR));
  const y0 = Math.max(0, Math.floor((cy - r) * DPR));
  const x1 = Math.min(well.w - 1, Math.ceil((cx + r) * DPR));
  const y1 = Math.min(well.h - 1, Math.ceil((cy + r) * DPR));
  const imgW = x1 - x0 + 1, imgH = y1 - y0 + 1;
  if (imgW <= 0 || imgH <= 0) return;

  const imgData = well.ctx.getImageData(x0, y0, imgW, imgH);
  const px = imgData.data;
  let pR = 0, pG = 0, pB = 0, pN = 0;

  for (let py = y0; py <= y1; py++) {
    for (let ppx = x0; ppx <= x1; ppx++) {
      const dx = ppx / DPR - cx, dy = py / DPR - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > r) continue;
      const nd = dist / r;
      const ef = 0.5 + 0.5 * nd * nd;
      const da = opacity * ef * (1 - nd * nd * 0.3);

      const idx = py * well.w + ppx;
      const ea = well.alphaBuffer[idx];
      const li = idx * LATENT_SIZE;

      // First ~20 dabs of a stroke: full deposit (loaded brush)
      // After that: gradual mixing (paint running out)
      const strokeFade = Math.min(state.wellStrokeDabs / 20, 1);
      const mixDa = da * (1.0 - strokeFade * 0.85);
      const k1 = 1 - mixDa;
      for (let k = 0; k < LATENT_SIZE; k++)
        well.latentBuffer[li + k] = well.latentBuffer[li + k] * k1 + bl[k] * mixDa;
      well.alphaBuffer[idx] = Math.min(1, ea + da * (1 - ea));

      const sl = [];
      for (let k = 0; k < LATENT_SIZE; k++) sl.push(well.latentBuffer[li + k]);
      const rgb = mixbox.latentToRgb(sl);

      const pi = ((py - y0) * imgW + (ppx - x0)) * 4;
      px[pi] = Math.round(rgb[0]);
      px[pi + 1] = Math.round(rgb[1]);
      px[pi + 2] = Math.round(rgb[2]);
      px[pi + 3] = Math.round(well.alphaBuffer[idx] * 255);

      // Only sample non-white pixels for pickup
      if (nd < 0.3 && (rgb[0] < 245 || rgb[1] < 245 || rgb[2] < 245)) {
        pR += rgb[0]; pG += rgb[1]; pB += rgb[2]; pN++;
      }
    }
  }
  well.ctx.putImageData(imgData, x0, y0);
  if (pN > 0) updateBrushFromRgb([Math.round(pR/pN), Math.round(pG/pN), Math.round(pB/pN)]);
}

// (Canvas painting + fluid sim handled by FluidSim WebGL class above)

// ════════════════════════════════════════════
//  WATER JAR
// ════════════════════════════════════════════

function setupWaterJar() {
  const jar = document.getElementById('water-jar');
  let downT = 0;
  jar.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  jar.addEventListener('pointerdown', (e) => { e.preventDefault(); downT = Date.now(); });
  jar.addEventListener('pointerup', () => {
    if (!state.brushColor) return;
    (Date.now() - downT >= 500) ? cleanBrush() : diluteBrush();
  });
}

function diluteBrush() {
  if (!state.brushLatent) return;
  for (let k = 0; k < LATENT_SIZE; k++)
    state.brushLatent[k] = state.brushLatent[k] * 0.7 + WHITE_LATENT[k] * 0.3;
  const rgb = mixbox.latentToRgb(Array.from(state.brushLatent));
  state.brushColor = [Math.round(rgb[0]), Math.round(rgb[1]), Math.round(rgb[2])];
  document.getElementById('brush-preview').style.background = `rgb(${state.brushColor.join(',')})`;
  document.getElementById('brush-label').textContent = 'Diluted';
}

function cleanBrush() {
  if (state.brushColor) {
    const jt = state.waterJarTint, bc = state.brushColor;
    const b = 0.15 + state.waterJarDirty * 0.05;
    state.waterJarTint = [
      Math.round(jt[0]*(1-b) + bc[0]*b),
      Math.round(jt[1]*(1-b) + bc[1]*b),
      Math.round(jt[2]*(1-b) + bc[2]*b),
    ];
    state.waterJarDirty = Math.min(1, state.waterJarDirty + 0.12);
    const fill = document.getElementById('water-jar-fill');
    const t = state.waterJarTint;
    fill.style.background = `rgba(${t[0]},${t[1]},${t[2]},${0.3 + state.waterJarDirty * 0.4})`;
  }
  state.brushColor = [200, 200, 200];
  state.brushLatent = mixbox.rgbToLatent([200, 200, 200]);
  document.getElementById('brush-preview').style.background = '#ccc';
  document.getElementById('brush-label').textContent = 'Clean \u2014 pick a color';
}

// ════════════════════════════════════════════
//  CONTROLS
// ════════════════════════════════════════════

function createBrushSizeDots() {
  const container = document.getElementById('brush-size-container');
  const sizes = [4, 8, 14, 22, 34, 50];
  sizes.forEach(s => {
    const dot = document.createElement('div');
    dot.className = 'size-dot' + (s === state.brushBaseSize ? ' selected' : '');
    const displaySize = Math.max(6, Math.round(s * 0.6));
    dot.style.width = displaySize + 'px';
    dot.style.height = displaySize + 'px';
    dot.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      state.brushBaseSize = s;
      container.querySelectorAll('.size-dot').forEach(d => d.classList.remove('selected'));
      dot.classList.add('selected');
    });
    container.appendChild(dot);
  });
}

function setupControls() {
  createBrushSizeDots();
  document.getElementById('clean-palette').addEventListener('click', () => {
    for (let i = 0; i < NUM_WELLS; i++) clearWell(i);
  });
  document.getElementById('clear-canvas-btn').addEventListener('click', () => {
    if (fluidSim) fluidSim.clear();
  });
}

// ════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════

function init() {
  createColorSquares();
  createWells();
  setupDrawingCanvas();
  setupWaterJar();
  setupControls();
  selectColor(PALETTE_COLORS[0].rgb, 0);
}

if (document.readyState === 'loading')
  document.addEventListener('DOMContentLoaded', init);
else
  init();

})();
</script>
