<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Artist Palette</title>
<script src="mixbox.js" onerror="document.getElementById('load-error').style.display='block'"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100dvh;
  overflow: hidden;
  touch-action: none;
  background: #2a2520;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  user-select: none;
  -webkit-user-select: none;
}

#app {
  display: grid;
  grid-template-columns: 260px 1fr;
  height: 100dvh;
  gap: 0;
}

/* ── Palette Panel ── */
#palette-panel {
  background: #3a342e;
  display: flex;
  flex-direction: column;
  padding: 10px;
  gap: 8px;
  overflow: hidden;
}

#color-squares {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 2px;
  flex-shrink: 0;
  max-width: 200px;
}
.color-swatch {
  aspect-ratio: 1;
  border-radius: 50%;
  border: 1px solid transparent;
  max-width: 30px;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.1s;
  position: relative;
  overflow: hidden;
}
.color-swatch canvas {
  width: 100%; height: 100%;
  border-radius: 50%;
  display: block;
}
.color-swatch.selected {
  border-color: #fff;
  box-shadow: 0 0 0 2px #555, 0 0 12px rgba(255,255,255,0.3);
  transform: scale(1.08);
  z-index: 1;
}
.color-swatch:active { transform: scale(0.95); }

#brush-preview-container {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  flex-shrink: 0;
}
#brush-preview {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 2px solid #666;
  background: #222;
  flex-shrink: 0;
  transition: background-color 0.15s;
}
#brush-label {
  color: #aaa;
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#wells-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  flex: 1;
  min-height: 0;
}
.well-container {
  position: relative;
  border-radius: 10px;
  background: #fff;
  border: 1px solid #999;
  overflow: hidden;
}
.well-canvas {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 10px;
  cursor: crosshair;
}
.well-clear {
  position: absolute;
  top: 3px; right: 3px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: rgba(0,0,0,0.4);
  color: #ccc;
  border: none;
  font-size: 11px;
  line-height: 18px;
  text-align: center;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 2;
}
.well-container:hover .well-clear,
.well-container:active .well-clear { opacity: 1; }

#water-jar {
  flex-shrink: 0;
  height: 52px;
  border-radius: 8px;
  border: 2px solid #665e54;
  background: linear-gradient(to bottom, rgba(180,210,240,0.15) 0%, rgba(140,190,230,0.5) 100%);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #aaa;
  font-size: 12px;
  position: relative;
  overflow: hidden;
  transition: background 0.3s;
}
#water-jar-fill {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 70%;
  background: rgba(160,200,235,0.35);
  transition: background 0.5s;
  pointer-events: none;
}
#water-jar-label { position: relative; z-index: 1; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
#water-jar:active { background: rgba(180,210,240,0.4); }

#palette-controls {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.ctrl-btn {
  flex: 1;
  padding: 8px 4px;
  border-radius: 6px;
  border: 1px solid #555;
  background: #4a433b;
  color: #ccc;
  font-size: 11px;
  cursor: pointer;
  white-space: nowrap;
}
.ctrl-btn:active { background: #5a534b; }

#brush-size-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-shrink: 0;
  padding: 6px 0;
}
.size-dot {
  border-radius: 50%;
  background: #999;
  cursor: pointer;
  transition: background 0.15s, box-shadow 0.15s;
  flex-shrink: 0;
}
.size-dot:active { background: #ccc; }
.size-dot.selected {
  background: #fff;
  box-shadow: 0 0 0 2px #666, 0 0 8px rgba(255,255,255,0.3);
}

/* ── Canvas Panel ── */
#canvas-panel {
  display: flex;
  flex-direction: column;
  background: #555;
  position: relative;
}
#drawing-canvas {
  flex: 1;
  display: block;
  cursor: crosshair;
  background: #f5f3ee;
}

/* Portrait / phone layout */
@media (max-width: 600px) {
  #app {
    grid-template-columns: 100vw;
    grid-template-rows: min-content 1fr;
    max-width: 100vw;
    overflow: hidden;
  }
  #palette-panel {
    flex-direction: column;
    padding: 6px;
    gap: 4px;
    max-height: none;
    overflow: hidden;
    width: 100%;
    min-width: 0;
  }
  #color-squares {
    grid-template-columns: repeat(6, 1fr);
    gap: 2px;
  }
  .color-swatch {
    border-width: 2px;
  }
  #brush-preview-container { padding: 2px 0; }
  #brush-preview { width: 28px; height: 28px; }
  #wells-grid {
    grid-template-columns: 1fr 1fr;
    flex: 0 0 65px;
  }
  .well-container:nth-child(n+3) { display: none; }
  #water-jar { font-size: 10px; flex: 0 0 36px; }
  #water-jar-label { font-size: 9px; }
  #brush-size-container { gap: 6px; flex: 0 0 34px; justify-content: center; padding: 0 10px; }
  #palette-controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; flex: 0 0 auto; }
  .ctrl-btn { padding: 5px 2px; font-size: 10px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
}

/* Very small phones (iPhone SE etc.) */
@media (max-width: 380px) {
  #color-squares {
    grid-template-columns: repeat(4, 1fr);
  }
  #wells-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* Landscape phone */
@media (max-height: 500px) and (min-aspect-ratio: 1/1) {
  #app { grid-template-columns: 200px 1fr; }
  #palette-panel { padding: 6px; gap: 4px; }
  #color-squares { gap: 3px; }
  .color-swatch { border-width: 2px; }
  #brush-preview { width: 24px; height: 24px; }
  #water-jar { height: 32px; font-size: 10px; }
  .ctrl-btn { padding: 5px 3px; font-size: 10px; }
}
</style>
</head>
<body>
<div id="debug-log" style="position:fixed;bottom:30px;right:6px;max-width:50%;max-height:200px;overflow-y:auto;background:rgba(0,0,0,0.85);color:#0f0;font-family:monospace;font-size:10px;padding:6px;border-radius:4px;z-index:99999;pointer-events:none;word-break:break-all"></div>
<script>
const _dbg=document.getElementById('debug-log');
function dbg(msg){_dbg.textContent+=msg+'\n';_dbg.scrollTop=_dbg.scrollHeight;console.log('[DBG]',msg);}
window.onerror=function(m,s,l){dbg('ERR:'+m+' L'+l);};
</script>
<div id="load-error" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#2a2520;color:#f88;font-family:monospace;padding:20px;z-index:99999;font-size:14px">
  <p>ERROR: mixbox.js failed to load</p>
  <p style="color:#aaa;margin-top:10px">page:palette v21</p>
  <p style="color:#666;margin-top:5px" id="error-url"></p>
  <script>document.getElementById('error-url').textContent='URL: '+location.href</script>
</div>
<div id="app">
  <div id="palette-panel">
    <div id="color-squares"></div>
    <div id="brush-preview-container">
      <div id="brush-preview"></div>
      <span id="brush-label">Tap a color to start</span>
    </div>
    <div id="wells-grid"></div>
    <div id="water-jar">
      <div id="water-jar-fill"></div>
      <span id="water-jar-label">Water Jar &middot; tap: dilute &middot; hold: clean</span>
    </div>
    <div id="brush-size-container"></div>
    <div id="palette-controls">
      <button class="ctrl-btn" id="clean-palette">Clean</button>
      <button class="ctrl-btn" id="clear-canvas-btn">Clear</button>
      <button class="ctrl-btn" id="export-log-btn">Save</button>
      <button class="ctrl-btn" id="load-log-btn">Replay</button>
    </div>
  </div>
  <div id="canvas-panel">
    <canvas id="drawing-canvas"></canvas>
  </div>
</div>

<script>
(function() {
'use strict';

const LATENT_SIZE = typeof mixbox !== 'undefined' ? mixbox.LATENT_SIZE : 7;
const PALETTE_COLORS = [
  { name: 'Cadmium Yellow',    rgb: [254, 212, 48]  },
  { name: 'Yellow Ochre',      rgb: [198, 155, 52]  },
  { name: 'Cadmium Red',       rgb: [210, 42, 30]   },
  { name: 'Alizarin Crimson',  rgb: [171, 30, 54]   },
  { name: 'Ultramarine Blue',  rgb: [36, 42, 142]   },
  { name: 'Cerulean Blue',     rgb: [18, 116, 172]  },
  { name: 'Viridian',          rgb: [32, 108, 84]   },
  { name: 'Sap Green',         rgb: [74, 118, 40]   },
  { name: 'Burnt Sienna',      rgb: [148, 74, 34]   },
  { name: 'Raw Umber',         rgb: [115, 85, 48]   },
  { name: 'Chinese White',     rgb: [245, 243, 238] },
  { name: 'Lamp Black',        rgb: [38, 36, 34]    },
];

const WHITE_LATENT = mixbox.rgbToLatent([245, 243, 238]);
const DPR = Math.min(window.devicePixelRatio || 1, 2);

// ── Replay mode detection ──
const REPLAY_MODE = new URLSearchParams(location.search).has('replay');

// ── Stroke recording ──
const strokeLog = [];
let recordingEnabled = true;
function logEvent(evt) {
  if (recordingEnabled) strokeLog.push(evt);
}

// ── State ──
const state = {
  brushColor: null,
  brushLatent: null,
  brushBaseSize: 14,
  isDrawing: false,
  activeTarget: null,
  lastPoint: null,
  waterJarTint: [180, 210, 240],
  waterJarDirty: 0,
  wellStrokeDabs: 0, // count dabs in current well stroke
};

// ── Wells ──
const wells = [];
const NUM_WELLS = 6;

// ── Drawing canvas (WebGL) ──
let drawCanvas;
let gl, fluidSim;

// ════════════════════════════════════════════
//  COLOR PALETTE
// ════════════════════════════════════════════

function createColorSquares() {
  const container = document.getElementById('color-squares');
  PALETTE_COLORS.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'color-swatch';
    // Create a small canvas for dry paint texture
    const cv = document.createElement('canvas');
    const sz = 64;
    cv.width = sz; cv.height = sz;
    const ctx = cv.getContext('2d');
    renderDryPaintTexture(ctx, sz, c.rgb);
    el.appendChild(cv);
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      selectColor(c.rgb, i);
    });
    container.appendChild(el);
  });
}

function renderDryPaintTexture(ctx, sz, rgb) {
  const imgData = ctx.createImageData(sz, sz);
  const px = imgData.data;
  const cx = sz / 2, cy = sz / 2, maxR = sz / 2;
  for (let y = 0; y < sz; y++) {
    for (let x = 0; x < sz; x++) {
      const dx = x - cx, dy = y - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > maxR) continue;
      const nd = dist / maxR;
      // Dry paint: thicker in center, granular texture, edge buildup
      const grain = 0.7 + Math.random() * 0.3;
      const edge = nd > 0.75 ? 1 + (nd - 0.75) * 2 : 1;
      const center = 1 - nd * 0.3;
      const intensity = grain * center * edge;
      // Darken slightly for depth, lighten for dry crust spots
      const crust = Math.random() > 0.92 ? 1.15 : 1;
      const pi = (y * sz + x) * 4;
      px[pi]     = Math.min(255, Math.round(rgb[0] * intensity * crust));
      px[pi + 1] = Math.min(255, Math.round(rgb[1] * intensity * crust));
      px[pi + 2] = Math.min(255, Math.round(rgb[2] * intensity * crust));
      px[pi + 3] = Math.round(255 * Math.min(1, (1 - nd) * 4) * (0.85 + Math.random() * 0.15));
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function selectColor(rgb, idx) {
  state.brushColor = [...rgb];
  state.brushLatent = mixbox.rgbToLatent(rgb);
  const prev = document.getElementById('brush-preview');
  prev.style.background = `rgb(${rgb.join(',')})`;
  document.getElementById('brush-label').textContent =
    idx !== undefined ? PALETTE_COLORS[idx].name : `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
  document.querySelectorAll('.color-swatch').forEach((el, i) =>
    el.classList.toggle('selected', i === idx));
}

function updateBrushFromRgb(rgb) {
  state.brushColor = [...rgb];
  state.brushLatent = mixbox.rgbToLatent(rgb);
  document.getElementById('brush-preview').style.background = `rgb(${rgb.join(',')})`;
  document.getElementById('brush-label').textContent = 'Mixed';
  document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('selected'));
}

// ════════════════════════════════════════════
//  MIXING WELLS
// ════════════════════════════════════════════

function createWells() {
  const grid = document.getElementById('wells-grid');
  for (let i = 0; i < NUM_WELLS; i++) {
    const container = document.createElement('div');
    container.className = 'well-container';

    const canvas = document.createElement('canvas');
    canvas.className = 'well-canvas';
    container.appendChild(canvas);

    const clearBtn = document.createElement('button');
    clearBtn.className = 'well-clear';
    clearBtn.textContent = '\u00d7';
    clearBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      clearWell(i);
    });
    container.appendChild(clearBtn);
    grid.appendChild(container);

    const well = { canvas, ctx: null, latentBuffer: null, alphaBuffer: null, w: 0, h: 0 };
    wells.push(well);
    setupPointer(canvas, 'well', i);
  }
  requestAnimationFrame(() => wells.forEach(w => initWell(w)));
  new ResizeObserver(() => wells.forEach(w => initWell(w))).observe(grid);
}

function initWell(well) {
  const rect = well.canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const w = Math.floor(rect.width * DPR);
  const h = Math.floor(rect.height * DPR);
  if (well.w === w && well.h === h) return;
  well.canvas.width = w;
  well.canvas.height = h;
  well.w = w; well.h = h;
  well.ctx = well.canvas.getContext('2d', { willReadFrequently: true });
  well.ctx.scale(DPR, DPR);
  well.latentBuffer = new Float64Array(w * h * LATENT_SIZE);
  well.alphaBuffer = new Float32Array(w * h);
  // Initialize as transparent (alpha=0) — no paint, no color influence
  well.alphaBuffer.fill(0);
  // Clear canvas to transparent
  well.ctx.clearRect(0, 0, rect.width, rect.height);
}

function clearWell(i) {
  const w = wells[i];
  if (!w.ctx) return;
  const rect = w.canvas.getBoundingClientRect();
  w.ctx.clearRect(0, 0, rect.width, rect.height);
  // Reset to transparent — no paint
  w.latentBuffer.fill(0);
  w.alphaBuffer.fill(0);
}

// ════════════════════════════════════════════
//  WEBGL WATERCOLOR ENGINE (pigment + drying)
// ════════════════════════════════════════════
//
// Architecture: NO fluid simulation. Pigment is deposited as soft
// Gaussian splats, then diffuses while wet (wet-on-wet bleeding),
// and gets locked when wetness dries out.
//
// Per frame:
//   1. Diffuse pigment in wet areas (gated by wetness)
//   2. Dry the wetness (slow decay, faster at edges)
//   3. Display: subtractive color over paper, edge darkening, granulation

const VERT_SRC = `attribute vec2 a_pos;varying vec2 vUv;void main(){vUv=a_pos*0.5+0.5;gl_Position=vec4(a_pos,0,1);}`;

// ── Splat pigment: soft Gaussian, alpha-blend accumulation ──
const SPLAT_PIGMENT_FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uTarget;
uniform vec2 uPoint;
uniform float uRadius;
uniform float uAspect;
uniform vec3 uColor;       // absorption (1 - rgb/255)
uniform float uStrength;   // how much pigment per dab
void main(){
  vec2 p=vUv-uPoint;
  p.x*=uAspect;
  float d=length(p)/uRadius;
  // Solid Gaussian — no edge concentration
  float s=exp(-d*d*2.0)*smoothstep(1.4,0.3,d);
  vec3 base=texture2D(uTarget,vUv).rgb;
  vec3 add=uColor*s*uStrength;
  // Subtractive (alpha-over) accumulation: result = base + add*(1-base)
  vec3 result=base+add*(1.0-base);
  gl_FragColor=vec4(clamp(result,0.0,0.99),1.0);
}`;

// ── Splat wetness: additive Gaussian ──
const SPLAT_WETNESS_FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uTarget;
uniform vec2 uPoint;
uniform float uRadius;
uniform float uAspect;
uniform float uAmount;
void main(){
  vec2 p=vUv-uPoint;
  p.x*=uAspect;
  float d=length(p)/uRadius;
  float s=exp(-d*d*1.5)*smoothstep(1.5,0.2,d);
  float base=texture2D(uTarget,vUv).r;
  gl_FragColor=vec4(min(base+uAmount*s,1.0),0.0,0.0,1.0);
}`;

// ── Diffuse pigment in wet areas (the wet-on-wet bleeding effect) ──
//
// This is the heart of the watercolor look. For each pixel, we mix it
// with the average of its neighbours, but the strength of the mix is
// gated by HOW WET the source AND destination pixels are. Two adjacent
// wet pixels exchange pigment freely; a wet pixel next to a dry pixel
// barely exchanges anything (sharp edge).
const DIFFUSE_FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uPigment;
uniform sampler2D uWetness;
uniform vec2 uTexelSize;
uniform float uStrength;
void main(){
  vec3 c=texture2D(uPigment,vUv).rgb;
  float w=texture2D(uWetness,vUv).r;

  vec3 nL=texture2D(uPigment,vUv-vec2(uTexelSize.x,0.0)).rgb;
  vec3 nR=texture2D(uPigment,vUv+vec2(uTexelSize.x,0.0)).rgb;
  vec3 nT=texture2D(uPigment,vUv+vec2(0.0,uTexelSize.y)).rgb;
  vec3 nB=texture2D(uPigment,vUv-vec2(0.0,uTexelSize.y)).rgb;

  float wL=texture2D(uWetness,vUv-vec2(uTexelSize.x,0.0)).r;
  float wR=texture2D(uWetness,vUv+vec2(uTexelSize.x,0.0)).r;
  float wT=texture2D(uWetness,vUv+vec2(0.0,uTexelSize.y)).r;
  float wB=texture2D(uWetness,vUv-vec2(0.0,uTexelSize.y)).r;

  // Each neighbour contributes proportionally to its wetness gating
  float gL=min(w,wL);
  float gR=min(w,wR);
  float gT=min(w,wT);
  float gB=min(w,wB);
  float gSum=gL+gR+gT+gB;

  vec3 weighted=(nL*gL+nR*gR+nT*gT+nB*gB);
  vec3 avg = gSum>0.0 ? weighted/gSum : c;

  float strength=clamp(w*1.5,0.0,1.0)*uStrength;
  vec3 result=mix(c,avg,strength);
  gl_FragColor=vec4(result,1.0);
}`;

// ── Dry wetness, with edge-aware acceleration ──
const DRY_FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uWetness;
uniform vec2 uTexelSize;
uniform float uDryRate;
void main(){
  float w=texture2D(uWetness,vUv).r;
  if(w<=0.0){ gl_FragColor=vec4(0.0); return; }
  // Sample neighbours
  float wL=texture2D(uWetness,vUv-vec2(uTexelSize.x,0.0)).r;
  float wR=texture2D(uWetness,vUv+vec2(uTexelSize.x,0.0)).r;
  float wT=texture2D(uWetness,vUv+vec2(0.0,uTexelSize.y)).r;
  float wB=texture2D(uWetness,vUv-vec2(0.0,uTexelSize.y)).r;
  float minN=min(min(wL,wR),min(wT,wB));
  // Edge factor: pixels that are notably wetter than their drier neighbour dry faster
  float edge=max(0.0,w-minN);
  float decay=uDryRate*(1.0+edge*8.0);
  gl_FragColor=vec4(max(0.0,w-decay),0.0,0.0,1.0);
}`;

// ── Display: composite pigment over paper, with rim darkening + granulation ──
const DISPLAY_FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uPigment;
uniform sampler2D uPaper;
uniform sampler2D uWetness;
uniform vec2 uTexelSize;
void main(){
  vec3 pig=texture2D(uPigment,vUv).rgb;
  float paper=texture2D(uPaper,vUv).r;
  float wet=texture2D(uWetness,vUv).r;
  float density=length(pig);

  // ── Edge darkening (Sobel on pigment density) ──
  float dL=length(texture2D(uPigment,vUv-vec2(uTexelSize.x,0.0)).rgb);
  float dR=length(texture2D(uPigment,vUv+vec2(uTexelSize.x,0.0)).rgb);
  float dT=length(texture2D(uPigment,vUv+vec2(0.0,uTexelSize.y)).rgb);
  float dB=length(texture2D(uPigment,vUv-vec2(0.0,uTexelSize.y)).rgb);
  float gx=dR-dL;
  float gy=dT-dB;
  float edge=sqrt(gx*gx+gy*gy);
  float rim=edge*2.5*smoothstep(0.02,0.2,density);

  // ── Granulation: pigment darker in paper valleys ──
  float granulation=1.0-(1.0-paper)*0.35*smoothstep(0.0,0.3,density);

  // ── Effective absorption ──
  vec3 absorbed=pig*granulation*(1.0+rim*1.2);
  absorbed=clamp(absorbed,0.0,0.99);

  // ── Subtractive composite ──
  vec3 paperBase=vec3(0.98,0.97,0.94);
  vec3 paperWhite=paperBase*(0.88+paper*0.12);
  vec3 paintColor=paperWhite*(1.0-absorbed);

  // ── Wet area is slightly darker (looks shiny) ──
  paintColor*=1.0-wet*0.06;

  gl_FragColor=vec4(paintColor,1.0);
}`;

class Watercolor {
  constructor(canvas) {
    this.canvas = canvas;
    dbg('Init WebGL...');
    const g = canvas.getContext('webgl', { alpha: false, premultipliedAlpha: false });
    if (!g) throw new Error('WebGL not available');
    this.gl = g;
    gl = g;
    dbg('WebGL OK');

    const floatExt = g.getExtension('OES_texture_float');
    const halfFloatExt = g.getExtension('OES_texture_half_float');
    this.hasFloat = !!floatExt;
    this.halfFloatType = halfFloatExt ? halfFloatExt.HALF_FLOAT_OES : null;
    this.hasFloatLinear = !!g.getExtension('OES_texture_float_linear');
    this.hasHalfFloatLinear = !!g.getExtension('OES_texture_half_float_linear');
    dbg('Float:'+this.hasFloat+' Half:'+ !!this.halfFloatType+' FloatLinear:'+this.hasFloatLinear);

    this.resize();
    dbg('Size:'+this.w+'x'+this.h);
    this._initShaders();
    dbg('Shaders OK');
    this._initBuffers();
    this._initTextures();
    dbg('FBOs OK');
    this._generatePaper();
    dbg('Paper OK');

    this.lastTime = 0;
    this.frameCount = 0;
    this._tick = this._tick.bind(this);
    requestAnimationFrame(this._tick);
  }

  resize() {
    const rect = this.canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    // Sim resolution — keep around 600px on the long side for responsiveness
    const simScale = 0.6;
    this.w = Math.floor(rect.width * dpr * simScale);
    this.h = Math.floor(rect.height * dpr * simScale);
    this.canvas.width = Math.floor(rect.width * dpr);
    this.canvas.height = Math.floor(rect.height * dpr);
    this.aspect = this.w / this.h;
    this.texelSize = [1.0 / this.w, 1.0 / this.h];
  }

  _compileShader(src, type) {
    const g = this.gl;
    const s = g.createShader(type);
    g.shaderSource(s, src);
    g.compileShader(s);
    if (!g.getShaderParameter(s, g.COMPILE_STATUS)) {
      dbg('SHADER ERR:'+g.getShaderInfoLog(s));
    }
    return s;
  }

  _createProgram(fragSrc) {
    const g = this.gl;
    const p = g.createProgram();
    g.attachShader(p, this._compileShader(VERT_SRC, g.VERTEX_SHADER));
    g.attachShader(p, this._compileShader(fragSrc, g.FRAGMENT_SHADER));
    g.linkProgram(p);
    if (!g.getProgramParameter(p, g.LINK_STATUS)) {
      dbg('LINK ERR:'+g.getProgramInfoLog(p));
    }
    const uniforms = {};
    const n = g.getProgramParameter(p, g.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const info = g.getActiveUniform(p, i);
      uniforms[info.name] = g.getUniformLocation(p, info.name);
    }
    return { program: p, uniforms };
  }

  _initShaders() {
    this.splatPigmentProg = this._createProgram(SPLAT_PIGMENT_FRAG);
    this.splatWetnessProg = this._createProgram(SPLAT_WETNESS_FRAG);
    this.diffuseProg      = this._createProgram(DIFFUSE_FRAG);
    this.dryProg          = this._createProgram(DRY_FRAG);
    this.displayProg      = this._createProgram(DISPLAY_FRAG);
  }

  _initBuffers() {
    const g = this.gl;
    const buf = g.createBuffer();
    g.bindBuffer(g.ARRAY_BUFFER, buf);
    g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), g.STATIC_DRAW);
    this.quadBuf = buf;
  }

  _createFBO(w, h) {
    const g = this.gl;
    let type;
    if (this.hasFloat && this.hasFloatLinear) type = g.FLOAT;
    else if (this.halfFloatType && this.hasHalfFloatLinear) type = this.halfFloatType;
    else if (this.hasFloat) type = g.FLOAT;
    else if (this.halfFloatType) type = this.halfFloatType;
    else type = g.UNSIGNED_BYTE;
    const canLinear = (type === g.FLOAT && this.hasFloatLinear) ||
                      (type === this.halfFloatType && this.hasHalfFloatLinear) ||
                      (type === g.UNSIGNED_BYTE);
    const filter = canLinear ? g.LINEAR : g.NEAREST;
    if (!this._loggedFBO) { dbg('FBO type:'+(type===g.FLOAT?'F32':type===this.halfFloatType?'F16':'U8')+' filter:'+(canLinear?'LIN':'NEAR')); this._loggedFBO=true; }
    const tex = g.createTexture();
    g.bindTexture(g.TEXTURE_2D, tex);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MIN_FILTER, filter);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MAG_FILTER, filter);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_S, g.CLAMP_TO_EDGE);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_T, g.CLAMP_TO_EDGE);
    g.texImage2D(g.TEXTURE_2D, 0, g.RGBA, w, h, 0, g.RGBA, type, null);
    const fbo = g.createFramebuffer();
    g.bindFramebuffer(g.FRAMEBUFFER, fbo);
    g.framebufferTexture2D(g.FRAMEBUFFER, g.COLOR_ATTACHMENT0, g.TEXTURE_2D, tex, 0);
    const status = g.checkFramebufferStatus(g.FRAMEBUFFER);
    if (status !== g.FRAMEBUFFER_COMPLETE) {
      dbg('FBO incomplete:'+status);
      if (type === g.FLOAT && this.halfFloatType) {
        g.bindFramebuffer(g.FRAMEBUFFER, null);
        g.deleteTexture(tex);
        g.deleteFramebuffer(fbo);
        this.hasFloat = false;
        return this._createFBO(w, h);
      }
      if (type !== g.UNSIGNED_BYTE) {
        g.bindFramebuffer(g.FRAMEBUFFER, null);
        g.deleteTexture(tex);
        g.deleteFramebuffer(fbo);
        this.hasFloat = false;
        this.halfFloatType = null;
        return this._createFBO(w, h);
      }
    }
    g.clearColor(0, 0, 0, 0);
    g.clear(g.COLOR_BUFFER_BIT);
    g.bindFramebuffer(g.FRAMEBUFFER, null);
    return { tex, fbo, w, h };
  }

  _createDoubleFBO(w, h) {
    return {
      read: this._createFBO(w, h),
      write: this._createFBO(w, h),
      swap() { const t = this.read; this.read = this.write; this.write = t; }
    };
  }

  _initTextures() {
    this.pigment = this._createDoubleFBO(this.w, this.h);
    this.wetness = this._createDoubleFBO(this.w, this.h);
  }

  _generatePaper() {
    const g = this.gl;
    const w = this.w, h = this.h;
    const data = new Uint8Array(w * h * 4);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        let v = 0, amp = 1, freq = 1;
        for (let oct = 0; oct < 4; oct++) {
          v += amp * (Math.sin(x * freq * 0.1 + Math.sin(y * freq * 0.13)) *
                      Math.cos(y * freq * 0.12 + Math.cos(x * freq * 0.11)) * 0.5 + 0.5);
          amp *= 0.5; freq *= 2.1;
        }
        v = v / 1.875;
        // Stronger paper texture (15% range) — granulation needs visible variation
        const grain = Math.round((0.85 + v * 0.15) * 255);
        data[i] = grain; data[i+1] = grain; data[i+2] = grain; data[i+3] = 255;
      }
    }
    const tex = g.createTexture();
    g.bindTexture(g.TEXTURE_2D, tex);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MIN_FILTER, g.LINEAR);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MAG_FILTER, g.LINEAR);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_S, g.CLAMP_TO_EDGE);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_T, g.CLAMP_TO_EDGE);
    g.texImage2D(g.TEXTURE_2D, 0, g.RGBA, w, h, 0, g.RGBA, g.UNSIGNED_BYTE, data);
    this.paperTex = tex;
  }

  _draw(prog, target) {
    const g = this.gl;
    g.useProgram(prog.program);
    if (target) {
      g.viewport(0, 0, target.w, target.h);
      g.bindFramebuffer(g.FRAMEBUFFER, target.fbo);
    } else {
      g.viewport(0, 0, this.canvas.width, this.canvas.height);
      g.bindFramebuffer(g.FRAMEBUFFER, null);
    }
    g.bindBuffer(g.ARRAY_BUFFER, this.quadBuf);
    const loc = g.getAttribLocation(prog.program, 'a_pos');
    g.enableVertexAttribArray(loc);
    g.vertexAttribPointer(loc, 2, g.FLOAT, false, 0, 0);
    g.drawArrays(g.TRIANGLE_STRIP, 0, 4);
  }

  _bindTex(prog, name, tex, unit) {
    const g = this.gl;
    g.activeTexture(g.TEXTURE0 + unit);
    g.bindTexture(g.TEXTURE_2D, tex);
    g.uniform1i(prog.uniforms[name], unit);
  }

  // Public splat API.
  // Position is in normalized [0..1] coords (origin bottom-left like UV).
  // dx/dy are unused now (no velocity field) but kept for API compatibility.
  splat(x, y, dx, dy, color, radius, waterContent) {
    const g = this.gl;
    waterContent = waterContent !== undefined ? waterContent : 0.7;

    // 1. Splat pigment
    const sp = this.splatPigmentProg;
    g.useProgram(sp.program);
    this._bindTex(sp, 'uTarget', this.pigment.read.tex, 0);
    g.uniform2f(sp.uniforms.uPoint, x, y);
    g.uniform1f(sp.uniforms.uRadius, radius);
    g.uniform1f(sp.uniforms.uAspect, this.aspect);
    g.uniform3f(sp.uniforms.uColor,
      1.0 - color[0]/255,
      1.0 - color[1]/255,
      1.0 - color[2]/255);
    // Strength scales with water — drier brush deposits more concentrated pigment
    g.uniform1f(sp.uniforms.uStrength, 0.32);
    this._draw(sp, this.pigment.write);
    this.pigment.swap();

    // 2. Splat wetness — slightly larger than pigment for halo effect
    const wp = this.splatWetnessProg;
    g.useProgram(wp.program);
    this._bindTex(wp, 'uTarget', this.wetness.read.tex, 0);
    g.uniform2f(wp.uniforms.uPoint, x, y);
    g.uniform1f(wp.uniforms.uRadius, radius * 1.25);
    g.uniform1f(wp.uniforms.uAspect, this.aspect);
    g.uniform1f(wp.uniforms.uAmount, waterContent * 0.55);
    this._draw(wp, this.wetness.write);
    this.wetness.swap();
  }

  step(dt) {
    const g = this.gl;

    // 1. Diffuse pigment in wet areas — multiple iterations for stronger bleed
    const dp = this.diffuseProg;
    g.useProgram(dp.program);
    for (let i = 0; i < 2; i++) {
      this._bindTex(dp, 'uPigment', this.pigment.read.tex, 0);
      this._bindTex(dp, 'uWetness', this.wetness.read.tex, 1);
      g.uniform2f(dp.uniforms.uTexelSize, this.texelSize[0], this.texelSize[1]);
      g.uniform1f(dp.uniforms.uStrength, 0.55);
      this._draw(dp, this.pigment.write);
      this.pigment.swap();
    }

    // 2. Dry the wetness
    const drp = this.dryProg;
    g.useProgram(drp.program);
    this._bindTex(drp, 'uWetness', this.wetness.read.tex, 0);
    g.uniform2f(drp.uniforms.uTexelSize, this.texelSize[0], this.texelSize[1]);
    g.uniform1f(drp.uniforms.uDryRate, 0.0015);
    this._draw(drp, this.wetness.write);
    this.wetness.swap();
  }

  render() {
    const g = this.gl;
    g.viewport(0, 0, this.canvas.width, this.canvas.height);
    g.bindFramebuffer(g.FRAMEBUFFER, null);

    const rp = this.displayProg;
    g.useProgram(rp.program);
    this._bindTex(rp, 'uPigment', this.pigment.read.tex, 0);
    this._bindTex(rp, 'uPaper', this.paperTex, 1);
    this._bindTex(rp, 'uWetness', this.wetness.read.tex, 2);
    g.uniform2f(rp.uniforms.uTexelSize, this.texelSize[0], this.texelSize[1]);

    g.bindBuffer(g.ARRAY_BUFFER, this.quadBuf);
    const loc = g.getAttribLocation(rp.program, 'a_pos');
    g.enableVertexAttribArray(loc);
    g.vertexAttribPointer(loc, 2, g.FLOAT, false, 0, 0);
    g.drawArrays(g.TRIANGLE_STRIP, 0, 4);
  }

  clear() {
    const g = this.gl;
    const clearFBO = (dfbo) => {
      g.bindFramebuffer(g.FRAMEBUFFER, dfbo.read.fbo);
      g.clearColor(0, 0, 0, 0);
      g.clear(g.COLOR_BUFFER_BIT);
      g.bindFramebuffer(g.FRAMEBUFFER, dfbo.write.fbo);
      g.clear(g.COLOR_BUFFER_BIT);
    };
    clearFBO(this.pigment);
    clearFBO(this.wetness);
    g.bindFramebuffer(g.FRAMEBUFFER, null);
  }

  _tick(now) {
    requestAnimationFrame(this._tick);
    const dt = this.lastTime ? (now - this.lastTime) / 1000 : 0.016;
    this.lastTime = now;
    this.step(dt);
    this.render();
    this.frameCount++;
    if (this.frameCount === 1) {
      const err = this.gl.getError();
      if (err) dbg('GL ERR:'+err);
      else dbg('Frame1 OK');
    }
  }
}

// Backwards-compatible alias for existing call sites
const FluidSim = Watercolor;


function setupDrawingCanvas() {
  drawCanvas = document.getElementById('drawing-canvas');

  function initDraw() {
    if (fluidSim) return;
    const rect = drawCanvas.getBoundingClientRect();
    if (!rect.width || !rect.height) {
      requestAnimationFrame(initDraw); // retry until laid out
      return;
    }
    try {
      fluidSim = new FluidSim(drawCanvas);
    } catch (e) {
      dbg('INIT FAIL:'+e.message);
      drawCanvas.style.background = '#fff';
      const el = document.createElement('div');
      el.style.cssText = 'position:absolute;top:10px;left:10px;color:red;font-size:14px;z-index:99';
      el.textContent = 'WebGL error: ' + e.message;
      drawCanvas.parentElement.appendChild(el);
    }
  }

  // Canvas pointer handling
  for (const evt of ['touchstart', 'touchmove', 'touchend']) {
    drawCanvas.addEventListener(evt, e => e.preventDefault(), { passive: false });
  }

  let lastSplatPos = null;

  drawCanvas.addEventListener('pointerdown', (e) => {
    if (!state.brushColor) return;
    e.preventDefault();
    drawCanvas.setPointerCapture(e.pointerId);
    state.isDrawing = true;
    state.activeTarget = { type: 'canvas', index: 0 };
    canvasStrokeDabs = 0; // reset water content for new stroke
    logEvent({t:'strokeStart', c:[...state.brushColor], size:state.brushBaseSize});
    const pos = getCanvasPos(e);
    lastSplatPos = pos;
    doSplat(pos, null);
  });

  drawCanvas.addEventListener('pointermove', (e) => {
    if (!state.isDrawing || !state.activeTarget || state.activeTarget.type !== 'canvas') return;
    e.preventDefault();
    const pos = getCanvasPos(e);
    if (lastSplatPos) {
      // Interpolate splats along the stroke for continuous paint
      const dx = pos.x - lastSplatPos.x;
      const dy = pos.y - lastSplatPos.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const step = Math.max(0.002, (state.brushBaseSize / 800) * 0.3);
      const steps = Math.max(1, Math.ceil(dist / step));
      let prev = lastSplatPos;
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        const p = {
          x: lastSplatPos.x + dx * t,
          y: lastSplatPos.y + dy * t,
          pressure: lastSplatPos.pressure + (pos.pressure - lastSplatPos.pressure) * t
        };
        doSplat(p, prev);
        prev = p;
      }
    }
    lastSplatPos = pos;
  });

  const endCanvas = () => {
    if (state.activeTarget && state.activeTarget.type === 'canvas') {
      state.isDrawing = false;
      state.activeTarget = null;
      lastSplatPos = null;
      logEvent({t:'strokeEnd'});
    }
  };
  drawCanvas.addEventListener('pointerup', endCanvas);
  drawCanvas.addEventListener('pointercancel', endCanvas);

  function getCanvasPos(e) {
    const rect = drawCanvas.getBoundingClientRect();
    let pressure = 0.5;
    if (e.pressure > 0 && e.pressure < 1) pressure = e.pressure;
    return {
      x: (e.clientX - rect.left) / rect.width,
      y: 1.0 - (e.clientY - rect.top) / rect.height, // flip Y for GL
      pressure
    };
  }

  let splatCount = 0;
  let canvasStrokeDabs = 0;
  function doSplat(pos, prev) {
    if (!fluidSim || !state.brushColor) return;
    canvasStrokeDabs++;
    const p = pos.pressure;
    const radius = (state.brushBaseSize / 300) * (0.5 + p * 0.8);
    let dx = 0, dy = 0;
    if (prev) {
      dx = pos.x - prev.x;
      dy = pos.y - prev.y;
    }
    // Water content: starts high, decreases gradually as brush runs out.
    // Fade calibrated to ~800 splats (roughly one full-width stroke).
    const strokeFade = Math.max(0.2, 1.0 - canvasStrokeDabs / 800);
    const waterContent = Math.min(1.0, strokeFade * (0.5 + p * 0.5));
    fluidSim.splat(pos.x, pos.y, dx, dy, state.brushColor, radius, waterContent);
    logEvent({t:'splat', x:pos.x, y:pos.y, dx, dy, c:[...state.brushColor], r:radius, w:waterContent});
  }

  requestAnimationFrame(initDraw);
}

// ════════════════════════════════════════════
//  POINTER / STROKE HANDLING
// ════════════════════════════════════════════

function setupPointer(canvas, type, index) {
  // Block Safari gestures
  for (const evt of ['touchstart', 'touchmove', 'touchend']) {
    canvas.addEventListener(evt, e => e.preventDefault(), { passive: false });
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (!state.brushColor) return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    state.isDrawing = true;
    state.activeTarget = { type, index };
    state.wellStrokeDabs = 0;
    const pos = getPos(e, canvas);
    state.lastPoint = pos;
    dab(type, index, pos);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!state.isDrawing || !state.activeTarget) return;
    if (state.activeTarget.type !== type || state.activeTarget.index !== index) return;
    e.preventDefault();
    const pos = getPos(e, canvas);
    strokeTo(type, index, state.lastPoint, pos);
    state.lastPoint = pos;
  });

  const end = () => {
    if (state.activeTarget && state.activeTarget.type === type && state.activeTarget.index === index) {
      state.isDrawing = false;
      state.activeTarget = null;
      state.lastPoint = null;
    }
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
}

function getPos(e, canvas) {
  const rect = canvas.getBoundingClientRect();
  // pressure: Apple Pencil provides 0-1, finger defaults to 0.5
  let pressure = 0.5;
  if (e.pressure > 0 && e.pressure < 1) pressure = e.pressure;
  return { x: e.clientX - rect.left, y: e.clientY - rect.top, pressure };
}

function strokeTo(type, index, p1, p2) {
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const step = Math.max(1, state.brushBaseSize * 0.25);
  const steps = Math.ceil(dist / step);
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    dab(type, index, {
      x: p1.x + dx * t,
      y: p1.y + dy * t,
      pressure: p1.pressure + (p2.pressure - p1.pressure) * t
    });
  }
}

function dab(type, index, pos) {
  if (type !== 'well') return; // Canvas handled by WebGL pointer events
  state.wellStrokeDabs++;
  const p = pos.pressure;
  const sizeMul = 0.4 + p * 1.1;
  const radius = state.brushBaseSize * sizeMul * 0.5;
  const opacity = 1.0;
  dabOnWell(index, pos.x, pos.y, radius, opacity);
}

// ════════════════════════════════════════════
//  DAB ON WELL  — latent mixing + live pickup
// ════════════════════════════════════════════

function dabOnWell(wi, cx, cy, radius, opacity) {
  const well = wells[wi];
  if (!well.ctx || !well.latentBuffer) return;
  const bl = state.brushLatent;
  const r = radius;
  const x0 = Math.max(0, Math.floor((cx - r) * DPR));
  const y0 = Math.max(0, Math.floor((cy - r) * DPR));
  const x1 = Math.min(well.w - 1, Math.ceil((cx + r) * DPR));
  const y1 = Math.min(well.h - 1, Math.ceil((cy + r) * DPR));
  const imgW = x1 - x0 + 1, imgH = y1 - y0 + 1;
  if (imgW <= 0 || imgH <= 0) return;

  const imgData = well.ctx.getImageData(x0, y0, imgW, imgH);
  const px = imgData.data;
  let pR = 0, pG = 0, pB = 0, pN = 0;

  for (let py = y0; py <= y1; py++) {
    for (let ppx = x0; ppx <= x1; ppx++) {
      const dx = ppx / DPR - cx, dy = py / DPR - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > r) continue;
      const nd = dist / r;
      const ef = 0.5 + 0.5 * nd * nd;
      const da = opacity * ef * (1 - nd * nd * 0.3);

      const idx = py * well.w + ppx;
      const ea = well.alphaBuffer[idx];
      const li = idx * LATENT_SIZE;

      // If pixel is unpainted (alpha near 0), deposit brush color directly
      if (ea < 0.05) {
        for (let k = 0; k < LATENT_SIZE; k++)
          well.latentBuffer[li + k] = bl[k];
        well.alphaBuffer[idx] = da;
      } else {
        // Mix with existing paint
        const strokeFade = Math.min(state.wellStrokeDabs / 60, 1);
        const mixDa = da * (1.0 - strokeFade * 0.7);
        const k1 = 1 - mixDa;
        for (let k = 0; k < LATENT_SIZE; k++)
          well.latentBuffer[li + k] = well.latentBuffer[li + k] * k1 + bl[k] * mixDa;
        well.alphaBuffer[idx] = Math.min(1, ea + da * (1 - ea));
      }

      const sl = [];
      for (let k = 0; k < LATENT_SIZE; k++) sl.push(well.latentBuffer[li + k]);
      const rgb = mixbox.latentToRgb(sl);

      const pi = ((py - y0) * imgW + (ppx - x0)) * 4;
      px[pi] = Math.round(rgb[0]);
      px[pi + 1] = Math.round(rgb[1]);
      px[pi + 2] = Math.round(rgb[2]);
      px[pi + 3] = Math.round(well.alphaBuffer[idx] * 255);

      // Only sample painted pixels for pickup (alpha > 0.1)
      if (nd < 0.3 && well.alphaBuffer[idx] > 0.1) {
        pR += rgb[0]; pG += rgb[1]; pB += rgb[2]; pN++;
      }
    }
  }
  well.ctx.putImageData(imgData, x0, y0);
  if (pN > 0) updateBrushFromRgb([Math.round(pR/pN), Math.round(pG/pN), Math.round(pB/pN)]);
}

// (Canvas painting + fluid sim handled by FluidSim WebGL class above)

// ════════════════════════════════════════════
//  WATER JAR
// ════════════════════════════════════════════

function setupWaterJar() {
  const jar = document.getElementById('water-jar');
  let downT = 0;
  jar.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  jar.addEventListener('pointerdown', (e) => { e.preventDefault(); downT = Date.now(); });
  jar.addEventListener('pointerup', () => {
    if (!state.brushColor) return;
    (Date.now() - downT >= 500) ? cleanBrush() : diluteBrush();
  });
}

function diluteBrush() {
  if (!state.brushLatent) return;
  for (let k = 0; k < LATENT_SIZE; k++)
    state.brushLatent[k] = state.brushLatent[k] * 0.7 + WHITE_LATENT[k] * 0.3;
  const rgb = mixbox.latentToRgb(Array.from(state.brushLatent));
  state.brushColor = [Math.round(rgb[0]), Math.round(rgb[1]), Math.round(rgb[2])];
  document.getElementById('brush-preview').style.background = `rgb(${state.brushColor.join(',')})`;
  document.getElementById('brush-label').textContent = 'Diluted';
}

function cleanBrush() {
  if (state.brushColor) {
    const jt = state.waterJarTint, bc = state.brushColor;
    const b = 0.15 + state.waterJarDirty * 0.05;
    state.waterJarTint = [
      Math.round(jt[0]*(1-b) + bc[0]*b),
      Math.round(jt[1]*(1-b) + bc[1]*b),
      Math.round(jt[2]*(1-b) + bc[2]*b),
    ];
    state.waterJarDirty = Math.min(1, state.waterJarDirty + 0.12);
    const fill = document.getElementById('water-jar-fill');
    const t = state.waterJarTint;
    fill.style.background = `rgba(${t[0]},${t[1]},${t[2]},${0.3 + state.waterJarDirty * 0.4})`;
  }
  state.brushColor = [200, 200, 200];
  state.brushLatent = mixbox.rgbToLatent([200, 200, 200]);
  document.getElementById('brush-preview').style.background = '#ccc';
  document.getElementById('brush-label').textContent = 'Clean \u2014 pick a color';
}

// ════════════════════════════════════════════
//  CONTROLS
// ════════════════════════════════════════════

function createBrushSizeDots() {
  const container = document.getElementById('brush-size-container');
  const sizes = [4, 8, 14, 22, 34, 50];
  sizes.forEach(s => {
    const dot = document.createElement('div');
    dot.className = 'size-dot' + (s === state.brushBaseSize ? ' selected' : '');
    const displaySize = Math.max(8, Math.round(s * 0.6));
    dot.style.width = displaySize + 'px';
    dot.style.height = displaySize + 'px';
    dot.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      state.brushBaseSize = s;
      container.querySelectorAll('.size-dot').forEach(d => d.classList.remove('selected'));
      dot.classList.add('selected');
    });
    container.appendChild(dot);
  });
}

function setupControls() {
  createBrushSizeDots();
  document.getElementById('clean-palette').addEventListener('click', () => {
    for (let i = 0; i < NUM_WELLS; i++) clearWell(i);
  });
  document.getElementById('clear-canvas-btn').addEventListener('click', () => {
    if (fluidSim) fluidSim.clear();
  });
  document.getElementById('export-log-btn').addEventListener('click', () => {
    if (strokeLog.length === 0) {
      alert('No strokes recorded yet. Paint something first!');
      return;
    }
    const blob = new Blob([JSON.stringify(strokeLog)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'strokes.json';
    a.click();
    URL.revokeObjectURL(a.href);
    dbg('Exported ' + strokeLog.length + ' events');
  });

  document.getElementById('load-log-btn').addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      file.text().then(text => {
        const events = JSON.parse(text);
        dbg('Loaded ' + events.length + ' events, replaying...');
        replayStrokes(events);
      });
    };
    input.click();
  });
}

// ════════════════════════════════════════════
//  STROKE REPLAY
// ════════════════════════════════════════════

function replayStrokes(events) {
  if (!fluidSim) { dbg('No FluidSim — cannot replay'); return; }
  recordingEnabled = false; // don't re-record during replay
  fluidSim.clear();

  // Group events into batches separated by strokeEnd markers
  // Replay splats with small delays to let simulation process between strokes
  let i = 0;
  const SPLATS_PER_FRAME = 8; // process N splats per animation frame

  function replayBatch() {
    let count = 0;
    while (i < events.length && count < SPLATS_PER_FRAME) {
      const ev = events[i++];
      if (ev.t === 'splat') {
        fluidSim.splat(ev.x, ev.y, ev.dx, ev.dy, ev.c, ev.r, ev.w);
        count++;
      }
      // strokeStart/strokeEnd just advance — they're boundaries
    }

    if (i < events.length) {
      requestAnimationFrame(replayBatch);
    } else {
      // Let simulation settle for ~60 frames, then screenshot
      dbg('Replay done. Settling...');
      let settleFrames = 0;
      function settle() {
        settleFrames++;
        if (settleFrames < 60) {
          requestAnimationFrame(settle);
        } else {
          captureScreenshot();
          recordingEnabled = true;
          dbg('Screenshot saved.');
        }
      }
      requestAnimationFrame(settle);
    }
  }

  requestAnimationFrame(replayBatch);
}

function captureScreenshot() {
  const canvas = document.getElementById('drawing-canvas');
  // Force a render so the canvas has current content
  fluidSim.render();
  const dataURL = canvas.toDataURL('image/png');
  // Auto-download
  const a = document.createElement('a');
  a.href = dataURL;
  a.download = 'replay-screenshot.png';
  a.click();
  // Also expose globally so it can be grabbed programmatically
  window._lastScreenshot = dataURL;
  dbg('Screenshot captured (' + Math.round(dataURL.length/1024) + 'KB)');
}

// Auto-replay if ?replay URL param points to a stroke file
function checkAutoReplay() {
  const params = new URLSearchParams(location.search);
  const replayFile = params.get('replay');
  if (replayFile) {
    dbg('Auto-replay: loading ' + replayFile);
    fetch(replayFile)
      .then(r => r.json())
      .then(events => {
        dbg('Loaded ' + events.length + ' events');
        // Wait for FluidSim to be ready
        function waitAndReplay() {
          if (fluidSim) {
            replayStrokes(events);
          } else {
            requestAnimationFrame(waitAndReplay);
          }
        }
        waitAndReplay();
      })
      .catch(e => dbg('Replay load error: ' + e.message));
  }
}

// ════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════

function init() {
  createColorSquares();
  createWells();
  setupDrawingCanvas();
  setupWaterJar();
  setupControls();
  selectColor(PALETTE_COLORS[0].rgb, 0);
  checkAutoReplay();
}

if (document.readyState === 'loading')
  document.addEventListener('DOMContentLoaded', init);
else
  init();

})();
</script>
