<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Artist Palette</title>
<script src="mixbox.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100dvh;
  overflow: hidden;
  touch-action: none;
  background: #2a2520;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  user-select: none;
  -webkit-user-select: none;
}

#app {
  display: grid;
  grid-template-columns: 260px 1fr;
  height: 100dvh;
  gap: 0;
}

/* ── Palette Panel ── */
#palette-panel {
  background: #3a342e;
  display: flex;
  flex-direction: column;
  padding: 10px;
  gap: 8px;
  overflow: hidden;
}

#color-squares {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
  flex-shrink: 0;
}
.color-swatch {
  aspect-ratio: 1;
  border-radius: 6px;
  border: 3px solid transparent;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.1s;
  position: relative;
}
.color-swatch.selected {
  border-color: #fff;
  box-shadow: 0 0 0 2px #555, 0 0 12px rgba(255,255,255,0.3);
  transform: scale(1.08);
  z-index: 1;
}
.color-swatch:active { transform: scale(0.95); }

#brush-preview-container {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  flex-shrink: 0;
}
#brush-preview {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 2px solid #666;
  background: #222;
  flex-shrink: 0;
  transition: background-color 0.15s;
}
#brush-label {
  color: #aaa;
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#wells-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  flex: 1;
  min-height: 0;
}
.well-container {
  position: relative;
  border-radius: 10px;
  background: #c8bba8;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.4), inset 0 -1px 2px rgba(255,255,255,0.15);
  overflow: hidden;
}
.well-canvas {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 10px;
  cursor: crosshair;
}
.well-clear {
  position: absolute;
  top: 3px; right: 3px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: rgba(0,0,0,0.4);
  color: #ccc;
  border: none;
  font-size: 11px;
  line-height: 18px;
  text-align: center;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 2;
}
.well-container:hover .well-clear,
.well-container:active .well-clear { opacity: 1; }

#water-jar {
  flex-shrink: 0;
  height: 52px;
  border-radius: 8px;
  border: 2px solid #665e54;
  background: linear-gradient(to bottom, rgba(180,210,240,0.15) 0%, rgba(140,190,230,0.5) 100%);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #aaa;
  font-size: 12px;
  position: relative;
  overflow: hidden;
  transition: background 0.3s;
}
#water-jar-fill {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 70%;
  background: rgba(160,200,235,0.35);
  transition: background 0.5s;
  pointer-events: none;
}
#water-jar-label { position: relative; z-index: 1; pointer-events: none; }
#water-jar:active { background: rgba(180,210,240,0.4); }

#palette-controls {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.ctrl-btn {
  flex: 1;
  padding: 8px 4px;
  border-radius: 6px;
  border: 1px solid #555;
  background: #4a433b;
  color: #ccc;
  font-size: 11px;
  cursor: pointer;
  white-space: nowrap;
}
.ctrl-btn:active { background: #5a534b; }

#brush-size-container {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
#brush-size-container label { color: #888; font-size: 11px; }
#brush-size {
  flex: 1;
  accent-color: #888;
  height: 20px;
}

/* ── Canvas Panel ── */
#canvas-panel {
  display: flex;
  flex-direction: column;
  background: #555;
  position: relative;
}
#drawing-canvas {
  flex: 1;
  display: block;
  cursor: crosshair;
  background: #fff;
}

/* Portrait / phone layout */
@media (max-aspect-ratio: 4/5) {
  #app {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
  }
  #palette-panel {
    flex-direction: column;
    padding: 6px;
    gap: 4px;
    max-height: none;
    overflow: visible;
  }
  #color-squares {
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
  }
  .color-swatch { aspect-ratio: 1; }
  #brush-preview-container { padding: 2px 0; }
  #brush-preview { width: 28px; height: 28px; }
  #wells-grid {
    grid-template-columns: repeat(3, 1fr);
    min-height: 70px;
    max-height: 90px;
  }
  #water-jar { height: 36px; font-size: 11px; }
  #brush-size-container { gap: 4px; }
  #palette-controls { gap: 4px; }
  .ctrl-btn { padding: 6px 4px; font-size: 10px; }
}

/* Very small phones (iPhone SE etc.) */
@media (max-width: 380px) {
  #color-squares {
    grid-template-columns: repeat(4, 1fr);
  }
  #wells-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* Landscape phone */
@media (max-height: 500px) and (min-aspect-ratio: 1/1) {
  #app { grid-template-columns: 200px 1fr; }
  #palette-panel { padding: 6px; gap: 4px; }
  #color-squares { gap: 3px; }
  .color-swatch { border-width: 2px; }
  #brush-preview { width: 24px; height: 24px; }
  #water-jar { height: 32px; font-size: 10px; }
  .ctrl-btn { padding: 5px 3px; font-size: 10px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="palette-panel">
    <div id="color-squares"></div>
    <div id="brush-preview-container">
      <div id="brush-preview"></div>
      <span id="brush-label">Tap a color to start</span>
    </div>
    <div id="wells-grid"></div>
    <div id="water-jar">
      <div id="water-jar-fill"></div>
      <span id="water-jar-label">Water Jar &middot; tap: dilute &middot; hold: clean</span>
    </div>
    <div id="brush-size-container">
      <label>Size</label>
      <input type="range" id="brush-size" min="2" max="60" value="14">
    </div>
    <div id="palette-controls">
      <button class="ctrl-btn" id="clean-palette">Clean Wells</button>
      <button class="ctrl-btn" id="clear-canvas-btn">Clear Canvas</button>
    </div>
  </div>
  <div id="canvas-panel">
    <canvas id="drawing-canvas"></canvas>
  </div>
</div>

<script>
(function() {
'use strict';

const LATENT_SIZE = typeof mixbox !== 'undefined' ? mixbox.LATENT_SIZE : 7;
const PALETTE_COLORS = [
  { name: 'Cadmium Yellow',   rgb: [255, 211, 0]   },
  { name: 'Yellow Ochre',     rgb: [204, 164, 61]  },
  { name: 'Cadmium Red',      rgb: [227, 38, 38]   },
  { name: 'Alizarin Crimson', rgb: [179, 27, 53]   },
  { name: 'Ultramarine Blue', rgb: [25, 40, 150]   },
  { name: 'Cerulean Blue',    rgb: [0, 123, 184]   },
  { name: 'Phthalo Green',    rgb: [18, 100, 70]   },
  { name: 'Sap Green',        rgb: [80, 125, 42]   },
  { name: 'Burnt Sienna',     rgb: [150, 78, 36]   },
  { name: 'Burnt Umber',      rgb: [101, 67, 33]   },
  { name: 'Titanium White',   rgb: [248, 248, 245] },
  { name: 'Ivory Black',      rgb: [35, 31, 28]    },
];

const WHITE_LATENT = mixbox.rgbToLatent([248, 248, 245]);
const DPR = Math.min(window.devicePixelRatio || 1, 2);

// ── State ──
const state = {
  brushColor: null,
  brushLatent: null,
  brushBaseSize: 14,
  isDrawing: false,
  activeTarget: null,
  lastPoint: null,
  waterJarTint: [180, 210, 240],
  waterJarDirty: 0,
};

// ── Wells ──
const wells = [];
const NUM_WELLS = 6;

// ── Drawing canvas buffers ──
let drawCanvas, drawCtx;
let canvasLatent, canvasAlpha, canvasWetness;
let canvasW, canvasH;

// ════════════════════════════════════════════
//  COLOR PALETTE
// ════════════════════════════════════════════

function createColorSquares() {
  const container = document.getElementById('color-squares');
  PALETTE_COLORS.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'color-swatch';
    el.style.background = `rgb(${c.rgb.join(',')})`;
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      selectColor(c.rgb, i);
    });
    container.appendChild(el);
  });
}

function selectColor(rgb, idx) {
  state.brushColor = [...rgb];
  state.brushLatent = mixbox.rgbToLatent(rgb);
  const prev = document.getElementById('brush-preview');
  prev.style.background = `rgb(${rgb.join(',')})`;
  document.getElementById('brush-label').textContent =
    idx !== undefined ? PALETTE_COLORS[idx].name : `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
  document.querySelectorAll('.color-swatch').forEach((el, i) =>
    el.classList.toggle('selected', i === idx));
}

function updateBrushFromRgb(rgb) {
  state.brushColor = [...rgb];
  state.brushLatent = mixbox.rgbToLatent(rgb);
  document.getElementById('brush-preview').style.background = `rgb(${rgb.join(',')})`;
  document.getElementById('brush-label').textContent = 'Mixed';
  document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('selected'));
}

// ════════════════════════════════════════════
//  MIXING WELLS
// ════════════════════════════════════════════

function createWells() {
  const grid = document.getElementById('wells-grid');
  for (let i = 0; i < NUM_WELLS; i++) {
    const container = document.createElement('div');
    container.className = 'well-container';

    const canvas = document.createElement('canvas');
    canvas.className = 'well-canvas';
    container.appendChild(canvas);

    const clearBtn = document.createElement('button');
    clearBtn.className = 'well-clear';
    clearBtn.textContent = '\u00d7';
    clearBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      clearWell(i);
    });
    container.appendChild(clearBtn);
    grid.appendChild(container);

    const well = { canvas, ctx: null, latentBuffer: null, alphaBuffer: null, w: 0, h: 0 };
    wells.push(well);
    setupPointer(canvas, 'well', i);
  }
  requestAnimationFrame(() => wells.forEach(w => initWell(w)));
  new ResizeObserver(() => wells.forEach(w => initWell(w))).observe(grid);
}

function initWell(well) {
  const rect = well.canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const w = Math.floor(rect.width * DPR);
  const h = Math.floor(rect.height * DPR);
  if (well.w === w && well.h === h) return;
  well.canvas.width = w;
  well.canvas.height = h;
  well.w = w; well.h = h;
  well.ctx = well.canvas.getContext('2d', { willReadFrequently: true });
  well.ctx.scale(DPR, DPR);
  well.latentBuffer = new Float64Array(w * h * LATENT_SIZE);
  well.alphaBuffer = new Float32Array(w * h);
  well.ctx.clearRect(0, 0, rect.width, rect.height);
}

function clearWell(i) {
  const w = wells[i];
  if (!w.ctx) return;
  const rect = w.canvas.getBoundingClientRect();
  w.ctx.clearRect(0, 0, rect.width, rect.height);
  w.latentBuffer.fill(0);
  w.alphaBuffer.fill(0);
}

// ════════════════════════════════════════════
//  DRAWING CANVAS
// ════════════════════════════════════════════

function setupDrawingCanvas() {
  drawCanvas = document.getElementById('drawing-canvas');
  setupPointer(drawCanvas, 'canvas', 0);

  function initDraw() {
    const rect = drawCanvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    canvasW = Math.floor(rect.width * DPR);
    canvasH = Math.floor(rect.height * DPR);
    drawCanvas.width = canvasW;
    drawCanvas.height = canvasH;
    drawCtx = drawCanvas.getContext('2d', { willReadFrequently: true });
    drawCtx.scale(DPR, DPR);
    drawCtx.fillStyle = '#fff';
    drawCtx.fillRect(0, 0, rect.width, rect.height);
    canvasLatent = new Float64Array(canvasW * canvasH * LATENT_SIZE);
    canvasAlpha = new Float32Array(canvasW * canvasH);
    canvasWetness = new Float32Array(canvasW * canvasH);
    const wl = mixbox.rgbToLatent([255, 255, 255]);
    for (let i = 0; i < canvasW * canvasH; i++) {
      for (let j = 0; j < LATENT_SIZE; j++)
        canvasLatent[i * LATENT_SIZE + j] = wl[j];
      canvasAlpha[i] = 1;
    }
  }
  requestAnimationFrame(initDraw);
  new ResizeObserver(initDraw).observe(drawCanvas.parentElement);
}

// ════════════════════════════════════════════
//  POINTER / STROKE HANDLING
// ════════════════════════════════════════════

function setupPointer(canvas, type, index) {
  // Block Safari gestures
  for (const evt of ['touchstart', 'touchmove', 'touchend']) {
    canvas.addEventListener(evt, e => e.preventDefault(), { passive: false });
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (!state.brushColor) return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    state.isDrawing = true;
    state.activeTarget = { type, index };
    const pos = getPos(e, canvas);
    state.lastPoint = pos;
    dab(type, index, pos);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!state.isDrawing || !state.activeTarget) return;
    if (state.activeTarget.type !== type || state.activeTarget.index !== index) return;
    e.preventDefault();
    const pos = getPos(e, canvas);
    strokeTo(type, index, state.lastPoint, pos);
    state.lastPoint = pos;
  });

  const end = () => {
    if (state.activeTarget && state.activeTarget.type === type && state.activeTarget.index === index) {
      state.isDrawing = false;
      state.activeTarget = null;
      state.lastPoint = null;
    }
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
}

function getPos(e, canvas) {
  const rect = canvas.getBoundingClientRect();
  // pressure: Apple Pencil provides 0-1, finger defaults to 0.5
  let pressure = 0.5;
  if (e.pressure > 0 && e.pressure < 1) pressure = e.pressure;
  return { x: e.clientX - rect.left, y: e.clientY - rect.top, pressure };
}

function strokeTo(type, index, p1, p2) {
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const step = Math.max(1, state.brushBaseSize * 0.25);
  const steps = Math.ceil(dist / step);
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    dab(type, index, {
      x: p1.x + dx * t,
      y: p1.y + dy * t,
      pressure: p1.pressure + (p2.pressure - p1.pressure) * t
    });
  }
}

function dab(type, index, pos) {
  const p = pos.pressure;
  const sizeMul = 0.4 + p * 1.1;
  const radius = state.brushBaseSize * sizeMul * 0.5;
  const opacity = 0.3 + p * 0.7;
  if (type === 'well') dabOnWell(index, pos.x, pos.y, radius, opacity);
  else dabOnCanvas(pos.x, pos.y, radius, opacity);
}

// ════════════════════════════════════════════
//  DAB ON WELL  — latent mixing + live pickup
// ════════════════════════════════════════════

function dabOnWell(wi, cx, cy, radius, opacity) {
  const well = wells[wi];
  if (!well.ctx || !well.latentBuffer) return;
  const bl = state.brushLatent;
  const r = radius;
  const x0 = Math.max(0, Math.floor((cx - r) * DPR));
  const y0 = Math.max(0, Math.floor((cy - r) * DPR));
  const x1 = Math.min(well.w - 1, Math.ceil((cx + r) * DPR));
  const y1 = Math.min(well.h - 1, Math.ceil((cy + r) * DPR));
  const imgW = x1 - x0 + 1, imgH = y1 - y0 + 1;
  if (imgW <= 0 || imgH <= 0) return;

  const imgData = well.ctx.getImageData(x0, y0, imgW, imgH);
  const px = imgData.data;
  let pR = 0, pG = 0, pB = 0, pN = 0;

  for (let py = y0; py <= y1; py++) {
    for (let ppx = x0; ppx <= x1; ppx++) {
      const dx = ppx / DPR - cx, dy = py / DPR - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > r) continue;
      const nd = dist / r;
      const ef = 0.5 + 0.5 * nd * nd;
      const da = opacity * ef * (1 - nd * nd * 0.3);

      const idx = py * well.w + ppx;
      const ea = well.alphaBuffer[idx];
      const li = idx * LATENT_SIZE;

      if (ea > 0.01) {
        const k1 = 1 - da;
        for (let k = 0; k < LATENT_SIZE; k++)
          well.latentBuffer[li + k] = well.latentBuffer[li + k] * k1 + bl[k] * da;
      } else {
        for (let k = 0; k < LATENT_SIZE; k++)
          well.latentBuffer[li + k] = bl[k];
      }
      well.alphaBuffer[idx] = Math.min(1, ea + da * (1 - ea));

      const sl = [];
      for (let k = 0; k < LATENT_SIZE; k++) sl.push(well.latentBuffer[li + k]);
      const rgb = mixbox.latentToRgb(sl);

      const pi = ((py - y0) * imgW + (ppx - x0)) * 4;
      px[pi] = Math.round(rgb[0]);
      px[pi + 1] = Math.round(rgb[1]);
      px[pi + 2] = Math.round(rgb[2]);
      px[pi + 3] = Math.round(well.alphaBuffer[idx] * 255);

      if (nd < 0.3) { pR += rgb[0]; pG += rgb[1]; pB += rgb[2]; pN++; }
    }
  }
  well.ctx.putImageData(imgData, x0, y0);
  if (pN > 0) updateBrushFromRgb([Math.round(pR/pN), Math.round(pG/pN), Math.round(pB/pN)]);
}

// ════════════════════════════════════════════
//  DAB ON CANVAS  — wet-on-wet blending
// ════════════════════════════════════════════

function dabOnCanvas(cx, cy, radius, opacity) {
  if (!drawCtx || !canvasLatent) return;
  const bl = state.brushLatent;
  const r = radius;
  const x0 = Math.max(0, Math.floor((cx - r) * DPR));
  const y0 = Math.max(0, Math.floor((cy - r) * DPR));
  const x1 = Math.min(canvasW - 1, Math.ceil((cx + r) * DPR));
  const y1 = Math.min(canvasH - 1, Math.ceil((cy + r) * DPR));
  const imgW = x1 - x0 + 1, imgH = y1 - y0 + 1;
  if (imgW <= 0 || imgH <= 0) return;

  const imgData = drawCtx.getImageData(x0, y0, imgW, imgH);
  const px = imgData.data;

  for (let py = y0; py <= y1; py++) {
    for (let ppx = x0; ppx <= x1; ppx++) {
      const dx = ppx / DPR - cx, dy = py / DPR - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > r) continue;
      const nd = dist / r;
      const ef = 0.5 + 0.5 * nd * nd;
      const da = opacity * ef * (1 - nd * nd * 0.3);

      const idx = py * canvasW + ppx;
      const wet = canvasWetness[idx];
      const li = idx * LATENT_SIZE;

      // Blend amount depends on wetness
      const ba = wet > 0.1 ? da * (0.4 + 0.6 * wet) : da;
      const k1 = 1 - ba;
      for (let k = 0; k < LATENT_SIZE; k++)
        canvasLatent[li + k] = canvasLatent[li + k] * k1 + bl[k] * ba;

      canvasAlpha[idx] = Math.min(1, canvasAlpha[idx] + da * (1 - canvasAlpha[idx]));
      canvasWetness[idx] = Math.min(1, wet + da * 0.8);

      const sl = [];
      for (let k = 0; k < LATENT_SIZE; k++) sl.push(canvasLatent[li + k]);
      const rgb = mixbox.latentToRgb(sl);

      const pi = ((py - y0) * imgW + (ppx - x0)) * 4;
      px[pi] = Math.round(rgb[0]);
      px[pi + 1] = Math.round(rgb[1]);
      px[pi + 2] = Math.round(rgb[2]);
      px[pi + 3] = 255;
    }
  }
  drawCtx.putImageData(imgData, x0, y0);
}

// ════════════════════════════════════════════
//  WETNESS DECAY & BLEEDING
// ════════════════════════════════════════════

function startWetnessLoop() {
  let lastT = 0;
  function tick(now) {
    requestAnimationFrame(tick);
    if (!canvasWetness || !canvasLatent || !drawCtx) return;
    const dt = lastT ? (now - lastT) / 1000 : 0.016;
    lastT = now;

    let hasWet = false;
    for (let i = 0; i < canvasWetness.length; i++) {
      if (canvasWetness[i] > 0.01) {
        hasWet = true;
        canvasWetness[i] = Math.max(0, canvasWetness[i] - 0.15 * dt);
      }
    }

    // Subtle bleeding while not drawing
    if (hasWet && !state.isDrawing) {
      const w = canvasW, h = canvasH, step = 3;
      let redraw = false;
      const imgData = drawCtx.getImageData(0, 0, w, h);
      const px = imgData.data;

      for (let y = step; y < h - step; y += step) {
        for (let x = step; x < w - step; x += step) {
          const idx = y * w + x;
          if (canvasWetness[idx] < 0.15) continue;
          redraw = true;
          const li = idx * LATENT_SIZE;
          const nb = [idx - 1, idx + 1, idx - w, idx + w];
          for (const ni of nb) {
            if (ni < 0 || ni >= canvasWetness.length) continue;
            const nli = ni * LATENT_SIZE;
            const b = 0.008 * canvasWetness[idx];
            for (let k = 0; k < LATENT_SIZE; k++)
              canvasLatent[nli + k] += (canvasLatent[li + k] - canvasLatent[nli + k]) * b;
            canvasWetness[ni] = Math.max(canvasWetness[ni], canvasWetness[idx] * 0.3);
            const sl = [];
            for (let k = 0; k < LATENT_SIZE; k++) sl.push(canvasLatent[nli + k]);
            const rgb = mixbox.latentToRgb(sl);
            const pi = ni * 4;
            px[pi] = Math.round(rgb[0]);
            px[pi + 1] = Math.round(rgb[1]);
            px[pi + 2] = Math.round(rgb[2]);
          }
        }
      }
      if (redraw) drawCtx.putImageData(imgData, 0, 0);
    }
  }
  requestAnimationFrame(tick);
}

// ════════════════════════════════════════════
//  WATER JAR
// ════════════════════════════════════════════

function setupWaterJar() {
  const jar = document.getElementById('water-jar');
  let downT = 0;
  jar.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  jar.addEventListener('pointerdown', (e) => { e.preventDefault(); downT = Date.now(); });
  jar.addEventListener('pointerup', () => {
    if (!state.brushColor) return;
    (Date.now() - downT >= 500) ? cleanBrush() : diluteBrush();
  });
}

function diluteBrush() {
  if (!state.brushLatent) return;
  for (let k = 0; k < LATENT_SIZE; k++)
    state.brushLatent[k] = state.brushLatent[k] * 0.7 + WHITE_LATENT[k] * 0.3;
  const rgb = mixbox.latentToRgb(Array.from(state.brushLatent));
  state.brushColor = [Math.round(rgb[0]), Math.round(rgb[1]), Math.round(rgb[2])];
  document.getElementById('brush-preview').style.background = `rgb(${state.brushColor.join(',')})`;
  document.getElementById('brush-label').textContent = 'Diluted';
}

function cleanBrush() {
  if (state.brushColor) {
    const jt = state.waterJarTint, bc = state.brushColor;
    const b = 0.15 + state.waterJarDirty * 0.05;
    state.waterJarTint = [
      Math.round(jt[0]*(1-b) + bc[0]*b),
      Math.round(jt[1]*(1-b) + bc[1]*b),
      Math.round(jt[2]*(1-b) + bc[2]*b),
    ];
    state.waterJarDirty = Math.min(1, state.waterJarDirty + 0.12);
    const fill = document.getElementById('water-jar-fill');
    const t = state.waterJarTint;
    fill.style.background = `rgba(${t[0]},${t[1]},${t[2]},${0.3 + state.waterJarDirty * 0.4})`;
  }
  state.brushColor = [200, 200, 200];
  state.brushLatent = mixbox.rgbToLatent([200, 200, 200]);
  document.getElementById('brush-preview').style.background = '#ccc';
  document.getElementById('brush-label').textContent = 'Clean \u2014 pick a color';
}

// ════════════════════════════════════════════
//  CONTROLS
// ════════════════════════════════════════════

function setupControls() {
  document.getElementById('brush-size').addEventListener('input', (e) => {
    state.brushBaseSize = parseInt(e.target.value);
  });
  document.getElementById('clean-palette').addEventListener('click', () => {
    for (let i = 0; i < NUM_WELLS; i++) clearWell(i);
  });
  document.getElementById('clear-canvas-btn').addEventListener('click', () => {
    if (!drawCtx) return;
    const rect = drawCanvas.getBoundingClientRect();
    drawCtx.fillStyle = '#fff';
    drawCtx.fillRect(0, 0, rect.width, rect.height);
    const wl = mixbox.rgbToLatent([255, 255, 255]);
    for (let i = 0; i < canvasW * canvasH; i++) {
      for (let j = 0; j < LATENT_SIZE; j++)
        canvasLatent[i * LATENT_SIZE + j] = wl[j];
      canvasAlpha[i] = 1;
      canvasWetness[i] = 0;
    }
  });
}

// ════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════

function init() {
  createColorSquares();
  createWells();
  setupDrawingCanvas();
  setupWaterJar();
  setupControls();
  startWetnessLoop();
  selectColor(PALETTE_COLORS[0].rgb, 0);
}

if (document.readyState === 'loading')
  document.addEventListener('DOMContentLoaded', init);
else
  init();

})();
</script>
