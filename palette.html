<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Artist Palette</title>
<script src="https://scrtwpns.com/mixbox.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; width: 100%;
  overflow: hidden;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  background: #3a3a3a;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

#app {
  display: grid;
  grid-template-columns: 270px 1fr;
  height: 100dvh;
  gap: 0;
}

/* ---- PALETTE PANEL ---- */
#palette-panel {
  background: #4a4440;
  display: flex;
  flex-direction: column;
  padding: 10px;
  gap: 8px;
  overflow: hidden;
}

/* Color squares */
#color-squares {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
  flex-shrink: 0;
}
.color-swatch {
  aspect-ratio: 1;
  border-radius: 5px;
  border: 3px solid transparent;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
  position: relative;
}
.color-swatch.selected {
  border-color: #fff;
  box-shadow: 0 0 0 2px #333, 0 0 8px rgba(255,255,255,0.4);
}
.color-swatch:active { transform: scale(0.93); }
.color-swatch .label {
  position: absolute; bottom: -1px; left: 0; right: 0;
  font-size: 7px; text-align: center; color: rgba(255,255,255,0.7);
  text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  line-height: 1.2; padding: 1px;
}

/* Brush preview */
#brush-preview-row {
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0; padding: 4px 0;
}
#brush-preview {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 2px solid #888;
  background: #222;
  flex-shrink: 0;
}
#brush-label {
  color: #ccc; font-size: 11px;
}

/* Mixing wells */
#wells-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  flex: 1;
  min-height: 0;
}
.well-wrapper {
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  background: #c8b99a;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.4), inset 0 -1px 3px rgba(255,255,255,0.15);
}
.well-canvas {
  width: 100%; height: 100%;
  display: block;
  touch-action: none;
  border-radius: 8px;
}
.well-clear {
  position: absolute; top: 2px; right: 4px;
  background: none; border: none;
  color: rgba(255,255,255,0.5); font-size: 14px;
  cursor: pointer; z-index: 2;
  line-height: 1; padding: 2px;
}
.well-clear:active { color: #fff; }

/* Water jar */
#water-jar {
  flex-shrink: 0;
  height: 52px;
  border-radius: 6px;
  border: 2px solid #888;
  background: linear-gradient(180deg, transparent 15%, rgba(180,210,240,0.5) 40%, rgba(140,180,220,0.7) 100%);
  position: relative;
  cursor: pointer;
  overflow: hidden;
  transition: background 0.3s;
}
#water-jar-tint {
  position: absolute; inset: 0;
  border-radius: 4px;
  pointer-events: none;
  transition: background 0.5s;
}
#water-jar-label {
  position: absolute; bottom: 4px; left: 0; right: 0;
  text-align: center; font-size: 10px; color: rgba(0,0,0,0.5);
}
#water-jar-ring {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 50%; height: 6px;
  border-radius: 0 0 6px 6px;
  background: rgba(255,255,255,0.3);
}

/* Controls row */
#controls-row {
  display: flex; gap: 6px; align-items: center; flex-shrink: 0;
}
#controls-row button {
  flex: 1; padding: 8px 4px;
  border: none; border-radius: 5px;
  background: #665e56; color: #ddd;
  font-size: 11px; cursor: pointer;
  min-height: 36px;
}
#controls-row button:active { background: #554e47; }

/* Brush size slider */
#size-row {
  display: flex; align-items: center; gap: 6px; flex-shrink: 0;
}
#size-row label { color: #aaa; font-size: 10px; white-space: nowrap; }
#brush-size {
  flex: 1; height: 20px;
  -webkit-appearance: none; appearance: none;
  background: #5a5350; border-radius: 10px; outline: none;
}
#brush-size::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px; border-radius: 50%;
  background: #ddd; cursor: pointer;
}

/* ---- CANVAS PANEL ---- */
#canvas-panel {
  display: flex; flex-direction: column;
  background: #555;
  position: relative;
}
#canvas-toolbar {
  display: flex; align-items: center; justify-content: flex-end;
  padding: 6px 10px; gap: 8px;
  background: #444; flex-shrink: 0;
}
#canvas-toolbar button {
  padding: 6px 14px;
  border: none; border-radius: 5px;
  background: #665e56; color: #ddd;
  font-size: 12px; cursor: pointer;
  min-height: 32px;
}
#canvas-toolbar button:active { background: #554e47; }
#drawing-canvas {
  flex: 1;
  display: block;
  background: #fff;
  touch-action: none;
  cursor: crosshair;
}

/* ---- PORTRAIT MODE ---- */
@media (max-aspect-ratio: 4/5) {
  #app {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
  }
  #palette-panel {
    flex-direction: row;
    flex-wrap: wrap;
    padding: 6px;
    gap: 6px;
    max-height: 180px;
    overflow-y: auto;
  }
  #color-squares {
    grid-template-columns: repeat(6, 1fr);
    width: 100%;
  }
  #wells-container {
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 1fr;
    width: 100%;
    min-height: 80px;
  }
  #brush-preview-row, #water-jar, #controls-row, #size-row {
    display: none; /* simplified in portrait for now */
  }
}
</style>
</head>
<body>
<div id="app">
  <!-- PALETTE PANEL -->
  <div id="palette-panel">
    <div id="color-squares"></div>

    <div id="brush-preview-row">
      <div id="brush-preview"></div>
      <span id="brush-label">No color selected</span>
    </div>

    <div id="wells-container"></div>

    <div id="water-jar">
      <div id="water-jar-tint"></div>
      <div id="water-jar-ring"></div>
      <div id="water-jar-label">Tap: dilute &middot; Hold: clean</div>
    </div>

    <div id="size-row">
      <label>Size</label>
      <input type="range" id="brush-size" min="2" max="60" value="14">
    </div>

    <div id="controls-row">
      <button id="clean-palette">Clean Palette</button>
    </div>
  </div>

  <!-- CANVAS PANEL -->
  <div id="canvas-panel">
    <div id="canvas-toolbar">
      <button id="undo-btn">Undo</button>
      <button id="clear-canvas">Clear Canvas</button>
    </div>
    <canvas id="drawing-canvas"></canvas>
  </div>
</div>

<script>
// ============================================================
//  ARTIST PALETTE APP
// ============================================================

// --- Artist Colors ---
const COLORS = [
  { name: 'Cad Yellow',   rgb: [255, 227, 2]   },
  { name: 'Yellow Ochre',  rgb: [204, 164, 61]  },
  { name: 'Cad Red',       rgb: [227, 38, 30]   },
  { name: 'Alizarin',      rgb: [179, 27, 55]   },
  { name: 'Ultramarine',   rgb: [25, 42, 145]   },
  { name: 'Cerulean',      rgb: [0, 117, 178]   },
  { name: 'Phthalo Green', rgb: [0, 100, 80]    },
  { name: 'Sap Green',     rgb: [80, 125, 42]   },
  { name: 'Burnt Sienna',  rgb: [150, 78, 38]   },
  { name: 'Burnt Umber',   rgb: [83, 55, 33]    },
  { name: 'Titanium White',rgb: [248, 248, 245] },
  { name: 'Ivory Black',   rgb: [35, 31, 28]    },
];

const LATENT_SIZE = typeof mixbox !== 'undefined' ? (mixbox.LATENT_SIZE || 7) : 7;
const NUM_WELLS = 6;
const DPR = window.devicePixelRatio || 1;

// --- State ---
const state = {
  brushColor: null,       // [r,g,b] or null (no color)
  brushLatent: null,       // Float64Array
  brushBaseSize: 14,
  brushOpacity: 1.0,
  isDrawing: false,
  activeTarget: null,      // 'well-0'..'well-5' | 'canvas'
  lastPoint: null,         // {x, y, pressure}
  waterJarTint: [180, 210, 240],
  waterJarDirty: 0,        // 0-1 how dirty the water is
  jarDownTime: 0,
};

// --- Wells data ---
const wells = [];

// --- Canvas data ---
let drawCanvas, drawCtx;
let canvasUndoStack = [];
const MAX_UNDO = 15;

// ============================================================
//  INITIALIZATION
// ============================================================

function init() {
  createColorSwatches();
  createWells();
  setupDrawingCanvas();
  setupWaterJar();
  setupControls();
  setupGlobalTouchPrevention();

  // Select first color by default
  selectColor(0);

  // Handle resize
  window.addEventListener('resize', debounce(() => {
    resizeAllCanvases();
  }, 200));
}

// ============================================================
//  COLOR SWATCHES
// ============================================================

function createColorSwatches() {
  const container = document.getElementById('color-squares');
  COLORS.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'color-swatch';
    div.style.backgroundColor = `rgb(${c.rgb.join(',')})`;
    div.dataset.index = i;

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = c.name;
    div.appendChild(label);

    div.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      selectColor(i);
    });
    container.appendChild(div);
  });
}

function selectColor(index) {
  const c = COLORS[index];
  state.brushColor = [...c.rgb];
  state.brushLatent = mixbox.rgbToLatent(state.brushColor);
  state.brushOpacity = 1.0;
  updateBrushPreview();

  // Update selection UI
  document.querySelectorAll('.color-swatch').forEach((el, i) => {
    el.classList.toggle('selected', i === index);
  });
}

function updateBrushPreview() {
  const preview = document.getElementById('brush-preview');
  const label = document.getElementById('brush-label');
  if (state.brushColor) {
    const [r, g, b] = state.brushColor;
    preview.style.background = `rgb(${r},${g},${b})`;
    label.textContent = `rgb(${r}, ${g}, ${b})`;
  } else {
    preview.style.background = '#222';
    label.textContent = 'No color (clean brush)';
  }
}

// ============================================================
//  MIXING WELLS
// ============================================================

function createWells() {
  const container = document.getElementById('wells-container');
  for (let i = 0; i < NUM_WELLS; i++) {
    const wrapper = document.createElement('div');
    wrapper.className = 'well-wrapper';

    const canvas = document.createElement('canvas');
    canvas.className = 'well-canvas';
    canvas.dataset.wellIndex = i;

    const clearBtn = document.createElement('button');
    clearBtn.className = 'well-clear';
    clearBtn.textContent = '\u00d7';
    clearBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      clearWell(i);
    });

    wrapper.appendChild(canvas);
    wrapper.appendChild(clearBtn);
    container.appendChild(wrapper);

    const ctx = canvas.getContext('2d');
    const well = { canvas, ctx, wrapper, latentBuffer: null, alphaBuffer: null, w: 0, h: 0 };
    wells.push(well);

    // Events
    setupWellEvents(canvas, i);
  }

  // Defer sizing to after layout
  requestAnimationFrame(() => { resizeWells(); });
}

function resizeWells() {
  wells.forEach((well) => {
    const rect = well.canvas.getBoundingClientRect();
    const w = Math.floor(rect.width * DPR);
    const h = Math.floor(rect.height * DPR);
    if (w === well.w && h === well.h) return;

    well.canvas.width = w;
    well.canvas.height = h;
    well.w = w;
    well.h = h;

    // Initialize latent buffer (palette background color in latent space)
    well.latentBuffer = new Float64Array(w * h * LATENT_SIZE);
    well.alphaBuffer = new Float32Array(w * h); // all 0 = no paint

    // Draw palette background
    well.ctx.fillStyle = '#c8b99a';
    well.ctx.fillRect(0, 0, w, h);
  });
}

function clearWell(index) {
  const well = wells[index];
  well.alphaBuffer.fill(0);
  well.latentBuffer.fill(0);
  well.ctx.fillStyle = '#c8b99a';
  well.ctx.fillRect(0, 0, well.w, well.h);
}

function setupWellEvents(canvas, wellIndex) {
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (!state.brushColor) return;
    state.isDrawing = true;
    state.activeTarget = `well-${wellIndex}`;
    const pos = getCanvasPos(e, canvas, wells[wellIndex]);
    state.lastPoint = { x: pos.x, y: pos.y, pressure: getPressure(e) };
    paintInWell(wellIndex, pos.x, pos.y, getPressure(e));
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!state.isDrawing || state.activeTarget !== `well-${wellIndex}`) return;
    e.preventDefault();
    const pos = getCanvasPos(e, canvas, wells[wellIndex]);
    const pressure = getPressure(e);
    // Interpolate stroke
    if (state.lastPoint) {
      interpolateAndPaint((x, y, p) => paintInWell(wellIndex, x, y, p),
        state.lastPoint, { x: pos.x, y: pos.y, pressure });
    }
    state.lastPoint = { x: pos.x, y: pos.y, pressure };
  });

  const endHandler = (e) => {
    if (state.activeTarget === `well-${wellIndex}`) {
      state.isDrawing = false;
      state.activeTarget = null;
      state.lastPoint = null;
    }
  };
  canvas.addEventListener('pointerup', endHandler);
  canvas.addEventListener('pointercancel', endHandler);
  canvas.addEventListener('pointerleave', endHandler);

  // Prevent Safari gestures
  ['touchstart', 'touchmove', 'touchend'].forEach(evt => {
    canvas.addEventListener(evt, (e) => e.preventDefault(), { passive: false });
  });
}

function paintInWell(wellIndex, x, y, pressure) {
  const well = wells[wellIndex];
  if (!state.brushColor || !state.brushLatent) return;

  const size = state.brushBaseSize * DPR * (0.4 + pressure * 0.8);
  const opacity = 0.3 + pressure * 0.7;
  const brushLatent = state.brushLatent;

  const cx = Math.round(x);
  const cy = Math.round(y);
  const r = Math.ceil(size / 2);

  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > r) continue;

      const px = cx + dx;
      const py = cy + dy;
      if (px < 0 || px >= well.w || py < 0 || py >= well.h) continue;

      const idx = py * well.w + px;

      // Soft brush falloff
      const falloff = 1.0 - (dist / r);
      const strength = opacity * falloff * falloff * 0.6;

      const existingAlpha = well.alphaBuffer[idx];
      const latentIdx = idx * LATENT_SIZE;

      if (existingAlpha < 0.01) {
        // No existing paint — stamp brush color
        for (let k = 0; k < LATENT_SIZE; k++) {
          well.latentBuffer[latentIdx + k] = brushLatent[k];
        }
        well.alphaBuffer[idx] = Math.min(1, strength);
      } else {
        // Blend in latent space
        const t = strength / (existingAlpha + strength);
        for (let k = 0; k < LATENT_SIZE; k++) {
          well.latentBuffer[latentIdx + k] =
            well.latentBuffer[latentIdx + k] * (1 - t) + brushLatent[k] * t;
        }
        well.alphaBuffer[idx] = Math.min(1, existingAlpha + strength * 0.3);
      }
    }
  }

  // Render the painted area
  renderWellRegion(well, cx - r - 1, cy - r - 1, r * 2 + 3, r * 2 + 3);

  // Live color pickup: update brush to the color under the center point
  pickupColorFromWell(well, cx, cy);
}

function renderWellRegion(well, startX, startY, w, h) {
  startX = Math.max(0, startX);
  startY = Math.max(0, startY);
  const endX = Math.min(well.w, startX + w);
  const endY = Math.min(well.h, startY + h);
  const regionW = endX - startX;
  const regionH = endY - startY;
  if (regionW <= 0 || regionH <= 0) return;

  const imageData = well.ctx.getImageData(startX, startY, regionW, regionH);
  const data = imageData.data;

  // Palette background color
  const bgR = 200, bgG = 185, bgB = 154;

  for (let ly = 0; ly < regionH; ly++) {
    for (let lx = 0; lx < regionW; lx++) {
      const px = startX + lx;
      const py = startY + ly;
      const idx = py * well.w + px;
      const alpha = well.alphaBuffer[idx];
      const pixIdx = (ly * regionW + lx) * 4;

      if (alpha < 0.01) {
        data[pixIdx] = bgR;
        data[pixIdx + 1] = bgG;
        data[pixIdx + 2] = bgB;
        data[pixIdx + 3] = 255;
      } else {
        const latentArr = [];
        const latentIdx = idx * LATENT_SIZE;
        for (let k = 0; k < LATENT_SIZE; k++) {
          latentArr.push(well.latentBuffer[latentIdx + k]);
        }
        const rgb = mixbox.latentToRgb(latentArr);
        const a = Math.min(1, alpha);
        // Composite over background
        data[pixIdx]     = Math.round(bgR * (1 - a) + rgb[0] * a);
        data[pixIdx + 1] = Math.round(bgG * (1 - a) + rgb[1] * a);
        data[pixIdx + 2] = Math.round(bgB * (1 - a) + rgb[2] * a);
        data[pixIdx + 3] = 255;
      }
    }
  }
  well.ctx.putImageData(imageData, startX, startY);
}

function pickupColorFromWell(well, cx, cy) {
  // Sample a small area around the center
  const sampleR = 2;
  let totalWeight = 0;
  const accLatent = new Float64Array(LATENT_SIZE);

  for (let dy = -sampleR; dy <= sampleR; dy++) {
    for (let dx = -sampleR; dx <= sampleR; dx++) {
      const px = cx + dx;
      const py = cy + dy;
      if (px < 0 || px >= well.w || py < 0 || py >= well.h) continue;
      const idx = py * well.w + px;
      const a = well.alphaBuffer[idx];
      if (a < 0.01) continue;
      const w = a;
      const latentIdx = idx * LATENT_SIZE;
      for (let k = 0; k < LATENT_SIZE; k++) {
        accLatent[k] += well.latentBuffer[latentIdx + k] * w;
      }
      totalWeight += w;
    }
  }

  if (totalWeight > 0.01) {
    for (let k = 0; k < LATENT_SIZE; k++) {
      accLatent[k] /= totalWeight;
    }
    const rgb = mixbox.latentToRgb(Array.from(accLatent));
    state.brushColor = [Math.round(rgb[0]), Math.round(rgb[1]), Math.round(rgb[2])];
    state.brushLatent = mixbox.rgbToLatent(state.brushColor);
    updateBrushPreview();

    // Deselect palette swatches
    document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('selected'));
  }
}

// ============================================================
//  DRAWING CANVAS
// ============================================================

function setupDrawingCanvas() {
  drawCanvas = document.getElementById('drawing-canvas');
  drawCtx = drawCanvas.getContext('2d');

  requestAnimationFrame(() => { resizeDrawingCanvas(); });

  // Pointer events
  drawCanvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (!state.brushColor) return;
    state.isDrawing = true;
    state.activeTarget = 'canvas';
    const pos = getCanvasPosSimple(e, drawCanvas);
    state.lastPoint = { x: pos.x, y: pos.y, pressure: getPressure(e) };

    // Save undo state
    saveUndoState();

    paintOnCanvas(pos.x, pos.y, getPressure(e));
  });

  drawCanvas.addEventListener('pointermove', (e) => {
    if (!state.isDrawing || state.activeTarget !== 'canvas') return;
    e.preventDefault();
    const pos = getCanvasPosSimple(e, drawCanvas);
    const pressure = getPressure(e);
    if (state.lastPoint) {
      interpolateAndPaint((x, y, p) => paintOnCanvas(x, y, p),
        state.lastPoint, { x: pos.x, y: pos.y, pressure });
    }
    state.lastPoint = { x: pos.x, y: pos.y, pressure };
  });

  const endCanvas = () => {
    if (state.activeTarget === 'canvas') {
      state.isDrawing = false;
      state.activeTarget = null;
      state.lastPoint = null;
    }
  };
  drawCanvas.addEventListener('pointerup', endCanvas);
  drawCanvas.addEventListener('pointercancel', endCanvas);
  drawCanvas.addEventListener('pointerleave', endCanvas);

  // Prevent Safari gestures
  ['touchstart', 'touchmove', 'touchend'].forEach(evt => {
    drawCanvas.addEventListener(evt, (e) => e.preventDefault(), { passive: false });
  });
}

function resizeDrawingCanvas() {
  const rect = drawCanvas.getBoundingClientRect();
  const w = Math.floor(rect.width * DPR);
  const h = Math.floor(rect.height * DPR);
  if (drawCanvas.width === w && drawCanvas.height === h) return;

  // Save current image if resizing
  let oldImage = null;
  if (drawCanvas.width > 0 && drawCanvas.height > 0) {
    oldImage = drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
  }

  drawCanvas.width = w;
  drawCanvas.height = h;

  // White background
  drawCtx.fillStyle = '#fff';
  drawCtx.fillRect(0, 0, w, h);

  // Restore old content
  if (oldImage) {
    drawCtx.putImageData(oldImage, 0, 0);
  }
}

function paintOnCanvas(x, y, pressure) {
  if (!state.brushColor) return;
  const [r, g, b] = state.brushColor;
  const size = state.brushBaseSize * DPR * (0.4 + pressure * 0.8);
  const opacity = (0.3 + pressure * 0.7) * state.brushOpacity;
  const radius = size / 2;

  // Watercolor-style brush: radial gradient with edge darkening
  const gradient = drawCtx.createRadialGradient(x, y, 0, x, y, radius);

  // Center: semi-transparent (lighter wash)
  // Edge: more opaque (pigment accumulation)
  const centerAlpha = opacity * 0.4;
  const edgeAlpha = opacity * 0.9;

  gradient.addColorStop(0, `rgba(${r},${g},${b},${centerAlpha})`);
  gradient.addColorStop(0.5, `rgba(${r},${g},${b},${opacity * 0.6})`);
  gradient.addColorStop(0.8, `rgba(${r},${g},${b},${edgeAlpha})`);
  gradient.addColorStop(1, `rgba(${r},${g},${b},0)`);

  drawCtx.fillStyle = gradient;
  drawCtx.beginPath();
  drawCtx.arc(x, y, radius, 0, Math.PI * 2);
  drawCtx.fill();
}

function clearCanvas() {
  saveUndoState();
  drawCtx.fillStyle = '#fff';
  drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
}

function saveUndoState() {
  if (canvasUndoStack.length >= MAX_UNDO) canvasUndoStack.shift();
  canvasUndoStack.push(drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
}

function undo() {
  if (canvasUndoStack.length === 0) return;
  const imgData = canvasUndoStack.pop();
  drawCtx.putImageData(imgData, 0, 0);
}

// ============================================================
//  WATER JAR
// ============================================================

function setupWaterJar() {
  const jar = document.getElementById('water-jar');

  jar.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    state.jarDownTime = Date.now();
  });

  jar.addEventListener('pointerup', (e) => {
    e.preventDefault();
    const held = Date.now() - state.jarDownTime;
    if (held >= 500) {
      cleanBrush();
    } else {
      diluteBrush();
    }
  });

  // Prevent gestures
  ['touchstart', 'touchmove', 'touchend'].forEach(evt => {
    jar.addEventListener(evt, (e) => e.preventDefault(), { passive: false });
  });
}

function diluteBrush() {
  if (!state.brushColor) return;
  // Tint the water
  tintWater(state.brushColor);

  // Lerp toward white by ~30%
  const white = [248, 248, 245];
  const t = 0.3;
  state.brushColor = state.brushColor.map((c, i) => Math.round(c + (white[i] - c) * t));
  state.brushLatent = mixbox.rgbToLatent(state.brushColor);
  state.brushOpacity = Math.max(0.2, state.brushOpacity * 0.7);
  updateBrushPreview();

  // Visual feedback — flash the jar
  const jar = document.getElementById('water-jar');
  jar.style.outline = '2px solid rgba(255,255,255,0.6)';
  setTimeout(() => { jar.style.outline = ''; }, 200);
}

function cleanBrush() {
  if (state.brushColor) {
    tintWater(state.brushColor);
  }
  state.brushColor = null;
  state.brushLatent = null;
  state.brushOpacity = 1.0;
  updateBrushPreview();

  // Deselect palette
  document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('selected'));

  // Visual feedback
  const jar = document.getElementById('water-jar');
  jar.style.outline = '3px solid rgba(255,255,255,0.8)';
  setTimeout(() => { jar.style.outline = ''; }, 400);
}

function tintWater(color) {
  state.waterJarDirty = Math.min(1, state.waterJarDirty + 0.08);
  const d = state.waterJarDirty;
  state.waterJarTint = state.waterJarTint.map((c, i) =>
    Math.round(c * (1 - 0.15) + color[i] * 0.15)
  );

  const tintEl = document.getElementById('water-jar-tint');
  const [r, g, b] = state.waterJarTint;
  tintEl.style.background = `rgba(${r},${g},${b},${d * 0.5})`;
}

// ============================================================
//  CONTROLS
// ============================================================

function setupControls() {
  document.getElementById('clean-palette').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    for (let i = 0; i < NUM_WELLS; i++) clearWell(i);
  });

  document.getElementById('clear-canvas').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    clearCanvas();
  });

  document.getElementById('undo-btn').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    undo();
  });

  const slider = document.getElementById('brush-size');
  slider.value = state.brushBaseSize;
  slider.addEventListener('input', (e) => {
    state.brushBaseSize = parseInt(e.target.value);
  });
}

// ============================================================
//  GLOBAL TOUCH PREVENTION
// ============================================================

function setupGlobalTouchPrevention() {
  // Prevent all default touch behaviors on the entire document
  document.addEventListener('touchstart', (e) => {
    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
      e.preventDefault();
    }
  }, { passive: false });

  document.addEventListener('touchmove', (e) => {
    e.preventDefault();
  }, { passive: false });

  // Prevent double-tap zoom
  document.addEventListener('dblclick', (e) => {
    e.preventDefault();
  });

  // Prevent context menu
  document.addEventListener('contextmenu', (e) => {
    e.preventDefault();
  });

  // Prevent gesturestart (Safari pinch)
  document.addEventListener('gesturestart', (e) => {
    e.preventDefault();
  });
  document.addEventListener('gesturechange', (e) => {
    e.preventDefault();
  });
}

// ============================================================
//  UTILITIES
// ============================================================

function getCanvasPos(e, canvasEl, wellData) {
  const rect = canvasEl.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (wellData.w / rect.width),
    y: (e.clientY - rect.top) * (wellData.h / rect.height),
  };
}

function getCanvasPosSimple(e, canvasEl) {
  const rect = canvasEl.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * DPR,
    y: (e.clientY - rect.top) * DPR,
  };
}

function getPressure(e) {
  // Try pointer event pressure first
  if (e.pressure && e.pressure > 0 && e.pressure < 1) {
    return e.pressure;
  }
  // Default
  return 0.5;
}

function interpolateAndPaint(paintFn, p1, p2) {
  const dx = p2.x - p1.x;
  const dy = p2.y - p1.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const step = Math.max(1, state.brushBaseSize * DPR * 0.2);
  const steps = Math.ceil(dist / step);

  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    const x = p1.x + dx * t;
    const y = p1.y + dy * t;
    const pressure = p1.pressure + (p2.pressure - p1.pressure) * t;
    paintFn(x, y, pressure);
  }
}

function resizeAllCanvases() {
  resizeWells();
  resizeDrawingCanvas();
}

function debounce(fn, ms) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), ms);
  };
}

// ============================================================
//  START
// ============================================================

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
