name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Prepare site
        run: |
          mkdir -p _site/network/vendor _site/components
          cp -r dist/.                _site/
          cp network/index.html       _site/network/index.html
          cp network/vendor/cytoscape.min.js _site/network/vendor/cytoscape.min.js
          cp components/index.html    _site/components/index.html
          cp components/graph-data.mjs _site/components/graph-data.mjs
          cp -r storybook-static      _site/storybook
          echo "Build OK - $(date)" > _site/build-info.txt

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
