name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site/palette _site/chinese
          cp index.html                _site/index.html
          cp palette/palette.html      _site/palette/index.html
          cp palette/palette.html      _site/palette/palette.html
          cp palette/mixbox.js         _site/palette/mixbox.js
          cp palette/reference.html    _site/palette/reference.html
          cp chinese/index.html        _site/chinese/index.html
          cp chinese/styles.css        _site/chinese/styles.css
          cp chinese/app.js            _site/chinese/app.js
          cp chinese/data.json         _site/chinese/data.json
          echo "Build OK - $(date)" > _site/build-info.txt

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
