name: Setup Supabase

# Pulls the Supabase Personal Access Token from the `github-pages`
# environment secret `supabaseapi` — no input prompt. Generate / rotate the
# PAT at https://supabase.com/dashboard/account/tokens, then update the
# secret value in: Settings → Environments → github-pages → Environment
# secrets → supabaseapi.
#
# Triggers:
#   - push to `claude/main` touching `supabase/migrations/**` — auto-applies
#     new/changed migrations. Skips the heavy seed step (the words table is
#     already populated; seeding is idempotent but expensive). configure_auth
#     also runs because it's fast and idempotent.
#   - workflow_dispatch (manual) — full control via the three checkboxes,
#     defaults to "all three on" so a fresh project bootstraps in one click.
#
# Because the job is gated by the `github-pages` environment, the workflow
# can only run from a branch the environment allows (typically the default
# branch).

on:
  push:
    branches: [claude/main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply all SQL migrations (idempotent)"
        type: boolean
        default: true
      run_seed:
        description: "Upsert all ~91k words (idempotent — safe to skip after first run)"
        type: boolean
        default: true
      configure_auth:
        description: "Configure auth redirect URLs for the deployed app"
        type: boolean
        default: true

env:
  PROJECT_REF: oigbbgtzzqiceetasayy
  MGMT_API: https://api.supabase.com/v1
  SITE_URL: https://decobots.github.io/Ai-/

jobs:
  setup:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Verify PAT works
        env:
          SUPABASE_PAT: ${{ secrets.supabaseapi }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/proj.json -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_PAT" \
            "$MGMT_API/projects/$PROJECT_REF")
          if [ "$status" != "200" ]; then
            echo "::error::Management API returned $status. Check the PAT and that it has access to project $PROJECT_REF."
            cat /tmp/proj.json
            exit 1
          fi
          echo "Project: $(jq -r '.name' /tmp/proj.json) (region: $(jq -r '.region' /tmp/proj.json))"

      - name: Apply migrations via Management API
        if: ${{ github.event_name == 'push' || inputs.apply_migrations }}
        env:
          SUPABASE_PAT: ${{ secrets.supabaseapi }}
        run: |
          set -euo pipefail
          for f in supabase/migrations/*.sql; do
            echo "::group::Applying $(basename "$f")"
            MIGRATION_SQL=$(jq -Rs . < "$f")
            BODY=$(jq -n --argjson q "$MIGRATION_SQL" '{query: $q}')
            status=$(curl -sS -o /tmp/migrate.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $SUPABASE_PAT" \
              -H "Content-Type: application/json" \
              -d "$BODY" \
              "$MGMT_API/projects/$PROJECT_REF/database/query")
            if [ "$status" -ge 400 ]; then
              echo "::error::Migration $(basename "$f") failed (HTTP $status):"
              cat /tmp/migrate.json
              exit 1
            fi
            echo "Applied."
            echo "::endgroup::"
          done

      - name: Configure auth redirect URLs
        if: ${{ github.event_name == 'push' || inputs.configure_auth }}
        env:
          SUPABASE_PAT: ${{ secrets.supabaseapi }}
        run: |
          set -euo pipefail
          BODY=$(jq -n \
            --arg site_url "$SITE_URL" \
            --arg uri_allow_list "$SITE_URL**,http://localhost:5173/**" \
            '{site_url: $site_url, uri_allow_list: $uri_allow_list}')
          status=$(curl -sS -o /tmp/auth.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $SUPABASE_PAT" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$MGMT_API/projects/$PROJECT_REF/config/auth")
          if [ "$status" -ge 400 ]; then
            echo "::error::Auth config update failed (HTTP $status):"
            cat /tmp/auth.json
            exit 1
          fi
          echo "Auth redirect URLs configured: $SITE_URL"

      - name: Fetch service_role key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_seed }}
        id: keys
        env:
          SUPABASE_PAT: ${{ secrets.supabaseapi }}
        run: |
          set -euo pipefail
          KEYS=$(curl -fsSL \
            -H "Authorization: Bearer $SUPABASE_PAT" \
            "$MGMT_API/projects/$PROJECT_REF/api-keys")
          SR_KEY=$(echo "$KEYS" | jq -r '.[] | select(.name=="service_role") | .api_key')
          if [ -z "$SR_KEY" ] || [ "$SR_KEY" = "null" ]; then
            echo "::error::Could not extract service_role key from Management API response."
            echo "$KEYS"
            exit 1
          fi
          echo "::add-mask::$SR_KEY"
          echo "sr_key=$SR_KEY" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_seed }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_seed }}
        run: npm ci

      - name: Seed dictionary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_seed }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.sr_key }}
        run: node scripts/seed-supabase.mjs

      - name: Verify
        env:
          SUPABASE_PAT: ${{ secrets.supabaseapi }}
        run: |
          set -euo pipefail
          BODY='{"query":"SELECT count(*) AS words FROM words; SELECT word, tier, rank FROM search_words('"'"'hao'"'"') LIMIT 5;"}'
          curl -fsSL -X POST \
            -H "Authorization: Bearer $SUPABASE_PAT" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$MGMT_API/projects/$PROJECT_REF/database/query" \
            | jq .
