<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Network · 中文</title>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf8f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16140f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="中文" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
    <style>
      :root {
        --bg: #faf8f4;
        --surface: #ffffff;
        --surface-2: #f0ece4;
        --text: #1a1a1a;
        --muted: #7a7466;
        --border: #d9d3c4;
        --accent: #b12a2a;
        --word: #b12a2a;
        --char: #4a7c59;
        --edge: #c8c0ad;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16140f;
          --surface: #1f1c14;
          --surface-2: #272319;
          --text: #f5f1e6;
          --muted: #a39d8a;
          --border: #3a3527;
          --accent: #e07070;
          --word: #e07070;
          --char: #6dba84;
          --edge: #4a4334;
        }
      }
      html, body {
        margin: 0; padding: 0;
        background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        overscroll-behavior: none;
      }
      #cy { position: fixed; inset: 0; touch-action: none; }
      .topbar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 10;
        display: flex; align-items: center; gap: 14px;
        padding: 10px 14px;
        background: linear-gradient(to bottom, var(--bg) 70%, transparent);
        pointer-events: none;
      }
      .topbar > * { pointer-events: auto; }
      .hamburger {
        background: transparent; border: none;
        width: 36px; height: 36px;
        display: inline-flex; flex-direction: column;
        justify-content: center; gap: 4px;
        padding: 0 6px; cursor: pointer; border-radius: 8px;
        -webkit-tap-highlight-color: transparent;
      }
      .hamburger:hover { background: var(--surface-2); }
      .hamburger span {
        display: block; height: 2px; background: var(--text);
        border-radius: 2px;
      }
      .drawer { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
      .drawer[aria-hidden="false"] { pointer-events: auto; }
      .drawer-backdrop {
        position: absolute; inset: 0;
        background: rgba(0,0,0,0.32);
        opacity: 0; transition: opacity 0.18s;
      }
      .drawer[aria-hidden="false"] .drawer-backdrop { opacity: 1; }
      .drawer-panel {
        position: absolute; top: 0; left: 0; bottom: 0;
        width: min(260px, 80vw);
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 56px 16px 16px;
        display: flex; flex-direction: column; gap: 4px;
        transform: translateX(-100%); transition: transform 0.2s ease;
        box-shadow: 4px 0 16px rgba(0,0,0,0.12);
      }
      .drawer[aria-hidden="false"] .drawer-panel { transform: translateX(0); }
      .drawer-panel a {
        color: var(--text); padding: 10px 12px; border-radius: 8px;
        font-size: 15px;
      }
      .drawer-panel a:hover { background: var(--surface-2); }
      .drawer-panel a.is-active { color: var(--accent); font-weight: 500; }
      .drawer-close {
        position: absolute; top: 10px; right: 10px;
        width: 32px; height: 32px;
        background: transparent; border: none; cursor: pointer;
        font-size: 18px; color: var(--muted); border-radius: 8px;
      }
      .drawer-close:hover { background: var(--surface-2); color: var(--text); }
      .topbar h1 {
        font-size: 16px; font-weight: 500; margin: 0;
        color: var(--text); letter-spacing: 0.5px;
      }
      .toolbar {
        margin-left: auto;
        display: flex; gap: 6px; flex-wrap: wrap;
      }
      .pill {
        background: transparent; border: 1px solid var(--border);
        color: var(--muted); font: inherit; font-size: 11px;
        letter-spacing: 0.4px;
        padding: 4px 10px; border-radius: 999px;
        cursor: pointer; text-transform: uppercase;
        -webkit-tap-highlight-color: transparent;
      }
      .pill:hover { color: var(--text); border-color: var(--text); }
      .pill.is-active {
        color: var(--accent); border-color: var(--accent); background: var(--surface-2);
      }
      .legend {
        position: fixed; bottom: 14px; left: 14px;
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 10px; padding: 8px 12px;
        font-size: 11px; color: var(--muted);
        display: flex; gap: 12px;
      }
      .legend-dot {
        display: inline-block; width: 10px; height: 10px;
        border-radius: 50%; vertical-align: middle; margin-right: 4px;
      }
      .empty {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 8px; padding: 40px;
        text-align: center; color: var(--muted);
      }
      .empty a { color: var(--accent); }
      .gesture-hint {
        position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%);
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 999px; padding: 8px 16px;
        font-size: 12px; color: var(--text); text-align: center;
        box-shadow: 0 4px 14px rgba(0,0,0,0.16);
        z-index: 30; pointer-events: none;
        opacity: 0; transition: opacity 0.25s;
      }
      .gesture-hint.show { opacity: 1; }
      .page-id {
        position: fixed; bottom: 6px; right: 10px;
        font-size: 10px; color: var(--muted); opacity: 0.6;
      }
      /* In-page entity sheet — mirrors the main app's EntitySheet
         shape (pinyin / hanzi / meaning + made-of row). Opens on
         second-tap of a node; closes on backdrop click or ✕. */
      .sheet-overlay {
        position: fixed; inset: 0; z-index: 50;
        pointer-events: none;
      }
      .sheet-overlay[aria-hidden="false"] { pointer-events: auto; }
      .sheet-overlay-backdrop {
        position: absolute; inset: 0;
        background: rgba(0,0,0,0.36);
        opacity: 0; transition: opacity 0.18s;
      }
      .sheet-overlay[aria-hidden="false"] .sheet-overlay-backdrop { opacity: 1; }
      .sheet-overlay-panel {
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, calc(-50% + 12px));
        opacity: 0;
        width: min(420px, calc(100vw - 28px));
        max-height: calc(100vh - 80px);
        overflow: auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 26px 22px 22px;
        box-shadow: 0 14px 36px rgba(0,0,0,0.22);
        transition: opacity 0.18s ease, transform 0.2s ease;
      }
      .sheet-overlay[aria-hidden="false"] .sheet-overlay-panel {
        transform: translate(-50%, -50%); opacity: 1;
      }
      .sheet-overlay-close {
        position: absolute; top: 8px; right: 8px;
        width: 32px; height: 32px;
        background: transparent; border: none; cursor: pointer;
        font-size: 16px; color: var(--muted); border-radius: 8px;
      }
      .sheet-overlay-close:hover { background: var(--surface-2); color: var(--text); }
      .sheet-overlay-pinyin {
        font-size: 11px; letter-spacing: 0.8px;
        color: var(--muted); text-transform: uppercase;
      }
      .sheet-overlay-hanzi {
        font-family: "PingFang SC","Hiragino Sans GB","Source Han Sans SC",system-ui,sans-serif;
        font-size: 48px; line-height: 1.1;
        margin: 2px 0 8px;
      }
      .sheet-overlay-pos {
        display: inline-block; font-size: 11px; letter-spacing: 0.6px;
        text-transform: uppercase; color: var(--accent);
        margin-right: 8px;
      }
      .sheet-overlay-meaning { font-size: 15px; color: var(--text); line-height: 1.4; }
      .sheet-overlay-section {
        margin-top: 16px; padding-top: 12px;
        border-top: 1px solid var(--border);
      }
      .sheet-overlay-section-head {
        font-size: 10px; letter-spacing: 0.6px;
        color: var(--muted); text-transform: uppercase;
        margin-bottom: 8px;
      }
      .sheet-overlay-pieces {
        display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      }
      .sheet-overlay-piece {
        display: grid; grid-template-rows: 14px auto 14px;
        align-items: center; justify-items: center; row-gap: 2px;
      }
      .sheet-overlay-piece-pinyin,
      .sheet-overlay-piece-meaning {
        font-size: 10px; color: var(--muted);
        max-width: 12ch; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap;
      }
      .sheet-overlay-piece-glyph {
        font-family: "PingFang SC","Hiragino Sans GB","Source Han Sans SC",system-ui,sans-serif;
        font-size: 26px; color: var(--text); padding: 0 4px;
      }
      .sheet-overlay-op {
        font-size: 16px; color: var(--muted);
        padding: 0 2px;
      }
      .sheet-overlay-open {
        display: inline-block; margin-top: 14px;
        color: var(--accent); text-decoration: none;
        font-size: 13px;
      }
      .sheet-overlay-open:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <h1>Network</h1>
      <div class="toolbar" id="toolbar">
        <button class="pill is-active" data-layout="cose">Force</button>
        <button class="pill" data-layout="concentric">Rings</button>
        <button class="pill" data-layout="grid">Grid</button>
        <button class="pill" data-mode="words-chars" id="modeWC">Words+Chars</button>
        <button class="pill" data-mode="words-only">Words only</button>
      </div>
    </div>
    <nav class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-backdrop" data-close></div>
      <div class="drawer-panel" role="dialog" aria-label="Menu">
        <button class="drawer-close" data-close aria-label="Close menu">✕</button>
        <a href="../">中文 · Home</a>
        <a href="../#/review">Review</a>
        <a href="../#/phonetics">Phonetics</a>
        <a href="./" class="is-active">Network</a>
        <a href="../components/">Components</a>
      </div>
    </nav>
    <div id="cy"></div>
    <div class="sheet-overlay" id="entitySheet" aria-hidden="true">
      <div class="sheet-overlay-backdrop" data-close-sheet></div>
      <div class="sheet-overlay-panel" role="dialog" aria-label="Entity details">
        <button class="sheet-overlay-close" data-close-sheet aria-label="Close">✕</button>
        <div class="sheet-overlay-pinyin" id="sheetPinyin"></div>
        <div class="sheet-overlay-hanzi" id="sheetHanzi"></div>
        <div class="sheet-overlay-meaning" id="sheetMeaning"></div>
        <div class="sheet-overlay-section" id="sheetMadeOfSec" hidden>
          <div class="sheet-overlay-section-head" id="sheetMadeOfHead">MADE OF</div>
          <div class="sheet-overlay-pieces" id="sheetMadeOf"></div>
        </div>
        <a class="sheet-overlay-open" id="sheetOpenInApp" href="#">Open in main app →</a>
      </div>
    </div>
    <div class="gesture-hint" id="gestureHint">Tap once to focus · tap again to open</div>
    <div class="legend" id="legend">
      <span><span class="legend-dot" style="background: var(--word)"></span>Word</span>
      <span><span class="legend-dot" style="background: var(--char)"></span>Character</span>
    </div>
    <div class="page-id">network v7</div>

    <script>
      // Reads the same v2 localStorage shape the React app writes.
      function loadSaved() {
        try {
          const raw = localStorage.getItem('chinese.saved');
          if (!raw) return [];
          const p = JSON.parse(raw);
          if (p && p.version === 2 && Array.isArray(p.items)) {
            return p.items.map(([w]) => w).filter(w => typeof w === 'string');
          }
          if (Array.isArray(p)) return p.filter(w => typeof w === 'string');
        } catch (_) { /* ignore */ }
        return [];
      }

      function loadStatus(key) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return new Set();
          const p = JSON.parse(raw);
          if (p && p.version === 2 && Array.isArray(p.items)) {
            return new Set(p.items.map(([w]) => w));
          }
        } catch (_) { /* ignore */ }
        return new Set();
      }

      // Whole-word translations are NOT in data-chars.json (which only carries
      // per-character info). Fetch from the same Supabase project the main
      // app uses; cache hits are reused on subsequent long-presses.
      const SUPABASE_URL = 'https://oigbbgtzzqiceetasayy.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_YTd6bXMqUddNj4aFf1YRwA_T320qu3c';
      const wordDefCache = new Map();
      async function fetchWordDef(word) {
        if (wordDefCache.has(word)) return wordDefCache.get(word);
        try {
          const r = await fetch(
            `${SUPABASE_URL}/rest/v1/words?word=eq.${encodeURIComponent(word)}&select=pinyin,definitions`,
            { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } },
          );
          if (!r.ok) { wordDefCache.set(word, null); return null; }
          const rows = await r.json();
          const row = rows[0] || null;
          wordDefCache.set(word, row);
          return row;
        } catch (_) {
          wordDefCache.set(word, null);
          return null;
        }
      }

      async function loadCharsData() {
        try {
          const r = await fetch('../data-chars.json', { cache: 'no-cache' });
          if (!r.ok) return {};
          const j = await r.json();
          return j.chars || {};
        } catch (_) { return {}; }
      }

      let cy = null;
      let mode = 'words-chars';

      // --- In-page entity sheet (no main-app redirect) -----------------
      const sheetEl = document.getElementById('entitySheet');
      const sheetPinyin = document.getElementById('sheetPinyin');
      const sheetHanzi = document.getElementById('sheetHanzi');
      const sheetMeaning = document.getElementById('sheetMeaning');
      const sheetMadeOfSec = document.getElementById('sheetMadeOfSec');
      const sheetMadeOfHead = document.getElementById('sheetMadeOfHead');
      const sheetMadeOf = document.getElementById('sheetMadeOf');
      const sheetOpenInApp = document.getElementById('sheetOpenInApp');

      function closeSheet() {
        sheetEl.setAttribute('aria-hidden', 'true');
      }
      sheetEl.addEventListener('click', (e) => {
        if (e.target.dataset.closeSheet !== undefined) closeSheet();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && sheetEl.getAttribute('aria-hidden') === 'false') closeSheet();
      });

      // Build a single ".sheet-overlay-piece" — pinyin / hanzi / meaning.
      function pieceMarkup(label, pinyin, meaning) {
        return (
          `<span class="sheet-overlay-piece">` +
            `<span class="sheet-overlay-piece-pinyin">${pinyin || ''}</span>` +
            `<span class="sheet-overlay-piece-glyph">${label}</span>` +
            `<span class="sheet-overlay-piece-meaning">${meaning || ''}</span>` +
          `</span>`
        );
      }

      function setSheetMadeOf(label, opts) {
        // opts.kind: 'word' → MADE OF (chars in word); 'char' → ETYMOLOGY (components).
        // opts.charsData: per-char lookup. opts.resultPinyin/Meaning: header values.
        const { kind, charsData, resultPinyin, resultMeaning } = opts;
        const head = kind === 'word' ? 'MADE OF' : 'ETYMOLOGY';
        sheetMadeOfHead.textContent = head;
        const pieces = kind === 'word'
          ? [...label].map((c) => ({ char: c }))
          : ((charsData[label]?.components || [])
              .filter((c) => c && c.char && c.char !== '◎')
              .map((c) => ({ char: c.char })));
        if (pieces.length === 0) { sheetMadeOfSec.hidden = true; return; }
        const inner = [];
        pieces.forEach((p, i) => {
          if (i > 0) inner.push(`<span class="sheet-overlay-op">+</span>`);
          const cd = charsData[p.char];
          inner.push(pieceMarkup(p.char, cd?.pinyin || '', cd?.definitions?.[0] || ''));
        });
        inner.push(`<span class="sheet-overlay-op">=</span>`);
        inner.push(pieceMarkup(label, resultPinyin || '', resultMeaning || ''));
        sheetMadeOf.innerHTML = inner.join('');
        sheetMadeOfSec.hidden = false;
      }

      async function openSheet(node, charsData) {
        const d = node.data();
        const label = d.label;
        const kind = d.kind;
        if (kind === 'word') {
          const row = await fetchWordDef(label);
          const pinyin = row?.pinyin || '';
          const defs = Array.isArray(row?.definitions) ? row.definitions : [];
          sheetPinyin.textContent = pinyin;
          sheetHanzi.textContent = label;
          sheetMeaning.textContent = defs.join(' · ');
          setSheetMadeOf(label, { kind: 'word', charsData, resultPinyin: pinyin, resultMeaning: defs[0] || '' });
          sheetOpenInApp.href = `../#/w/${encodeURIComponent(label)}`;
        } else {
          const cd = charsData[label];
          sheetPinyin.textContent = cd?.pinyin || '';
          sheetHanzi.textContent = label;
          sheetMeaning.textContent = (cd?.definitions || []).slice(0, 4).join(' · ');
          setSheetMadeOf(label, { kind: 'char', charsData, resultPinyin: cd?.pinyin || '', resultMeaning: cd?.definitions?.[0] || '' });
          sheetOpenInApp.href = `../#/c/${encodeURIComponent(label)}`;
        }
        sheetEl.setAttribute('aria-hidden', 'false');
      }
      // -------------------------------------------------------------------

      function buildElements(words, charsData) {
        const elements = [];
        const charSet = new Set();
        const wordSet = new Set(words);
        const learned = loadStatus('chinese.learned');
        const wrote = loadStatus('chinese.wrote');

        for (const w of words) {
          const tier = wrote.has(w) ? 'wrote' : learned.has(w) ? 'learned' : 'saved';
          elements.push({
            data: {
              id: 'w:' + w, label: w, kind: 'word', word: w,
              tier, len: [...w].length,
            },
          });
          if (mode === 'words-chars' && [...w].length > 1) {
            // Single-char words ARE their character — a duplicate "char" node
            // would just be the same glyph attached to itself.
            for (const c of w) {
              if (wordSet.has(c)) {
                // Char is itself a saved word — route the edge word→word.
                elements.push({
                  data: { id: `e:${w}-${c}`, source: 'w:' + c, target: 'w:' + w, kind: 'ww' },
                });
                continue;
              }
              if (!charSet.has(c)) {
                charSet.add(c);
                elements.push({
                  data: {
                    id: 'c:' + c, label: c, kind: 'char', char: c,
                    pinyin: charsData[c]?.pinyin || '',
                  },
                });
              }
              elements.push({
                data: { id: `e:${w}-${c}`, source: 'w:' + w, target: 'c:' + c, kind: 'wc' },
              });
            }
          }
          // words-only mode builds edges in a second pass below.
        }

        if (mode === 'words-only') {
          for (let i = 0; i < words.length; i++) {
            const a = [...words[i]];
            for (let j = i + 1; j < words.length; j++) {
              const b = words[j];
              const shared = a.filter((c) => b.includes(c));
              if (shared.length === 0) continue;
              elements.push({
                data: {
                  id: `e:${words[i]}-${words[j]}`,
                  source: 'w:' + words[i],
                  target: 'w:' + words[j],
                  weight: shared.length,
                  shared: shared.join(''),
                  kind: 'ww',
                },
              });
            }
          }
        }
        return elements;
      }

      function tierColor(tier) {
        if (tier === 'wrote') return '#7a3aa8';
        if (tier === 'learned') return '#2e7d32';
        return getComputedStyle(document.documentElement).getPropertyValue('--word').trim();
      }

      async function render() {
        const words = loadSaved();
        if (words.length === 0) {
          document.body.innerHTML =
            '<div class="empty">' +
            '<div>No saved words yet.</div>' +
            '<div>Open the <a href="../">main app</a>, save a few, then come back.</div>' +
            '</div>';
          return;
        }
        const charsData = await loadCharsData();
        const elements = buildElements(words, charsData);

        cy = cytoscape({
          container: document.getElementById('cy'),
          elements,
          minZoom: 0.2, maxZoom: 4,
          wheelSensitivity: 0.4,
          style: [
            { selector: 'node[kind="word"]', style: {
              'label': 'data(label)',
              'background-color': (ele) => tierColor(ele.data('tier')),
              'color': '#fff',
              'text-valign': 'center', 'text-halign': 'center',
              'font-family': '"PingFang SC","Hiragino Sans GB","Source Han Sans SC",system-ui,sans-serif',
              'font-size': '18px', 'font-weight': '500',
              'width': 'mapData(len, 1, 6, 50, 110)',
              'height': 'mapData(len, 1, 6, 50, 110)',
              'border-width': 0,
              'shape': 'round-rectangle',
              'padding': '8px',
              'text-wrap': 'wrap', 'text-max-width': '90px',
            }},
            { selector: 'node[kind="char"]', style: {
              'label': 'data(label)',
              'background-color': 'var(--char)',
              'color': '#fff',
              'text-valign': 'center', 'text-halign': 'center',
              'font-family': '"PingFang SC","Hiragino Sans GB","Source Han Sans SC",system-ui,sans-serif',
              'font-size': '16px',
              // 44px is the minimum touch-target target.
              'width': 44, 'height': 44,
              'shape': 'ellipse',
            }},
            { selector: 'edge[kind="wc"]', style: {
              'width': 1.5,
              'line-color': 'var(--edge)',
              'curve-style': 'straight',
              'opacity': 0.55,
            }},
            { selector: 'edge[kind="ww"]', style: {
              'width': 'mapData(weight, 1, 4, 1.5, 6)',
              'line-color': 'var(--edge)',
              'curve-style': 'bezier',
              'opacity': 0.5,
              'label': 'data(shared)',
              'font-size': '12px',
              'color': 'var(--muted)',
              'text-rotation': 'autorotate',
              'text-background-color': 'var(--bg)',
              'text-background-opacity': 1,
              'text-background-padding': '2px',
            }},
            { selector: 'node:selected', style: {
              'border-width': 3, 'border-color': 'var(--accent)',
            }},
            { selector: 'node.active', style: {
              'border-width': 3, 'border-color': 'var(--accent)',
            }},
            // Unselected cards stay legible (chars still visible).
            { selector: '.faded', style: { 'opacity': 0.55 } },
            { selector: '.highlight', style: { 'opacity': 1 } },
          ],
          layout: layoutFor('cose'),
        });

        // First-visit gesture hint (UX-7): floats over the canvas, auto-
        // dismisses after 5s or on the first interaction.
        (function () {
          try { if (sessionStorage.getItem('hint.seen.graph')) return; } catch (_) {}
          const el = document.getElementById('gestureHint');
          if (!el) return;
          el.classList.add('show');
          let done = false;
          const hide = () => {
            if (done) return; done = true;
            el.classList.remove('show');
            try { sessionStorage.setItem('hint.seen.graph', '1'); } catch (_) {}
            setTimeout(() => el.remove(), 300);
          };
          setTimeout(hide, 5000);
          cy.one('tap dbltap taphold', hide);
        })();

        // Two-step interaction: first tap on a card activates it (highlights
        // the neighborhood, gently fades the rest while keeping characters
        // legible); second tap on the SAME card opens the in-page entity
        // sheet — NO redirect to the main app. Tap blank to clear.
        let activeNodeId = null;
        cy.on('tap', 'node', (e) => {
          const node = e.target;
          if (activeNodeId === node.id()) {
            openSheet(node, charsData);
            return;
          }
          activeNodeId = node.id();
          cy.nodes().removeClass('active');
          node.addClass('active');
          cy.elements().addClass('faded').removeClass('highlight');
          node.closedNeighborhood().removeClass('faded').addClass('highlight');
        });
        cy.on('tap', (e) => {
          if (e.target === cy) {
            activeNodeId = null;
            cy.elements().removeClass('faded highlight active');
          }
        });

        // Deep-link focus support. Caller passes ?focus=<key> (URL-encoded
        // hanzi) — once the initial layout settles, highlight + center the
        // matching node. Used by CharPopup's "Show in network" button.
        const focusTarget = new URLSearchParams(location.search).get('focus');
        if (focusTarget) {
          cy.one('layoutstop', () => {
            const wn = cy.getElementById('w:' + focusTarget);
            const cn = cy.getElementById('c:' + focusTarget);
            const node = wn.length ? wn : cn.length ? cn : null;
            if (!node) return;
            activeNodeId = node.id();
            cy.nodes().removeClass('active');
            node.addClass('active');
            cy.elements().addClass('faded').removeClass('highlight');
            node.closedNeighborhood().removeClass('faded').addClass('highlight');
            cy.animate(
              { center: { eles: node }, zoom: Math.max(cy.zoom(), 1.2) },
              { duration: 400 },
            );
          });
        }
      }

      function layoutFor(name) {
        if (name === 'cose') {
          return { name: 'cose', animate: true, padding: 40,
                   idealEdgeLength: 90, nodeOverlap: 20,
                   gravity: 0.3, numIter: 1500, randomize: true };
        }
        if (name === 'concentric') {
          return { name: 'concentric', animate: true, padding: 40,
                   minNodeSpacing: 30,
                   concentric: (n) => n.data('kind') === 'word' ? 2 : 1,
                   levelWidth: () => 1 };
        }
        if (name === 'grid') {
          return { name: 'grid', animate: true, padding: 30 };
        }
        return { name: 'cose' };
      }

      // Hamburger drawer.
      const drawer = document.getElementById('drawer');
      const hamburger = document.getElementById('hamburger');
      function setDrawer(open) {
        drawer.setAttribute('aria-hidden', open ? 'false' : 'true');
        hamburger.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      hamburger.addEventListener('click', () => setDrawer(drawer.getAttribute('aria-hidden') !== 'false'));
      drawer.addEventListener('click', (e) => {
        if (e.target.dataset.close !== undefined) setDrawer(false);
      });

      const toolbar = document.getElementById('toolbar');
      toolbar.addEventListener('click', (e) => {
        const btn = e.target.closest('.pill');
        if (!btn || !cy) return;
        if (btn.dataset.layout) {
          [...toolbar.querySelectorAll('[data-layout]')].forEach(b => b.classList.toggle('is-active', b === btn));
          cy.layout(layoutFor(btn.dataset.layout)).run();
        } else if (btn.dataset.mode) {
          [...toolbar.querySelectorAll('[data-mode]')].forEach(b => b.classList.toggle('is-active', b === btn));
          mode = btn.dataset.mode;
          render();
        }
      });

      render();
    </script>
    <script>
      // Same service worker as the main app (scope /chineseapp/) so this
      // page is reachable offline after first visit and installable.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('../sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
