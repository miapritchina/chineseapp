<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>中文 · Chinese</title>
    <link rel="stylesheet" href="styles.css?v=10" />
  </head>
  <body>
    <header class="topbar">
      <a class="home-link" href="../">← Apps</a>
      <h1>中文</h1>
      <span class="spacer"></span>
    </header>

    <div class="search-bar">
      <input
        id="search"
        type="search"
        autocomplete="off"
        autocapitalize="none"
        autocorrect="off"
        spellcheck="false"
        placeholder="Search 汉字, pinyin, English…"
        aria-label="Search words"
      />
    </div>

    <main id="home" class="home" aria-label="Home">
      <section id="saved-section" class="shelf-section" hidden>
        <div class="shelf-title">Saved</div>
        <div id="saved-shelf" class="shelf"></div>
      </section>

      <section id="suggested-section" class="shelf-section" hidden>
        <div class="shelf-title">Suggested</div>
        <div id="suggested-shelf" class="shelf"></div>
      </section>

      <section id="grid-section" class="grid-section">
        <div class="shelf-title">Most common words</div>
        <div id="grid" class="grid"></div>
        <button id="load-more" class="load-more" type="button" hidden>Load more</button>
      </section>
    </main>

    <section id="results" class="results" hidden aria-label="Search results"></section>
    <div id="empty" class="empty-state" hidden>No matches.</div>

    <div id="modal-root" class="modal-root" aria-hidden="true"></div>

    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7/dist/hanzi-writer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script src="app.js?v=10"></script>
    <div class="page-id">chinese v10</div>
  </body>
</html>
