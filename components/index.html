<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Components · 中文</title>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf8f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16140f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="中文" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <!-- Vendored (v108) — same copy as network/vendor; see note there. -->
    <script src="../network/vendor/cytoscape.min.js"></script>
    <style>
      :root {
        --bg: #faf8f4;
        --surface: #ffffff;
        --surface-2: #f0ece4;
        --text: #1a1a1a;
        --muted: #7a7466;
        --border: #d9d3c4;
        --accent: #b12a2a;

        --word: #b12a2a;
        --word-learned: #2e7d32;
        --word-wrote: #7a3aa8;
        --char: #4a7c59;
        --char-saved: #b12a2a;
        --edge: #c8c0ad;

        /* Role palette — mirrors the tree modal */
        --role-iconic: #2563eb;
        --role-meaning: #16a34a;
        --role-sound: #dc2626;
        --role-simplified: #9333ea;
        --role-deleted: #6b7280;
        --role-unknown: #9ca3af;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16140f;
          --surface: #1f1c14;
          --surface-2: #272319;
          --text: #f5f1e6;
          --muted: #a39d8a;
          --border: #3a3527;
          --accent: #e07070;

          --word: #e07070;
          --word-learned: #6dba84;
          --word-wrote: #b07ad8;
          --char: #6dba84;
          --char-saved: #e07070;
          --edge: #4a4334;

          --role-iconic: #60a5fa;
          --role-meaning: #4ade80;
          --role-sound: #f87171;
          --role-simplified: #c084fc;
          --role-deleted: #9ca3af;
          --role-unknown: #9ca3af;
        }
      }
      html, body {
        margin: 0; padding: 0;
        background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        overscroll-behavior: none;
      }
      #cy { position: fixed; inset: 0; touch-action: none; }
      .topbar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 10;
        display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        padding: 10px 14px;
        background: linear-gradient(to bottom, var(--bg) 60%, transparent);
        pointer-events: none;
      }
      .topbar > * { pointer-events: auto; }
      .hamburger {
        background: transparent; border: none;
        width: 36px; height: 36px;
        display: inline-flex; flex-direction: column;
        justify-content: center; gap: 4px;
        padding: 0 6px; cursor: pointer; border-radius: 8px;
        -webkit-tap-highlight-color: transparent;
      }
      .hamburger:hover { background: var(--surface-2); }
      .hamburger span {
        display: block; height: 2px; background: var(--text);
        border-radius: 2px;
      }
      .drawer { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
      .drawer[aria-hidden="false"] { pointer-events: auto; }
      .drawer-backdrop {
        position: absolute; inset: 0;
        background: rgba(0,0,0,0.32);
        opacity: 0; transition: opacity 0.18s;
      }
      .drawer[aria-hidden="false"] .drawer-backdrop { opacity: 1; }
      .drawer-panel {
        position: absolute; top: 0; left: 0; bottom: 0;
        width: min(260px, 80vw);
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 56px 16px 16px;
        display: flex; flex-direction: column; gap: 4px;
        transform: translateX(-100%); transition: transform 0.2s ease;
        box-shadow: 4px 0 16px rgba(0,0,0,0.12);
        overflow-y: auto;
      }
      .drawer[aria-hidden="false"] .drawer-panel { transform: translateX(0); }
      .drawer-panel a {
        color: var(--text); padding: 10px 12px; border-radius: 8px;
        font-size: 15px; text-decoration: none;
      }
      .drawer-panel a:hover { background: var(--surface-2); }
      .drawer-panel a.is-active { color: var(--accent); font-weight: 500; }
      .drawer-close {
        position: absolute; top: 10px; right: 10px;
        width: 32px; height: 32px;
        background: transparent; border: none; cursor: pointer;
        font-size: 18px; color: var(--muted); border-radius: 8px;
      }
      .drawer-close:hover { background: var(--surface-2); color: var(--text); }
      .drawer-legend {
        margin-top: 18px; padding-top: 14px;
        border-top: 1px solid var(--border);
        display: flex; flex-direction: column; gap: 6px;
      }
      .drawer-legend-title {
        font-size: 10px; letter-spacing: 0.6px;
        text-transform: uppercase; color: var(--muted);
        margin-bottom: 4px;
      }
      .drawer-legend-row {
        display: flex; align-items: center; gap: 8px;
        font-size: 13px; color: var(--text);
      }
      .drawer-legend-row i {
        display: inline-block; width: 10px; height: 10px;
        border-radius: 50%; flex-shrink: 0;
      }
      .topbar h1 {
        font-size: 16px; font-weight: 500; margin: 0;
        color: var(--text); letter-spacing: 0.5px;
      }
      .toolbar { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .pill {
        background: transparent; border: 1px solid var(--border);
        color: var(--muted); font: inherit; font-size: 11px;
        letter-spacing: 0.4px; padding: 4px 10px; border-radius: 999px;
        cursor: pointer; text-transform: uppercase;
        -webkit-tap-highlight-color: transparent;
      }
      .pill:hover { color: var(--text); border-color: var(--text); }
      .pill.is-active { color: var(--accent); border-color: var(--accent); background: var(--surface-2); }
      .search {
        font: inherit; font-size: 14px;
        background: var(--surface); color: var(--text);
        border: 1px solid var(--border); border-radius: 999px;
        padding: 5px 12px; width: 130px;
        outline: none;
      }
      .search:focus { border-color: var(--accent); }
      .legend {
        position: fixed; bottom: 14px; left: 14px;
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 10px; padding: 8px 12px;
        font-size: 11px; color: var(--muted);
        display: flex; gap: 14px; flex-wrap: wrap; max-width: calc(100vw - 28px);
      }
      .legend-dot {
        display: inline-block; width: 10px; height: 10px;
        border-radius: 50%; vertical-align: middle; margin-right: 4px;
      }
      .legend-square {
        display: inline-block; width: 10px; height: 10px;
        border-radius: 2px; vertical-align: middle; margin-right: 4px;
      }
      .empty {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 8px; padding: 40px;
        text-align: center; color: var(--muted);
      }
      .empty a { color: var(--accent); }
      .gesture-hint {
        position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%);
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 999px; padding: 8px 16px;
        font-size: 12px; color: var(--text); text-align: center;
        box-shadow: 0 4px 14px rgba(0,0,0,0.16);
        z-index: 30; pointer-events: none;
        opacity: 0; transition: opacity 0.25s;
      }
      .gesture-hint.show { opacity: 1; }
      .page-id {
        position: fixed; bottom: 6px; right: 10px;
        font-size: 10px; color: var(--muted); opacity: 0.6;
      }
      /* In-page entity sheet — mirrors the main app's EntitySheet
         shape. Opens on second-tap; closes on backdrop / ✕ / Escape. */
      .sheet-overlay { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
      .sheet-overlay[aria-hidden="false"] { pointer-events: auto; }
      .sheet-overlay-backdrop {
        position: absolute; inset: 0;
        background: rgba(0,0,0,0.36);
        opacity: 0; transition: opacity 0.18s;
      }
      .sheet-overlay[aria-hidden="false"] .sheet-overlay-backdrop { opacity: 1; }
      .sheet-overlay-panel {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, calc(-50% + 12px));
        opacity: 0;
        width: min(420px, calc(100vw - 28px));
        max-height: calc(100vh - 80px);
        overflow: auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 26px 22px 22px;
        box-shadow: 0 14px 36px rgba(0,0,0,0.22);
        transition: opacity 0.18s ease, transform 0.2s ease;
      }
      .sheet-overlay[aria-hidden="false"] .sheet-overlay-panel {
        transform: translate(-50%, -50%); opacity: 1;
      }
      .sheet-overlay-close {
        position: absolute; top: 8px; right: 8px;
        width: 32px; height: 32px;
        background: transparent; border: none; cursor: pointer;
        font-size: 16px; color: var(--muted); border-radius: 8px;
      }
      .sheet-overlay-close:hover { background: var(--surface-2); color: var(--text); }
      .sheet-overlay-pinyin {
        font-size: 11px; letter-spacing: 0.8px;
        color: var(--muted); text-transform: uppercase;
      }
      .sheet-overlay-hanzi {
        font-family: "PingFang SC","Hiragino Sans GB","Source Han Sans SC",system-ui,sans-serif;
        font-size: 48px; line-height: 1.1;
        margin: 2px 0 8px;
      }
      .sheet-overlay-meaning { font-size: 15px; color: var(--text); line-height: 1.4; }
      .sheet-overlay-section {
        margin-top: 16px; padding-top: 12px;
        border-top: 1px solid var(--border);
      }
      .sheet-overlay-section-head {
        font-size: 10px; letter-spacing: 0.6px;
        color: var(--muted); text-transform: uppercase;
        margin-bottom: 8px;
      }
      .sheet-overlay-pieces { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
      .sheet-overlay-piece {
        display: grid; grid-template-rows: 14px auto 14px;
        align-items: center; justify-items: center; row-gap: 2px;
      }
      .sheet-overlay-piece-pinyin,
      .sheet-overlay-piece-meaning {
        font-size: 10px; color: var(--muted);
        max-width: 12ch; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap;
      }
      .sheet-overlay-piece-glyph {
        font-family: "PingFang SC","Hiragino Sans GB","Source Han Sans SC",system-ui,sans-serif;
        font-size: 26px; color: var(--text); padding: 0 4px;
      }
      .sheet-overlay-op { font-size: 16px; color: var(--muted); padding: 0 2px; }
      .sheet-overlay-open {
        display: inline-block; margin-top: 14px;
        color: var(--accent); text-decoration: none; font-size: 13px;
      }
      .sheet-overlay-open:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <h1>Components</h1>
      <div class="toolbar" id="toolbar">
        <input class="search" id="search" type="search" placeholder="char or pinyin" autocomplete="off" />
        <button class="pill is-active" data-layout="cose">Force</button>
        <button class="pill" data-layout="concentric">Rings</button>
        <button class="pill" data-layout="grid">Grid</button>
      </div>
    </div>
    <nav class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-backdrop" data-close></div>
      <div class="drawer-panel" role="dialog" aria-label="Menu">
        <button class="drawer-close" data-close aria-label="Close menu">✕</button>
        <a href="../">中文 · Home</a>
        <a href="../#/review">Review</a>
        <a href="../#/phonetics">Phonetics</a>
        <a href="../network/">Network</a>
        <a href="./" class="is-active">Components</a>
        <div class="drawer-legend">
          <div class="drawer-legend-title">Component roles</div>
          <div class="drawer-legend-row"><i style="background: var(--role-meaning)"></i>Meaning</div>
          <div class="drawer-legend-row"><i style="background: var(--role-sound)"></i>Sound</div>
          <div class="drawer-legend-row"><i style="background: var(--role-iconic)"></i>Iconic</div>
          <div class="drawer-legend-row"><i style="background: var(--role-simplified)"></i>Simplified</div>
          <div class="drawer-legend-row"><i style="background: var(--role-deleted)"></i>Deleted</div>
        </div>
        <div class="drawer-legend">
          <div class="drawer-legend-title">Word tiers</div>
          <div class="drawer-legend-row"><i style="background: var(--word)"></i>Saved</div>
          <div class="drawer-legend-row"><i style="background: var(--word-learned)"></i>Learned</div>
        </div>
      </div>
    </nav>
    <div id="cy"></div>
    <div class="sheet-overlay" id="entitySheet" aria-hidden="true">
      <div class="sheet-overlay-backdrop" data-close-sheet></div>
      <div class="sheet-overlay-panel" role="dialog" aria-label="Entity details">
        <button class="sheet-overlay-close" data-close-sheet aria-label="Close">✕</button>
        <div class="sheet-overlay-pinyin" id="sheetPinyin"></div>
        <div class="sheet-overlay-hanzi" id="sheetHanzi"></div>
        <div class="sheet-overlay-meaning" id="sheetMeaning"></div>
        <div class="sheet-overlay-section" id="sheetMadeOfSec" hidden>
          <div class="sheet-overlay-section-head" id="sheetMadeOfHead">MADE OF</div>
          <div class="sheet-overlay-pieces" id="sheetMadeOf"></div>
        </div>
        <a class="sheet-overlay-open" id="sheetOpenInApp" href="#">Open in main app →</a>
      </div>
    </div>
    <div class="gesture-hint" id="gestureHint">Tap once to focus · tap again to open</div>
    <div class="page-id">components v4</div>

    <script type="module">
      import { buildGraph } from "./graph-data.mjs";

      function loadSavedV2(key) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return new Set();
          const p = JSON.parse(raw);
          if (p && p.version === 2 && Array.isArray(p.items)) {
            return new Set(p.items.map(([w]) => w).filter((w) => typeof w === "string"));
          }
          if (Array.isArray(p)) return new Set(p.filter((w) => typeof w === "string"));
        } catch (_) { /* ignore */ }
        return new Set();
      }

      async function loadCharsData() {
        try {
          const r = await fetch("../data-chars.json", { cache: "no-cache" });
          if (!r.ok) return {};
          const j = await r.json();
          return j.chars || {};
        } catch (_) { return {}; }
      }

      function layoutFor(name) {
        if (name === "concentric") {
          return {
            name: "concentric", animate: true, padding: 40, minNodeSpacing: 28,
            concentric: (n) => n.data("kind") === "word" ? 3 : n.data("kind") === "char" ? 2 : 1,
            levelWidth: () => 1,
          };
        }
        if (name === "grid") return { name: "grid", animate: true, padding: 30 };
        return {
          name: "cose", animate: true, padding: 40,
          idealEdgeLength: 90, nodeOverlap: 16,
          gravity: 0.3, numIter: 1500, randomize: true,
        };
      }

      function tierColorVar(tier) {
        if (tier === "learned") return "var(--word-learned)";
        if (tier === "wrote") return "var(--word-wrote)";
        return "var(--word)";
      }

      const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

      let cy = null;
      let charsData = {};

      // --- In-page entity sheet (no main-app redirect) -----------------
      const SUPABASE_URL = "https://oigbbgtzzqiceetasayy.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_YTd6bXMqUddNj4aFf1YRwA_T320qu3c";
      const wordDefCache = new Map();
      async function fetchWordDef(word) {
        if (wordDefCache.has(word)) return wordDefCache.get(word);
        try {
          const r = await fetch(
            `${SUPABASE_URL}/rest/v1/words?word=eq.${encodeURIComponent(word)}&select=pinyin,definitions`,
            { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } },
          );
          if (!r.ok) { wordDefCache.set(word, null); return null; }
          const rows = await r.json();
          const row = rows[0] || null;
          wordDefCache.set(word, row);
          return row;
        } catch (_) { wordDefCache.set(word, null); return null; }
      }

      const sheetEl = document.getElementById("entitySheet");
      const sheetPinyin = document.getElementById("sheetPinyin");
      const sheetHanzi = document.getElementById("sheetHanzi");
      const sheetMeaning = document.getElementById("sheetMeaning");
      const sheetMadeOfSec = document.getElementById("sheetMadeOfSec");
      const sheetMadeOfHead = document.getElementById("sheetMadeOfHead");
      const sheetMadeOf = document.getElementById("sheetMadeOf");
      const sheetOpenInApp = document.getElementById("sheetOpenInApp");
      function closeSheet() { sheetEl.setAttribute("aria-hidden", "true"); }
      sheetEl.addEventListener("click", (e) => {
        if (e.target.dataset.closeSheet !== undefined) closeSheet();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && sheetEl.getAttribute("aria-hidden") === "false") closeSheet();
      });
      function pieceMarkup(label, pinyin, meaning) {
        return (
          `<span class="sheet-overlay-piece">` +
            `<span class="sheet-overlay-piece-pinyin">${pinyin || ""}</span>` +
            `<span class="sheet-overlay-piece-glyph">${label}</span>` +
            `<span class="sheet-overlay-piece-meaning">${meaning || ""}</span>` +
          `</span>`
        );
      }
      function setSheetMadeOf(label, kind, resultPinyin, resultMeaning) {
        sheetMadeOfHead.textContent = kind === "word" ? "MADE OF" : "ETYMOLOGY";
        const pieces = kind === "word"
          ? [...label].map((c) => ({ char: c }))
          : ((charsData[label]?.components || [])
              .filter((c) => c && c.char && c.char !== "◎")
              .map((c) => ({ char: c.char })));
        if (pieces.length === 0) { sheetMadeOfSec.hidden = true; return; }
        const inner = [];
        pieces.forEach((p, i) => {
          if (i > 0) inner.push(`<span class="sheet-overlay-op">+</span>`);
          const cd = charsData[p.char];
          inner.push(pieceMarkup(p.char, cd?.pinyin || "", cd?.definitions?.[0] || ""));
        });
        inner.push(`<span class="sheet-overlay-op">=</span>`);
        inner.push(pieceMarkup(label, resultPinyin || "", resultMeaning || ""));
        sheetMadeOf.innerHTML = inner.join("");
        sheetMadeOfSec.hidden = false;
      }
      async function openSheet(node) {
        const d = node.data();
        const label = d.label;
        const kind = d.kind;
        if (kind === "word") {
          const row = await fetchWordDef(label);
          const pinyin = row?.pinyin || "";
          const defs = Array.isArray(row?.definitions) ? row.definitions : [];
          sheetPinyin.textContent = pinyin;
          sheetHanzi.textContent = label;
          sheetMeaning.textContent = defs.join(" · ");
          setSheetMadeOf(label, "word", pinyin, defs[0] || "");
          sheetOpenInApp.href = `../#/w/${encodeURIComponent(label)}`;
        } else {
          // char + component: same shape (component is just a char).
          const cd = charsData[label];
          sheetPinyin.textContent = cd?.pinyin || "";
          sheetHanzi.textContent = label;
          sheetMeaning.textContent = (cd?.definitions || []).slice(0, 4).join(" · ");
          setSheetMadeOf(label, "char", cd?.pinyin || "", cd?.definitions?.[0] || "");
          sheetOpenInApp.href = `../#/c/${encodeURIComponent(label)}`;
        }
        sheetEl.setAttribute("aria-hidden", "false");
      }
      // -------------------------------------------------------------------

      async function render() {
        const savedSet = loadSavedV2("chinese.saved");
        if (savedSet.size === 0) {
          document.body.innerHTML =
            '<div class="empty">' +
              '<div>No saved words yet.</div>' +
              '<div>Open the <a href="../">main app</a>, save a few, then come back.</div>' +
            "</div>";
          return;
        }
        const learnedSet = loadSavedV2("chinese.learned");
        // v99 (ADR-0011): the ✒ Wrote tier was removed — legacy wrote
        // items read as learned.
        const wroteSet = new Set();
        for (const w of loadSavedV2("chinese.wrote")) learnedSet.add(w);
        charsData = await loadCharsData();

        const { nodes, edges } = buildGraph({
          savedWords: [...savedSet],
          learnedSet, wroteSet,
          chars: charsData,
        });

        cy = cytoscape({
          container: document.getElementById("cy"),
          elements: [...nodes, ...edges],
          minZoom: 0.2, maxZoom: 4, wheelSensitivity: 0.4,
          style: [
            { selector: 'node[kind="word"]', style: {
              "label": "data(label)",
              "background-color": (e) => tierColorVar(e.data("tier")),
              "color": "#fff",
              "text-valign": "center", "text-halign": "center",
              "font-family": '"PingFang SC","Hiragino Sans GB","Source Han Sans SC",system-ui,sans-serif',
              "font-size": "18px", "font-weight": "500",
              "width": "mapData(len, 1, 6, 56, 110)",
              "height": "mapData(len, 1, 6, 56, 110)",
              "shape": "round-rectangle", "padding": "8px",
              "text-wrap": "wrap", "text-max-width": "90px",
              "border-width": 0,
            }},
            { selector: 'node[kind="char"]', style: {
              "label": "data(label)",
              "background-color": cssVar("--char"),
              "color": "#fff",
              "text-valign": "center", "text-halign": "center",
              "font-family": '"PingFang SC","Hiragino Sans GB","Source Han Sans SC",system-ui,sans-serif',
              "font-size": "16px", "font-weight": "500",
              // 44px is the minimum touch-target target.
              "width": 44, "height": 44,
              "shape": "round-hexagon",
            }},
            { selector: 'node[kind="component"]', style: {
              "label": "data(label)",
              "background-color": (e) => `var(--role-${e.data("role") || "unknown"})`,
              "color": "#fff",
              "text-valign": "center", "text-halign": "center",
              "font-family": '"PingFang SC","Hiragino Sans GB","Source Han Sans SC",system-ui,sans-serif',
              "font-size": "14px",
              "width": 44, "height": 44,
              "shape": "ellipse",
            }},
            { selector: "edge", style: {
              "width": 1.5,
              "line-color": cssVar("--edge"),
              "curve-style": "bezier",
              "opacity": 0.55,
            }},
            { selector: 'node.active', style: {
              "border-width": 3, "border-color": cssVar("--accent"),
            }},
            { selector: '.faded', style: { "opacity": 0.55 } },
            { selector: '.highlight', style: { "opacity": 1 } },
            { selector: '.match', style: {
              "border-width": 3,
              "border-color": cssVar("--accent"),
            }},
          ],
          layout: layoutFor("cose"),
        });

        // First-visit gesture hint (UX-7): floats over the canvas, auto-
        // dismisses after 5s or on the first interaction.
        (function () {
          try { if (sessionStorage.getItem('hint.seen.graph')) return; } catch (_) {}
          const el = document.getElementById('gestureHint');
          if (!el) return;
          el.classList.add('show');
          let done = false;
          const hide = () => {
            if (done) return; done = true;
            el.classList.remove('show');
            try { sessionStorage.setItem('hint.seen.graph', '1'); } catch (_) {}
            setTimeout(() => el.remove(), 300);
          };
          setTimeout(hide, 5000);
          cy.one('tap dbltap taphold', hide);
        })();

        // Two-step interaction: first tap on a card activates it (highlights
        // the neighborhood while keeping the rest legible); second tap on
        // the SAME card opens the bottom-sheet in the main app via the
        // deep-link hash. Tap blank to clear.
        let activeNodeId = null;
        function deepLink(node) {
          const kind = node.data("kind");
          const label = node.data("label");
          // Components don't have their own sheet — open as a char.
          const prefix = kind === "word" ? "w" : "c";
          window.location.href = `../#/${prefix}/${encodeURIComponent(label)}`;
        }
        cy.on("tap", "node", (e) => {
          const node = e.target;
          if (activeNodeId === node.id()) {
            deepLink(node);
            return;
          }
          activeNodeId = node.id();
          cy.nodes().removeClass("active");
          node.addClass("active");
          cy.elements().addClass("faded").removeClass("highlight");
          node.closedNeighborhood().removeClass("faded").addClass("highlight");
        });
        cy.on("tap", (e) => {
          if (e.target === cy) {
            activeNodeId = null;
            cy.elements().removeClass("faded highlight match active");
          }
        });
      }

      // Hamburger drawer.
      const drawer = document.getElementById("drawer");
      const hamburger = document.getElementById("hamburger");
      function setDrawer(open) {
        drawer.setAttribute("aria-hidden", open ? "false" : "true");
        hamburger.setAttribute("aria-expanded", open ? "true" : "false");
      }
      hamburger.addEventListener("click", () =>
        setDrawer(drawer.getAttribute("aria-hidden") !== "false"),
      );
      drawer.addEventListener("click", (e) => {
        if (e.target.dataset.close !== undefined) setDrawer(false);
      });

      // Toolbar
      const toolbar = document.getElementById("toolbar");
      toolbar.addEventListener("click", (e) => {
        const btn = e.target.closest(".pill");
        if (!btn || !cy) return;
        if (btn.dataset.layout) {
          [...toolbar.querySelectorAll("[data-layout]")].forEach((b) =>
            b.classList.toggle("is-active", b === btn),
          );
          cy.layout(layoutFor(btn.dataset.layout)).run();
        }
      });

      // Search → highlight matches (label === query, or pinyin starts with query)
      const search = document.getElementById("search");
      search.addEventListener("input", () => {
        if (!cy) return;
        const q = search.value.trim();
        cy.elements().removeClass("match faded highlight");
        if (!q) return;
        const norm = (s) =>
          (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
        const qn = norm(q);
        const matches = cy.nodes().filter((n) => {
          const label = n.data("label");
          if (label === q) return true;
          if (q.length === 1 && label.includes(q)) return true;
          const py = charsData[label]?.pinyin;
          if (py && norm(py).startsWith(qn)) return true;
          return false;
        });
        if (matches.length === 0) return;
        cy.elements().addClass("faded");
        matches.addClass("match");
        const hood = matches.closedNeighborhood();
        matches.add(hood).removeClass("faded").addClass("highlight");
      });

      render();
    </script>
    <script>
      // Same service worker as the main app (scope /chineseapp/) so this
      // page is reachable offline after first visit and installable.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('../sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
